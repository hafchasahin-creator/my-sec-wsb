<script>
const W = 2048, H = 1214, TAU = Math.PI * 2;
const BG = '#f5f5eb';

/* ---------- timeline (seconds) ---------- */
const LEAD       = 0.9;    /* wordmark settles before the first stone arrives */
const FORM_DUR   = 8.6;    /* stones arrive one by one over this span         */
const ENTER      = 0.58;   /* a single stone's drop-and-settle                */
const INTRO_END  = LEAD + FORM_DUR + ENTER;
const COLOR_RAMP = 3.2;    /* wing colour washing into the finished numeral   */
const DURATION   = 24;     /* length of the exported video                    */

const clamp01 = v => (v < 0 ? 0 : v > 1 ? 1 : v);
const smooth = v => { v = clamp01(v); return v * v * (3 - 2 * v); };
const easeOutBack = p => { const c = 1.30, q = p - 1; return 1 + (c + 1) * q * q * q + c * q * q; };

/* ---------- deterministic rng ---------- */
let _s = 20260730;
const rnd = () => ((_s = (_s * 1664525 + 1013904223) >>> 0) / 4294967296);
const rr = (a, b) => a + rnd() * (b - a);

/* ---------- colour helpers (mix in linear light) ---------- */
const srgb = v => (v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4));
const lin = v => (v <= 0.0031308 ? v * 12.92 : 1.055 * Math.pow(v, 1 / 2.4) - 0.055);
const hex2lin = h => {
  const n = parseInt(h.slice(1), 16);
  return [srgb(((n >> 16) & 255) / 255), srgb(((n >> 8) & 255) / 255), srgb((n & 255) / 255)];
};
const lin2css = c => 'rgb(' + c.map(v => Math.round(clamp01(lin(v)) * 255)).join(',') + ')';
const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const WHITE = [1, 1, 1], BLACK = [0, 0, 0];
const lighten = (c, t) => mix(c, WHITE, t);
const darken = (c, t) => mix(c, BLACK, t);

/* butterfly wing palette, sampled from the original plate, ordered so the
   cycle reads as one continuous shimmer travelling over the stones */
const WING = ['#2f4a35','#7fae87','#1f6f6b','#5c8fb0','#e7dcc2','#c9a227','#c9542b','#a8352a','#3a2a24']
  .map(hex2lin);
/* the granites the wing colour is bedded into, so the bare stones aren't uniform */
const GRANITE = ['#8b8880','#7d7a72','#9a968c','#6f6c66','#a8a49a','#847d70'].map(hex2lin);

const CYCLE = 0.40;                 /* palette steps per second */
const LOOP = WING.length / CYCLE;   /* seconds for one full pass of the palette */
const ROCK = TAU * 2 / LOOP;        /* 2 rocks per loop  */
const BREATHE = TAU * 3 / LOOP;     /* 3 breaths per loop */

function wingAt(t) {                /* smooth loop through the wing palette */
  const n = WING.length, u = ((t % n) + n) % n, i = Math.floor(u), f = u - i;
  return mix(WING[i], WING[(i + 1) % n], smooth(f));
}

/* ---------- build the 5 as a field of stones ---------- */
/* the glyph is rasterised to a mask, distance-transformed, then packed with
   pebbles: fat parts of the stroke get big stones, tips get small ones */
const FIVE = { x: 1358, y: 369, w: 415, h: 576 };   /* ink box, matched to the plate */
const SCALE = 2;                                    /* mask resolution divisor */

/* the numeral's centreline, in box coordinates, followed the way a pen would:
   right end of the top bar, left along it, down the stem, round the bowl, out
   to the tail. Stones arrive in this order, so the 5 draws itself. */
const STROKE = [[0.98,0.06],[0.55,0.07],[0.16,0.07],[0.15,0.24],[0.16,0.38],[0.45,0.36],
                [0.75,0.45],[0.93,0.60],[0.90,0.78],[0.70,0.92],[0.40,0.95],[0.14,0.87],[0.02,0.80]]
  .map(([u, v]) => [FIVE.x + u * FIVE.w, FIVE.y + v * FIVE.h]);

function alongStroke(px, py) {       /* arc length of the nearest point on STROKE */
  let best = Infinity, bestAt = 0, run = 0;
  for (let i = 0; i < STROKE.length - 1; i++) {
    const [ax, ay] = STROKE[i], [bx, by] = STROKE[i + 1];
    const dx = bx - ax, dy = by - ay, len = Math.hypot(dx, dy);
    const u = clamp01(((px - ax) * dx + (py - ay) * dy) / (len * len));
    const d = Math.hypot(px - (ax + dx * u), py - (ay + dy * u));
    if (d < best) { best = d; bestAt = run + u * len; }
    run += len;
  }
  return bestAt / run;
}

function buildMask() {
  const mw = Math.ceil(W / SCALE), mh = Math.ceil(H / SCALE);
  const cv = new OffscreenCanvas(mw, mh), x = cv.getContext('2d');
  x.fillStyle = '#000';
  const S = 800;
  x.font = '500 ' + S + 'px CW';
  const m = x.measureText('5');
  const iw = m.actualBoundingBoxRight + m.actualBoundingBoxLeft;
  const ih = m.actualBoundingBoxAscent + m.actualBoundingBoxDescent;
  x.save();
  x.translate(FIVE.x / SCALE, FIVE.y / SCALE);
  x.scale(FIVE.w / iw / SCALE, FIVE.h / ih / SCALE);
  x.fillText('5', m.actualBoundingBoxLeft, m.actualBoundingBoxAscent);
  x.restore();
  const d = x.getImageData(0, 0, mw, mh).data;
  const a = new Uint8Array(mw * mh);
  for (let i = 0; i < a.length; i++) a[i] = d[i * 4 + 3] > 110 ? 1 : 0;
  return { a, mw, mh };
}

function distanceField({ a, mw, mh }) {             /* chamfer distance transform */
  const INF = 1e6, D = new Float32Array(mw * mh);
  for (let i = 0; i < D.length; i++) D[i] = a[i] ? INF : 0;
  const d1 = 1, d2 = Math.SQRT2;
  for (let y = 1; y < mh - 1; y++) for (let x = 1; x < mw - 1; x++) {
    const i = y * mw + x; if (!a[i]) continue;
    D[i] = Math.min(D[i], D[i - 1] + d1, D[i - mw] + d1, D[i - mw - 1] + d2, D[i - mw + 1] + d2);
  }
  for (let y = mh - 2; y > 0; y--) for (let x = mw - 2; x > 0; x--) {
    const i = y * mw + x; if (!a[i]) continue;
    D[i] = Math.min(D[i], D[i + 1] + d1, D[i + mw] + d1, D[i + mw + 1] + d2, D[i + mw - 1] + d2);
  }
  return D;
}

function makeStone(x, y, r) {
  const pts = [], n = Math.round(rr(11, 14));
  for (let i = 0; i < n; i++) pts.push({ a: (i / n) * TAU + rr(-0.09, 0.09), rad: rr(0.78, 1.12) });
  const speck = [];
  for (let i = 0; i < Math.round(rr(14, 30)); i++) {
    const a = rnd() * TAU, d = Math.sqrt(rnd()) * 0.86;
    speck.push({ x: Math.cos(a) * d, y: Math.sin(a) * d, r: rr(0.03, 0.11),
                 a: rnd() * TAU, l: rnd() < 0.55, o: rr(0.10, 0.34) });
  }
  const facets = [];
  for (let i = 0; i < 2; i++) {
    const a = rnd() * TAU;
    facets.push({ x: Math.cos(a) * 0.3, y: Math.sin(a) * 0.3, r: rr(0.38, 0.62),
                  a: rnd() * TAU, l: i === 0, o: rr(0.08, 0.18) });
  }
  const inAng = rnd() * TAU;
  return { x, y, r, pts, speck, facets,
           rot: rnd() * TAU, phase: rnd(),
           /* how much wing colour this stone takes: a few stay near-granite,
              the way the drab moths sit among the bright wings on the plate */
           tint: rnd() < 0.22 ? rr(0.12, 0.34) : rr(0.55, 0.9),
           stoneCol: GRANITE[Math.floor(rnd() * GRANITE.length)],
           squash: rr(0.80, 0.97), aspect: rnd() * TAU,
           /* where it falls in from, and how it tumbles on the way */
           inX: Math.cos(inAng) * rr(30, 90), inY: Math.sin(inAng) * rr(30, 90) - rr(20, 70),
           inSpin: rr(-0.9, 0.9), arrive: 0 };
}

function packStones() {
  const mask = buildMask(), D = distanceField(mask), { mw, mh } = mask;
  const taken = new Uint8Array(mw * mh);             /* cells already claimed */
  const stones = [];

  /* one pass = greedy dart-throw from the thickest unclaimed part outwards */
  function pass(minD, rMin, rMax, grow, spacing, jitter) {
    const idx = [];
    for (let i = 0; i < D.length; i++) if (D[i] > minD && !taken[i]) idx.push(i);
    idx.sort((p, q) => D[q] - D[p]);
    for (const i of idx) {
      if (taken[i]) continue;
      const mx = i % mw, my = (i - mx) / mw;
      const r = Math.max(rMin, Math.min(rMax, D[i] * SCALE * grow));
      stones.push(makeStone(mx * SCALE + rr(-jitter, jitter), my * SCALE + rr(-jitter, jitter), r));
      const br = Math.max(1, (r * spacing) / SCALE);
      const x0 = Math.max(0, Math.floor(mx - br)), x1 = Math.min(mw - 1, Math.ceil(mx + br));
      const y0 = Math.max(0, Math.floor(my - br)), y1 = Math.min(mh - 1, Math.ceil(my + br));
      for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
        if ((x - mx) ** 2 + (y - my) ** 2 <= br * br) taken[y * mw + x] = 1;
      }
    }
  }

  /* GAP is the one knob to turn: centre-to-centre spacing as a multiple of the
     stone radius, so any value > 1 leaves cream showing between every stone.
     Raise it for fewer, further-apart stones; drop it toward 1 to close up. */
  const GAP = 1.52;
  pass(4.2, 16, 34, 0.80, GAP, 3);        /* big stones down the spine of the stroke */
  pass(2.6, 10, 19, 0.76, GAP * 0.96, 2); /* smaller ones set into the shoulders */

  /* a handful of strays drifting off the glyph, as on the original plate */
  const strays = [[1345, 902, 17], [1370, 858, 12], [1424, 964, 19], [1510, 334, 13],
                  [1794, 468, 15], [1598, 978, 11], [1748, 840, 14]];
  for (const [x, y, r] of strays) stones.push(makeStone(x, y, r));

  /* arrival times follow the pen: the numeral writes itself in stone */
  for (const s of stones) s.order = clamp01(alongStroke(s.x, s.y) + rr(-0.012, 0.012));
  stones.sort((a, b) => a.order - b.order);
  stones.forEach((s, i) => { s.arrive = LEAD + (i / Math.max(1, stones.length - 1)) * FORM_DUR; });

  /* drawn big-behind-small, but arrival order is kept on `arrive` */
  return stones.slice().sort((a, b) => b.r - a.r);
}

/* ---------- drawing ---------- */
function blobPath(ctx, pts, r) {
  const P = pts.map(p => [Math.cos(p.a) * p.rad * r, Math.sin(p.a) * p.rad * r]);
  const n = P.length;
  const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  const m0 = mid(P[n - 1], P[0]);
  ctx.beginPath();
  ctx.moveTo(m0[0], m0[1]);
  for (let i = 0; i < n; i++) {
    const m = mid(P[i], P[(i + 1) % n]);
    ctx.quadraticCurveTo(P[i][0], P[i][1], m[0], m[1]);
  }
  ctx.closePath();
}

function drawStone(ctx, s, t, colourGain) {
  const p = clamp01((t - s.arrive) / ENTER);
  if (p <= 0) return;
  const e = easeOutBack(p);                          /* lands with a small settle */

  /* dust ring kicked up as it touches down */
  const age = t - s.arrive - ENTER * 0.55;
  if (age > 0 && age < 0.45) {
    const q = age / 0.45;
    ctx.save();
    ctx.beginPath();
    ctx.arc(s.x, s.y + s.r * 0.25, s.r * (0.9 + 1.9 * q), 0, TAU);
    ctx.strokeStyle = 'rgba(126,116,98,' + (0.16 * (1 - q)).toFixed(3) + ')';
    ctx.lineWidth = s.r * 0.3 * (1 - q);
    ctx.stroke();
    ctx.restore();
  }

  /* the shimmer travels diagonally across the numeral once the stones are set */
  const flow = (s.x * 0.55 + s.y * 0.85) / 132;
  const gain = colourGain * smooth(p);
  const col = mix(s.stoneCol, wingAt(t * CYCLE - flow + s.phase * 1.05), s.tint * gain);
  const breathe = Math.sin(t * BREATHE + s.phase * TAU) * 0.014 * colourGain;

  ctx.save();
  ctx.globalAlpha = Math.min(1, p * 2.6);
  ctx.translate(s.x + s.inX * (1 - e), s.y + s.inY * (1 - e));
  ctx.rotate(s.rot + s.inSpin * (1 - e) + Math.sin(t * ROCK + s.phase * TAU) * 0.028 * colourGain);
  const grow = 0.40 + 0.60 * e;
  ctx.rotate(s.aspect);
  ctx.scale(grow * (1 + breathe), grow * s.squash * (1 - breathe * 0.7));
  ctx.rotate(-s.aspect);

  blobPath(ctx, s.pts, s.r);
  ctx.shadowColor = 'rgba(74,64,48,0.30)';
  ctx.shadowBlur = s.r * 0.55;
  ctx.shadowOffsetX = s.r * 0.10;
  ctx.shadowOffsetY = s.r * 0.18;
  const g = ctx.createLinearGradient(-s.r * 0.75, -s.r * 0.85, s.r * 0.65, s.r * 0.95);
  g.addColorStop(0, lin2css(lighten(col, 0.52)));
  g.addColorStop(0.42, lin2css(col));
  g.addColorStop(1, lin2css(darken(col, 0.52)));
  ctx.fillStyle = g;
  ctx.fill();
  ctx.shadowColor = 'transparent';

  ctx.clip();
  for (const f of s.facets) {                        /* broad granite facets */
    ctx.beginPath();
    ctx.ellipse(f.x * s.r, f.y * s.r, f.r * s.r, f.r * s.r * 0.7, f.a, 0, TAU);
    ctx.globalAlpha = f.o;
    ctx.fillStyle = lin2css(f.l ? lighten(col, 0.5) : darken(col, 0.45));
    ctx.fill();
  }
  for (const sp of s.speck) {                        /* mineral grain */
    ctx.beginPath();
    ctx.ellipse(sp.x * s.r, sp.y * s.r, sp.r * s.r, sp.r * s.r * 0.72, sp.a, 0, TAU);
    ctx.globalAlpha = sp.o;
    ctx.fillStyle = lin2css(sp.l ? lighten(col, 0.6) : darken(col, 0.55));
    ctx.fill();
  }

  blobPath(ctx, s.pts, s.r * 0.99);                  /* wet rim light, top-left */
  ctx.lineWidth = Math.max(1.2, s.r * 0.16);
  ctx.strokeStyle = lin2css(lighten(col, 0.72));
  ctx.globalAlpha = 0.30 + 0.14 * Math.sin(t * ROCK + s.phase * TAU);
  ctx.stroke();
  ctx.restore();
}

function drawWordmark(ctx, t) {
  ctx.save();
  ctx.globalAlpha = smooth(t / 0.9);                 /* fades up before the stones */
  ctx.drawImage(mark, 182, 522, 170, 170);
  ctx.fillStyle = '#141413';
  ctx.font = '500 172px CW';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText('Claude Opus', 379, 667);
  ctx.restore();
}

/* ---------- sound: granite, struck ---------- */
/* every voice is synthesised here — one clack per stone as it lands, a low
   drone under the whole thing, then soft bells once the wing colour arrives */
let audio = null;

function buildAudio(stones, startAt) {
  const ac = new (window.AudioContext || window.webkitAudioContext)();
  const t0 = ac.currentTime + startAt;

  const master = ac.createGain(); master.gain.value = 0.95;
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -18; comp.ratio.value = 3; comp.attack.value = 0.003; comp.release.value = 0.25;

  /* a small stone room: noise burst with an exponential tail */
  const irLen = Math.floor(ac.sampleRate * 2.4);
  const ir = ac.createBuffer(2, irLen, ac.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = ir.getChannelData(ch);
    for (let i = 0; i < irLen; i++) {
      const u = i / irLen;
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - u, 3.1) * (i < ac.sampleRate * 0.008 ? 0.2 : 1);
    }
  }
  const verb = ac.createConvolver(); verb.buffer = ir;
  const wet = ac.createGain(); wet.gain.value = 0.34;
  const dry = ac.createGain(); dry.gain.value = 0.85;

  const out = ac.createGain();
  master.connect(comp);
  comp.connect(dry); dry.connect(out);
  comp.connect(verb); verb.connect(wet); wet.connect(out);

  const dest = ac.createMediaStreamDestination();
  out.connect(dest);
  out.connect(ac.destination);

  /* shared noise bed for the clacks and the air */
  const nLen = Math.floor(ac.sampleRate * 2);
  const noise = ac.createBuffer(1, nLen, ac.sampleRate);
  const nd = noise.getChannelData(0);
  for (let i = 0; i < nLen; i++) nd[i] = Math.random() * 2 - 1;

  /* low drone, the weight of the stone */
  for (const [f, lvl] of [[110, 0.055], [164.81, 0.032], [55, 0.045]]) {
    const o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = f;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(lvl, t0 + 2.2);
    g.gain.setValueAtTime(lvl, t0 + DURATION - 3);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + DURATION - 0.2);
    const lfo = ac.createOscillator(); lfo.frequency.value = 0.07 + Math.random() * 0.06;
    const lg = ac.createGain(); lg.gain.value = lvl * 0.35;
    lfo.connect(lg); lg.connect(g.gain);
    o.connect(g); g.connect(master);
    o.start(t0); lfo.start(t0); o.stop(t0 + DURATION); lfo.stop(t0 + DURATION);
  }

  /* air rising through the formation, peaking as the last stone lands */
  {
    const src = ac.createBufferSource(); src.buffer = noise; src.loop = true;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 0.7;
    lp.frequency.setValueAtTime(220, t0);
    lp.frequency.linearRampToValueAtTime(2600, t0 + INTRO_END);
    lp.frequency.linearRampToValueAtTime(700, t0 + INTRO_END + 4);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.030, t0 + INTRO_END);
    g.gain.exponentialRampToValueAtTime(0.006, t0 + INTRO_END + 4);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + DURATION - 0.2);
    src.connect(lp); lp.connect(g); g.connect(master);
    src.start(t0); src.stop(t0 + DURATION);
  }

  /* one clack per stone, pitched by its size and panned by its position */
  const clack = (when, r, x) => {
    const size = clamp01((r - 8) / 26);               /* 0 chip .. 1 boulder */
    const pan = ac.createStereoPanner();
    pan.pan.value = clamp01((x - FIVE.x) / FIVE.w) * 1.1 - 0.55;
    pan.connect(master);

    const src = ac.createBufferSource();
    src.buffer = noise;
    src.playbackRate.value = rr(0.85, 1.2);
    const bp = ac.createBiquadFilter();
    bp.type = 'bandpass'; bp.Q.value = 1.5;
    bp.frequency.value = 2600 - 1500 * size;
    const ng = ac.createGain();
    const nPeak = 0.17 + 0.16 * size, nDec = 0.07 + 0.07 * size;
    ng.gain.setValueAtTime(0.0001, when);
    ng.gain.linearRampToValueAtTime(nPeak, when + 0.004);
    ng.gain.exponentialRampToValueAtTime(0.0001, when + nDec);
    src.connect(bp); bp.connect(ng); ng.connect(pan);
    src.start(when, rnd() * 1.5, nDec + 0.05);

    const o = ac.createOscillator();                  /* the body of the tock */
    o.type = 'triangle';
    const f = 330 - 170 * size + rr(-18, 18);
    o.frequency.setValueAtTime(f * 1.5, when);
    o.frequency.exponentialRampToValueAtTime(f, when + 0.05);
    const og = ac.createGain();
    og.gain.setValueAtTime(0.0001, when);
    og.gain.linearRampToValueAtTime(0.10 + 0.11 * size, when + 0.006);
    og.gain.exponentialRampToValueAtTime(0.0001, when + 0.14 + 0.10 * size);
    o.connect(og); og.connect(pan);
    o.start(when); o.stop(when + 0.4);

    const h = ac.createOscillator();                  /* bright chip on the edge */
    h.type = 'sine'; h.frequency.value = rr(1500, 2600);
    const hg = ac.createGain();
    hg.gain.setValueAtTime(0.0001, when);
    hg.gain.linearRampToValueAtTime(0.035 * (1 - size * 0.5), when + 0.003);
    hg.gain.exponentialRampToValueAtTime(0.0001, when + 0.05);
    h.connect(hg); hg.connect(pan);
    h.start(when); h.stop(when + 0.1);
  };
  for (const s of stones) clack(t0 + s.arrive + ENTER * 0.55, s.r, s.x);

  /* the colour arriving: a slow pad swell, then soft bells over the shimmer */
  for (const f of [146.83, 220, 349.23]) {
    const o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = f;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t0 + INTRO_END - 0.6);
    g.gain.exponentialRampToValueAtTime(0.042, t0 + INTRO_END + 2.2);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + DURATION - 0.2);
    o.connect(g); g.connect(master);
    o.start(t0 + INTRO_END - 0.6); o.stop(t0 + DURATION);
  }
  const SCALEN = [293.66, 349.23, 392, 440, 523.25, 587.33];
  for (let when = INTRO_END + 0.9, k = 0; when < DURATION - 2.2; when += rr(1.3, 2.1), k++) {
    const f = SCALEN[Math.floor(rnd() * SCALEN.length)];
    const pan = ac.createStereoPanner(); pan.pan.value = rr(-0.5, 0.5); pan.connect(master);
    for (const [m, lvl, dec] of [[1, 0.055, 2.4], [2.01, 0.022, 1.5], [3.02, 0.010, 0.9]]) {
      const o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = f * m;
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, t0 + when);
      g.gain.linearRampToValueAtTime(lvl, t0 + when + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + when + dec);
      o.connect(g); g.connect(pan);
      o.start(t0 + when); o.stop(t0 + when + dec + 0.1);
    }
  }

  /* tail off cleanly at the end of the exported clip */
  master.gain.setValueAtTime(0.95, t0 + DURATION - 1.4);
  master.gain.linearRampToValueAtTime(0, t0 + DURATION - 0.1);

  return { ac, stream: dest.stream };
}

/* ---------- loop ---------- */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const hint = document.getElementById('hint');
let stones = [], t0 = 0, running = false;

function render(t) {
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, W, H);
  drawWordmark(ctx, t);
  const colourGain = smooth((t - INTRO_END) / COLOR_RAMP);
  for (const s of stones) drawStone(ctx, s, t, colourGain);
}

function frame(now) {
  render((now - t0) / 1000);
  if (running) requestAnimationFrame(frame);
}

function begin(withSound) {
  running = true;
  const lead = 0.25;
  if (withSound && !audio) audio = buildAudio(stones, lead);
  t0 = performance.now() + lead * 1000;
  requestAnimationFrame(frame);
}

(async () => {
  await document.fonts.load('500 172px CW');
  await document.fonts.load('500 800px CW');
  await document.fonts.ready;
  if (!mark.complete) await new Promise(r => (mark.onload = mark.onerror = r));
  stones = packStones();

  window.renderAt = t => render(t);                 /* still-frame export */
  window.begin = begin;                             /* video export */
  window.audioStream = () => audio && audio.stream;
  window.__stoneCount = stones.length;
  window.__duration = DURATION;
  window.__ready = true;

  const still = new URLSearchParams(location.search).get('t');
  if (still !== null) { render(Number(still)); hint.remove(); return; }

  begin(false);                                     /* silent until asked */
  const go = () => { hint.classList.add('gone'); running = false; begin(true); };
  hint.addEventListener('click', go);
  addEventListener('pointerdown', go, { once: true });
})();
</script>
