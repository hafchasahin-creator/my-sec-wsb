    /* ============================================================
       THEME — publish CONFIG.theme as custom properties. Everything
       tinted in the stylesheet reads from these three values.
       ============================================================ */
    const theme = Object.assign({ accent: '#ed4245', glow: '#ffffff', beat: '#ffffff' }, CONFIG.theme);
    root.style.setProperty('--accent', theme.accent);
    root.style.setProperty('--glow', theme.glow);
    root.style.setProperty('--beat-color', theme.beat);

    document.title = CONFIG.pageTitle || CONFIG.username;
    profilePicture.src = pick(CONFIG.profilePicture);
    profilePicture.alt = CONFIG.username;

    /* ============================================================
       BACKGROUND — a still, a clip, or the two alternating.

       clip plays ─▶ ends ─▶ still fades up ─▶ holds ─▶ clip restarts
       underneath ─▶ still fades away ─▶ repeat.

       Any failure to load or play the clip leaves the still on screen, so
       the page still looks right when the video is missing.
       ============================================================ */
    const background = $('background');                 // the still
    const clip = $('background-clip');

    // every still in CONFIG.backgroundImage takes its turn, in order —
    // clip, photo 1, clip, photo 2, and around again
    const stills = [].concat(CONFIG.backgroundImage || []).filter(s => s && !isVideo(s));
    let stillIndex = 0;

    // a video passed as backgroundImage still works — treat it as the clip
    const videoInList = [].concat(CONFIG.backgroundImage || []).find(isVideo);
    const clipSrc = CONFIG.backgroundVideo || videoInList || '';
    const stillSrc = stills[0] || '';

    // the later photos are fetched up front so a swap never shows a blank frame
    stills.slice(1).forEach(src => { const img = new Image(); img.src = src; });

    const cycle = Object.assign({ enabled: true, photoHold: 5200, fade: 1600 },
                                CONFIG.backgroundCycle);
    root.style.setProperty('--bg-fade', cycle.fade + 'ms');

    if (stillSrc) background.src = stillSrc;

    let cycleTimer = null;

    function showStill() {
        background.classList.add('show');
        clip.classList.remove('show');
    }

    /* Swap to the next photo while the layer is still hidden, waiting for the
       decode so the fade never starts on an undecoded image. */
    async function showNextStill() {
        if (stills.length > 1) {
            stillIndex = (stillIndex + 1) % stills.length;
            background.src = stills[stillIndex];
            try { await background.decode(); } catch { /* fall through and show it */ }
        }
        showStill();
    }

    function showClip() {
        clip.classList.add('show');
        background.classList.remove('show');
    }

    if (clipSrc) {
        clip.src = clipSrc;
        clip.loop = !(cycle.enabled && stillSrc);       // looping is the fallback
        showClip();

        // if the clip cannot load or decode, fall back to the still for good
        const failToStill = () => {
            clearTimeout(cycleTimer);
            clip.loop = false;
            showStill();
        };
        clip.addEventListener('error', failToStill);
        clip.addEventListener('stalled', () => { if (!clip.readyState) failToStill(); });

        if (cycle.enabled && stillSrc) {
            clip.addEventListener('ended', () => {
                showNextStill();                         // next photo fades up over the last frame

                clearTimeout(cycleTimer);
                cycleTimer = setTimeout(() => {
                    // restart the clip underneath first, so the photo fades
                    // away onto moving footage rather than a frozen frame
                    clip.currentTime = 0;
                    clip.play().catch(failToStill);
                    showClip();
                }, cycle.fade + cycle.photoHold);
            });
        }
    } else {
        showStill();
    }

    /* the tab icon is set further down, alongside the embed metadata */

    /* ---------- status modes ---------- */
    let currentStatus = null;

    function setStatus(mode, textOverride) {
        const preset = STATUS_MODES[mode] || STATUS_MODES.offline;
        currentStatus = mode;

        // `anim-*` selects the dot's behaviour: ping, dim or swell
        statusDot.className = 'status-dot ' + mode +
                              (preset.anim ? ' anim-' + preset.anim : '');
        const dotColor = (CONFIG.theme && CONFIG.theme.accentStatus) ? theme.accent : preset.color;
        statusDot.style.color = dotColor;
        statusDot.style.background = dotColor;
        statusDot.style.boxShadow = preset.glow === false ? 'none' : `0 0 6px ${dotColor}`;
        statusText.textContent = textOverride || preset.label;

        // keep the picker's checkmark in step
        statusMenu.querySelectorAll('.status-option').forEach(opt => {
            opt.setAttribute('aria-checked', String(opt.dataset.mode === mode));
        });
    }

    /* ============================================================
       STATUS PICKER — tapping the status opens a small menu.
       A manual choice wins permanently: live presence stops
       overwriting it, otherwise the next poll would undo the click.
       ============================================================ */
    const statusMenu = $('status-menu');
    const statusRow = $('discord-status');
    const picker = Object.assign({ enabled: true, options: ['dnd', 'silent', 'normal'],
                                   silentMutes: true }, CONFIG.statusPicker);
    let manualStatus = false;
    let menuOpen = false;

    const CHECK_SVG = `<svg class="opt-check" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4 4L19 7"/></svg>`;

    function buildPicker() {
        picker.options.forEach(mode => {
            const preset = STATUS_MODES[mode];
            if (!preset) return;

            const opt = document.createElement('button');
            opt.type = 'button';
            opt.className = 'status-option';
            opt.dataset.mode = mode;
            opt.setAttribute('role', 'menuitemradio');
            opt.setAttribute('aria-checked', 'false');
            opt.innerHTML = `<span class="opt-dot" style="--opt-color:${preset.color}"></span>
                             <span class="opt-label"></span>${CHECK_SVG}`;
            opt.querySelector('.opt-label').textContent = preset.label;
            opt.addEventListener('click', (e) => {
                e.stopPropagation();
                chooseStatus(mode);
            });
            statusMenu.appendChild(opt);
        });

        statusRow.classList.add('interactive');
        statusRow.tabIndex = 0;
        statusRow.setAttribute('role', 'button');
        statusRow.setAttribute('aria-haspopup', 'menu');
        statusRow.setAttribute('aria-expanded', 'false');
        statusRow.insertAdjacentHTML('beforeend',
            `<svg class="status-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                  stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
                  aria-hidden="true"><path d="m5 8 7 7 7-7"/></svg>`);
    }

    function openMenu() {
        menuOpen = true;
        statusMenu.classList.add('open');
        statusRow.classList.add('open');
        statusRow.setAttribute('aria-expanded', 'true');
    }

    function closeMenu() {
        menuOpen = false;
        statusMenu.classList.remove('open');
        statusRow.classList.remove('open');
        statusRow.setAttribute('aria-expanded', 'false');
    }

    function chooseStatus(mode) {
        manualStatus = true;                       // presence no longer overrides
        setStatus(mode);
        closeMenu();
        statusRow.focus();

        // silent mode does what it says
        if (picker.silentMutes) {
            const silent = mode === 'silent';
            if (audio.muted !== silent) toggleMute();
        }
    }

    if (picker.enabled && !cyclingStatusPlanned()) {
        buildPicker();

        statusRow.addEventListener('click', (e) => {
            e.stopPropagation();
            menuOpen ? closeMenu() : openMenu();
        });

        statusRow.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                e.stopPropagation();
                openMenu();
                statusMenu.querySelector('.status-option')?.focus();
            }
        });

        // arrow keys walk the menu, escape closes it
        statusMenu.addEventListener('keydown', (e) => {
            const opts = [...statusMenu.querySelectorAll('.status-option')];
            const i = opts.indexOf(document.activeElement);
            if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
                e.preventDefault();
                e.stopPropagation();
                const next = e.key === 'ArrowDown'
                    ? (i + 1) % opts.length
                    : (i - 1 + opts.length) % opts.length;
                opts[next].focus();
            } else if (e.key === 'Escape') {
                e.stopPropagation();
                closeMenu();
                statusRow.focus();
            }
        });

        document.addEventListener('click', () => { if (menuOpen) closeMenu(); });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && menuOpen) closeMenu();
        });
    }

    // the picker and a cycling status are mutually exclusive
    function cyclingStatusPlanned() {
        return Array.isArray(CONFIG.status) && CONFIG.status.length > 1;
    }

    const statusList = Array.isArray(CONFIG.status) ? CONFIG.status : [CONFIG.status];
    const cyclingStatus = statusList.length > 1;
    setStatus(statusList[0], CONFIG.statusText);

    if (cyclingStatus) {
        let statusIndex = 0;
        setInterval(() => {
            statusIndex = (statusIndex + 1) % statusList.length;
            statusText.style.opacity = '0';
            setTimeout(() => {
                setStatus(statusList[statusIndex]);
                statusText.style.opacity = '1';
            }, 220);
        }, Math.max(1200, CONFIG.statusInterval || 5000));
    }

    let views = Number(CONFIG.viewCount || 0);
    visitorCount.textContent = views.toLocaleString('en-US');

    /* ============================================================
       LIVE PRESENCE + VIEW COUNT
       Both are optional. Every failure path leaves the configured
       values on screen, so the page is complete with no network.
       ============================================================ */
    async function fetchDiscordStatus() {
        // a cycling status or a manual pick is an explicit choice — live
        // presence would otherwise undo it on the next poll
        if (!CONFIG.discordUserId || cyclingStatus || manualStatus) return;
        try {
            const res = await fetch(`https://api.lanyard.rest/v1/users/${CONFIG.discordUserId}`);
            const { success, data } = await res.json();
            if (!success || !data) return;

            const { discord_status, activities = [], spotify } = data;
            let label = STATUS_LABELS[discord_status] || 'Offline';
            const activity = activities.find(a => a.type !== 4);   // 4 = custom status
            if (spotify) {
                label += ` · Listening to ${spotify.song} by ${spotify.artist}`;
            } else if (activity) {
                const prefix = ACTIVITY_PREFIXES[activity.type] || '';
                label += ` · ${prefix ? prefix + ' ' : ''}${activity.name}`;
            }
            setStatus(discord_status, label);
        } catch {
            /* offline, blocked, or not registered with lanyard — keep CONFIG.status */
        }
    }

    fetchDiscordStatus();
    setInterval(fetchDiscordStatus, 30000);

    async function fetchViewCount() {
        if (!CONFIG.viewCountAPI) return;
        try {
            const res = await fetch(CONFIG.viewCountAPI, { method: 'POST' });
            const data = await res.json();
            const count = Number(data.count);
            if (Number.isFinite(count)) {
                views = count;
                visitorCount.textContent = views.toLocaleString('en-US');
            }
        } catch {
            /* keep CONFIG.viewCount */
        }
    }

    fetchViewCount();

    /* ---------- badges ---------- */
    (CONFIG.badges || []).forEach(({ icon, label, color }) => {
        const art = BADGE_ICONS[icon];
        if (!art) return;                                   // unknown key: skip quietly

        const el = document.createElement('span');
        el.className = 'badge';
        el.tabIndex = 0;
        if (color) el.style.setProperty('--badge-color', color);
        el.innerHTML = art + `<span class="tooltip"></span>`;
        el.querySelector('.tooltip').textContent = label || icon;
        el.setAttribute('aria-label', label || icon);

        // touch has no hover, so a tap shows the tooltip briefly
        el.addEventListener('click', () => {
            el.classList.add('show');
            clearTimeout(el._t);
            el._t = setTimeout(() => el.classList.remove('show'), 1600);
        });

        $('badges').appendChild(el);
    });

    /* ============================================================
       AMBIENT LAYER — blooms and motes behind the card.
       Positions and timings are randomised once, then CSS drives
       the motion, so this costs nothing per frame.
       ============================================================ */
    function buildAmbient() {
        const cfg = Object.assign({ enabled: true, particles: 18, bloom: true }, CONFIG.ambient);
        if (!cfg.enabled || prefersReducedMotion) return;

        const layer = $('ambient');
        const frag = document.createDocumentFragment();

        if (cfg.bloom) {
            ['bloom bloom-a', 'bloom bloom-b'].forEach(cls => {
                const b = document.createElement('div');
                b.className = cls;
                frag.appendChild(b);
            });
        }

        // phones carry the tightest frame budget and the smallest canvas to
        // scatter across, so thin the field there
        const count = window.innerWidth <= 430
            ? Math.round(cfg.particles * 0.6)
            : cfg.particles;

        for (let i = 0; i < count; i++) {
            const mote = document.createElement('div');
            mote.className = 'mote';
            mote.style.left = rand(0, 100).toFixed(2) + '%';
            mote.style.setProperty('--size', rand(1.5, 3.6).toFixed(1) + 'px');
            mote.style.setProperty('--dur', rand(16, 34).toFixed(1) + 's');
            mote.style.setProperty('--delay', (-rand(0, 34)).toFixed(1) + 's');  // pre-scattered
            mote.style.setProperty('--drift', rand(-40, 40).toFixed(0) + 'px');
            mote.style.setProperty('--peak', rand(0.25, 0.65).toFixed(2));
            frag.appendChild(mote);
        }

        layer.appendChild(frag);
    }

    buildAmbient();

    /* ---------- social icons ---------- */
    [
        ['discord',  CONFIG.discordURL,  'Discord'],
        ['github',   CONFIG.githubURL,   'GitHub'],
        ['telegram', CONFIG.telegramURL, 'Telegram'],
        ['roblox',   CONFIG.robloxURL,   'Roblox'],
        ['youtube',  CONFIG.youtubeURL,  'YouTube'],
        ['tiktok',   CONFIG.tiktokURL,   'TikTok']
    ].forEach(([key, url, label]) => {
        if (!url) return;
        const a = document.createElement('a');
        a.href = url;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.title = label;
        a.setAttribute('aria-label', label);
        // .magnet is the layer the cursor pulls, keeping it clear of the
        // entrance animation on the anchor and the float on the icon
        a.innerHTML = `<span class="magnet">${SOCIAL_ICONS[key]}</span>`;
        socialLinks.appendChild(a);
    });

    const magnets = [...socialLinks.querySelectorAll('.magnet')];

    /* ---------- click spark burst ---------- */
    function spark(anchor) {
        if (!CONFIG.clickSpark || prefersReducedMotion) return;

        const COUNT = 9;
        for (let i = 0; i < COUNT; i++) {
            const dot = document.createElement('span');
            dot.className = 'spark';
            // even fan-out with a little jitter so it never looks mechanical
            const angle = (i / COUNT) * Math.PI * 2 + rand(-0.25, 0.25);
            const dist = rand(16, 30);
            dot.style.setProperty('--sx', (Math.cos(angle) * dist).toFixed(1) + 'px');
            dot.style.setProperty('--sy', (Math.sin(angle) * dist).toFixed(1) + 'px');
            dot.style.setProperty('--spark-dur', rand(420, 640).toFixed(0) + 'ms');
            anchor.appendChild(dot);
            dot.addEventListener('animationend', () => dot.remove(), { once: true });
        }
    }

    socialLinks.addEventListener('pointerdown', (e) => {
        const anchor = e.target.closest('a');
        if (anchor) spark(anchor);
    });

    /* ============================================================
       TYPEWRITERS (entry text, username, bio)
       ============================================================ */
    function typewriter(el, messages, opts) {
        const list = Array.isArray(messages) ? messages.filter(Boolean) : [messages];
        if (!list.length) return { start() {} };

        const o = Object.assign({
            typeDelay: 150, deleteDelay: 75, holdDelay: 2000,
            loop: true, glitch: true, cursor: true
        }, opts);

        let text = '', index = 0, msg = 0, deleting = false, cursorOn = true, running = false;

        function render() {
            el.textContent = text + (o.cursor ? (cursorOn ? '|' : ' ') : '');
        }

        setInterval(() => { cursorOn = !cursorOn; render(); }, 500);

        function tick() {
            const full = list[msg];
            if (!deleting && index < full.length) {
                index++;
                text = full.slice(0, index);
            } else if (deleting && index > 0) {
                index--;
                text = full.slice(0, index);
            } else if (!deleting && index === full.length) {
                if (!o.loop) { render(); return; }
                deleting = true;
                setTimeout(tick, o.holdDelay);
                return;
            } else {
                deleting = false;
                msg = (msg + 1) % list.length;
            }

            render();

            if (o.glitch && Math.random() < 0.1) {
                el.classList.add('glitch');
                setTimeout(() => el.classList.remove('glitch'), 200);
            }
            setTimeout(tick, deleting ? o.deleteDelay : o.typeDelay);
        }

        return { start() { if (!running) { running = true; tick(); } } };
    }

    const touchDevice = window.matchMedia('(hover: none)').matches;
    const enterText = CONFIG.enterText || (touchDevice ? 'tap to enter' : 'click to enter');
    typewriter(startText, enterText, { loop: false, glitch: false, typeDelay: 100 }).start();

    /* optional second line — glitch-revealed once the prompt has typed out */
    if (CONFIG.enterSubtitle) {
        const subtitle = $('start-subtitle');
        subtitle.textContent = CONFIG.enterSubtitle;
        setTimeout(() => subtitle.classList.add('in'), enterText.length * 100 + 200);
    }

    const nameTyper = typewriter(profileName, CONFIG.username, {
        typeDelay: 300, deleteDelay: 150, holdDelay: 10000,
        loop: Array.isArray(CONFIG.username)
    });
    const bioTyper = typewriter(profileBio, CONFIG.bio, { typeDelay: 150, deleteDelay: 75, holdDelay: 2000 });

    /* ============================================================
       GLASS / TRANSPARENCY CONTROL
       ============================================================ */
    function applyGlass(opacity) {
        const blur = 10 * opacity;
        const panels = [profileBlock, musicPlayerEl, topControlsEl];
        panels.forEach(p => {
            // backgroundColor, not background — the shine gradient lives in background-image
            p.style.backgroundColor = `rgba(0, 0, 0, ${opacity})`;
            p.style.backdropFilter = opacity ? `blur(${blur}px)` : 'none';
            p.style.webkitBackdropFilter = opacity ? `blur(${blur}px)` : 'none';
        });
        musicPlayerEl.style.borderColor = opacity
            ? `rgba(255, 255, 255, ${0.2 * opacity})`
            : 'transparent';
    }

    /* ============================================================
       AUDIO REACTIVITY — drives the --beat custom property
       ============================================================
       An analyser is only attached when the audio is guaranteed same-origin.
       Chrome silences a MediaElementSource fed by an opaque resource (which is
       what a plain file:// mp3 is), and that routing cannot be undone — so when
       in doubt we skip it and use a gentle time-based pulse instead. */
    let analyser = null, freqData = null, beat = 0;

    function canAnalyse(src) {
        if (!src) return false;
        if (src.startsWith('data:')) return true;                 // inlined build
        if (location.protocol === 'file:') return false;          // opaque origin
        try { return new URL(src, location.href).origin === location.origin; }
        catch { return false; }
    }

    function initAnalyser() {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (analyser || !Ctx || !canAnalyse(audio.currentSrc || audio.src)) return;
        try {
            const ctx = new Ctx();
            const source = ctx.createMediaElementSource(audio);
            const node = ctx.createAnalyser();
            node.fftSize = 128;
            node.smoothingTimeConstant = 0.75;
            source.connect(node);
            node.connect(ctx.destination);                        // audio keeps flowing
            analyser = node;
            freqData = new Uint8Array(node.frequencyBinCount);
            if (ctx.state === 'suspended') ctx.resume();
        } catch {
            analyser = null;                                      // fall back to the pulse
        }
    }

    let beatWritten = -1, beatClock = 0, faviconClock = 0;

    function updateBeat(now) {
        if (now - beatClock < 32) return;                          // ~30 writes a second is plenty
        beatClock = now;

        let target;
        if (analyser) {
            analyser.getByteFrequencyData(freqData);
            let sum = 0;
            for (let i = 1; i < 9; i++) sum += freqData[i];        // low end
            target = clamp((sum / 8 / 255 - 0.32) / 0.45, 0, 1);
        } else {
            target = 0.32 + 0.28 * Math.sin(now / 380);
        }

        beat += (target - beat) * 0.3;                             // smooth the jitter
        const rounded = Math.round(beat * 50) / 50;
        if (rounded === beatWritten) return;                       // skip no-op style writes
        beatWritten = rounded;
        root.style.setProperty('--beat', rounded);

        // repainting the tab icon is expensive — cap it hard when enabled
        if (CONFIG.faviconPulse && CONFIG.favicon !== 'avatar' && now - faviconClock > 400) {
            faviconClock = now;
            drawFavicon(rounded);
        }
    }

    /* ============================================================
       MUSIC PLAYER
       ============================================================ */
    let trackIndex = 0;
    let seekTweening = false;
    let rafId = null;

    let seekToken = 0;               // invalidates a running glide when the user grabs the bar

    const progress = createSlider($('music-progress'), {
        min: 0, max: 100, value: 0,
        onDown: () => { seekToken++; seekTweening = false; },
        onInput: (value) => { currentTimeEl.textContent = formatTime(value); },
        onChange: (value) => {
            const from = audio.currentTime;
            const to = clamp(value, 0, audio.duration || 0);
            audio.currentTime = to;                      // the audio jumps straight away

            // a short hop lands instantly, a jump glides the bar over to the new spot
            if (Math.abs(to - from) <= 1.5) return;

            const token = ++seekToken;
            seekTweening = true;
            tween(from, to, 350, (v) => {
                if (token !== seekToken) return;
                progress.set(v, true);
                currentTimeEl.textContent = formatTime(v);
            }, () => {
                if (token !== seekToken) return;
                seekTweening = false;
                progress.set(to, true);
            });
        }
    });

    const volume = createSlider($('volume-slider'), {
        min: 0, max: 1, value: CONFIG.volume,
        onInput: (v) => {
            audio.volume = clamp(v, 0, 1);
            if (audio.muted) { audio.muted = false; }
            volumeIcon.innerHTML = v > 0 ? VOLUME_ICON_ON : VOLUME_ICON_OFF;
        }
    });

    const transparency = createSlider($('transparency-slider'), {
        min: 0, max: 1, value: CONFIG.cardOpacity,
        onInput: (v) => applyGlass(v)
    });

    function loadTrack(index, autoPlay) {
        const track = CONFIG.playlist[index];
        if (!track) return;
        audio.src = track.file;
        audio.load();
        playerArt.style.opacity = '0';                             // cross-fade the artwork
        playerArt.addEventListener('load', () => { playerArt.style.opacity = '1'; }, { once: true });
        playerArt.src = track.cover || '';
        playerArt.alt = track.title ? track.title + ' cover' : 'Album art';
        document.querySelector('.player-art').title =
            [track.title, track.artist].filter(Boolean).join(' — ');
        currentTimeEl.textContent = '0:00';
        totalTimeEl.textContent = '0:00';
        progress.set(0, true);

        if ('mediaSession' in navigator && typeof MediaMetadata !== 'undefined' && track.title) {
            navigator.mediaSession.metadata = new MediaMetadata({
                title: track.title,
                artist: track.artist || '',
                artwork: track.cover ? [{ src: track.cover }] : []
            });
        }
        if (autoPlay) play();
    }

    function play() {
        const p = audio.play();
        if (p && p.catch) p.catch(() => setPlayIcon(false));   // autoplay blocked → stay paused
    }

    function setPlayIcon(playing) {
        playPauseBtn.innerHTML = playing ? PAUSE_PATH : PLAY_PATH;
        playPauseBtn.setAttribute('aria-label', playing ? 'Pause' : 'Play');
        playPauseBtn.classList.remove('pulse');
        void playPauseBtn.offsetWidth;                          // restart the animation
        playPauseBtn.classList.add('pulse');
    }

    function step(now) {
        if (!progress.dragging && !seekTweening) {
            progress.set(audio.currentTime, true);
            currentTimeEl.textContent = formatTime(audio.currentTime);
        }
        updateBeat(now || performance.now());
        rafId = requestAnimationFrame(step);
    }

    audio.addEventListener('loadedmetadata', () => {
        totalTimeEl.textContent = formatTime(audio.duration);
        progress.setRange(0, audio.duration || 0);
    });

    audio.addEventListener('timeupdate', () => {
        if (progress.dragging || seekTweening) return;
        progress.set(audio.currentTime, true);
        currentTimeEl.textContent = formatTime(audio.currentTime);
    });

    audio.addEventListener('play', () => {
        setPlayIcon(true);
        document.body.classList.add('playing');
        initAnalyser();
        if (!rafId) rafId = requestAnimationFrame(step);
    });

    audio.addEventListener('pause', () => {
        setPlayIcon(false);
        document.body.classList.remove('playing');
        if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
        root.style.setProperty('--beat', '0');                     // glow settles back down
        beat = 0;
        beatWritten = 0;
    });

    audio.addEventListener('ended', () => {
        if (CONFIG.playlist.length > 1 || CONFIG.loop) {
            trackIndex = (trackIndex + 1) % CONFIG.playlist.length;
            loadTrack(trackIndex, true);
        }
    });

    function togglePlay() {
        if (audio.paused) { audio.muted = false; play(); }
        else audio.pause();
    }

    function skip(direction) {
        // with a single track, prev/next restarts it rather than doing nothing
        if (CONFIG.playlist.length < 2) {
            audio.currentTime = 0;
            progress.set(0, true);
            if (audio.paused) play();
            return;
        }
        trackIndex = (trackIndex + direction + CONFIG.playlist.length) % CONFIG.playlist.length;
        loadTrack(trackIndex, !audio.paused);
    }

    /* buttons — pointerup keeps the tap responsive on Android */
    function bindTap(el, fn) {
        el.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); fn(); });
        el.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fn(); }
        });
    }

    bindTap(playPauseBtn, togglePlay);
    bindTap(prevBtn, () => skip(-1));
    bindTap(nextBtn, () => skip(1));

    function toggleMute() {
        audio.muted = !audio.muted;
        volumeIcon.innerHTML = audio.muted ? VOLUME_ICON_OFF : VOLUME_ICON_ON;
        volumeIcon.setAttribute('aria-label', audio.muted ? 'Unmute' : 'Mute');
    }

    bindTap(volumeIcon, toggleMute);

    /* ============================================================
       KEYBOARD
         space        play / pause
         left/right   seek 5s
         shift+arrow  previous / next track
         m            mute
       Keys are ignored while a slider or link has focus, so tabbing
       through the page still behaves normally.
       ============================================================ */
    const SEEK_STEP = 5;

    function keyboardBusy() {
        const el = document.activeElement;
        if (!el || el === document.body) return false;
        return el.classList.contains('range') ||
               el.getAttribute('role') === 'slider' ||
               el.tagName === 'A' || el.tagName === 'BUTTON' ||
               el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' ||
               menuOpen;                          // the picker owns the keys while open
    }

    window.addEventListener('keydown', (e) => {
        if (!CONFIG.keyboard || !unlocked || e.metaKey || e.ctrlKey || e.altKey) return;
        if (keyboardBusy()) return;

        switch (e.key) {
            case ' ':
            case 'Spacebar':
                e.preventDefault();
                togglePlay();
                break;

            case 'ArrowRight':
                e.preventDefault();
                if (e.shiftKey) skip(1);
                else seekBy(SEEK_STEP);
                break;

            case 'ArrowLeft':
                e.preventDefault();
                if (e.shiftKey) skip(-1);
                else seekBy(-SEEK_STEP);
                break;

            case 'm':
            case 'M':
                e.preventDefault();
                toggleMute();
                break;
        }
    });

    function seekBy(delta) {
        if (!isFinite(audio.duration)) return;
        const to = clamp(audio.currentTime + delta, 0, audio.duration);
        audio.currentTime = to;
        progress.set(to, true);
        currentTimeEl.textContent = formatTime(to);
    }

    /* ============================================================
       TAB IDENTITY — themed favicon + embed metadata
       ============================================================ */
    const faviconLink = document.createElement('link');
    faviconLink.rel = 'icon';
    document.head.appendChild(faviconLink);

    function drawFavicon(pulse) {
        const size = 64;
        const canvas = document.createElement('canvas');
        canvas.width = canvas.height = size;
        const ctx = canvas.getContext('2d');
        if (!ctx) return false;

        // rounded dark tile
        const r = 14;
        ctx.beginPath();
        ctx.moveTo(r, 0);
        ctx.arcTo(size, 0, size, size, r);
        ctx.arcTo(size, size, 0, size, r);
        ctx.arcTo(0, size, 0, 0, r);
        ctx.arcTo(0, 0, size, 0, r);
        ctx.closePath();
        ctx.fillStyle = '#0b0b0d';
        ctx.fill();

        // accent ring, widening slightly with the beat when pulsing
        ctx.strokeStyle = theme.accent;
        ctx.lineWidth = 4 + (pulse || 0) * 2.5;
        ctx.stroke();

        // first letter of the name
        ctx.fillStyle = theme.glow;
        ctx.font = 'bold 34px "Courier New", monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText((CONFIG.username || '?').trim().charAt(0).toUpperCase(), size / 2, size / 2 + 2);

        faviconLink.href = canvas.toDataURL('image/png');
        return true;
    }

    // "auto" draws the themed tile; "avatar" (or a canvas failure) uses the picture
    if (CONFIG.favicon !== 'avatar') {
        if (!drawFavicon(0)) faviconLink.href = pick(CONFIG.profilePicture);
    } else {
        faviconLink.href = pick(CONFIG.profilePicture);
    }

    /* ---------- link embed ---------- */
    function setMeta(selector, attr, value) {
        const el = document.head.querySelector(selector);
        if (el && value) el.setAttribute(attr, value);
    }

    const firstBio = Array.isArray(CONFIG.bio) ? CONFIG.bio[0] : CONFIG.bio;
    const embedDescription = CONFIG.ogDescription ||
        [statusText.textContent, firstBio].filter(Boolean).join(' · ');

    setMeta('meta[name="description"]', 'content', embedDescription);
    setMeta('meta[property="og:description"]', 'content', embedDescription);
    setMeta('meta[name="twitter:description"]', 'content', embedDescription);
    setMeta('meta[property="og:title"]', 'content', CONFIG.username);
    setMeta('meta[name="twitter:title"]', 'content', CONFIG.username);
    setMeta('meta[name="theme-color"]', 'content', theme.accent);

    // a data URI works for local previews; scrapers need a hosted URL
    const ogImage = CONFIG.ogImage || stillSrc;
    if (!isVideo(ogImage)) {
        setMeta('meta[property="og:image"]', 'content', ogImage);
        setMeta('meta[name="twitter:image"]', 'content', ogImage);
    }

    /* ============================================================
       CARD OUTLINE — a light segment that travels around the card
       ============================================================ */
    function startOutline() {
        profileOutline.style.opacity = '1';
        const rect = profileOutline.querySelector('rect');
        const bw = 1.5;

        function position() {
            const w = profileBlock.offsetWidth + bw * 2;
            const h = profileBlock.offsetHeight + bw * 2;
            profileOutline.style.top = (profileBlock.offsetTop - bw) + 'px';
            profileOutline.style.left = (profileBlock.offsetLeft - bw) + 'px';
            profileOutline.setAttribute('width', w);
            profileOutline.setAttribute('height', h);
            rect.setAttribute('x', bw);
            rect.setAttribute('y', bw);
            rect.setAttribute('width', w - bw * 2);
            rect.setAttribute('height', h - bw * 2);
        }

        position();
        window.addEventListener('resize', position);

        const segment = 80;
        let offset = 0;
        (function frame() {
            const perimeter = rect.getTotalLength();
            if (perimeter) {
                rect.style.strokeDasharray = segment + ' ' + (perimeter - segment);
                offset -= 1.5;
                if (offset < -perimeter) offset += perimeter;
                rect.style.strokeDashoffset = offset;
            }
            requestAnimationFrame(frame);
        })();
    }

    /* ============================================================
       SUBTLE 3D TILT
       ============================================================ */
    /* Pointer movement drives two things — the card tilt and the background
       parallax. Both are applied once per frame from the latest coordinates,
       so a high-rate touch stream costs one style update, not dozens. */
    const backgroundWrap = $('background-wrap');
    const MAX_PARALLAX = 14;                 // px the artwork drifts behind the card
    const MAX_TILT = 15;

    let pointerX = 0, pointerY = 0, pointerLive = false, frameQueued = false;

    /* Magnetic icons: the centres are measured once and on resize rather than
       every frame — reading getBoundingClientRect in the frame loop would
       force a layout on each move. */
    const MAGNET_RADIUS = 90;         // px of influence around each icon
    const MAGNET_PULL = 7;            // px it can travel toward the cursor
    let magnetCentres = [];

    function measureMagnets() {
        magnetCentres = magnets.map(el => {
            const b = el.getBoundingClientRect();
            return { el, x: b.left + b.width / 2, y: b.top + b.height / 2 };
        });
    }

    function applyMagnets() {
        for (const m of magnetCentres) {
            const dx = pointerX - m.x;
            const dy = pointerY - m.y;
            const dist = Math.hypot(dx, dy);

            if (!pointerLive || dist > MAGNET_RADIUS) {
                m.el.classList.remove('pulling');
                m.el.style.setProperty('--mx', '0px');
                m.el.style.setProperty('--my', '0px');
                continue;
            }

            const strength = (1 - dist / MAGNET_RADIUS) * MAGNET_PULL;
            const scale = dist ? strength / dist : 0;
            m.el.classList.add('pulling');
            m.el.style.setProperty('--mx', (dx * scale).toFixed(2) + 'px');
            m.el.style.setProperty('--my', (dy * scale).toFixed(2) + 'px');
        }
    }

    function applyPointer() {
        frameQueued = false;
        const nx = (pointerX - window.innerWidth / 2) / (window.innerWidth / 2);
        const ny = (pointerY - window.innerHeight / 2) / (window.innerHeight / 2);

        if (CONFIG.magneticIcons && !touchDevice && !prefersReducedMotion) applyMagnets();

        backgroundWrap.style.setProperty('--bg-x', (pointerLive ? -nx * MAX_PARALLAX : 0).toFixed(1) + 'px');
        backgroundWrap.style.setProperty('--bg-y', (pointerLive ? -ny * MAX_PARALLAX : 0).toFixed(1) + 'px');

        if (CONFIG.tilt) {
            // never tilt while a slider is being dragged — the control would slide away
            const live = pointerLive && !slidersDragging;
            stack.style.setProperty('--tilt-x', (live ? ny * MAX_TILT : 0).toFixed(2) + 'deg');
            stack.style.setProperty('--tilt-y', (live ? -nx * MAX_TILT : 0).toFixed(2) + 'deg');
        }
    }

    function schedulePointer() {
        if (frameQueued) return;
        frameQueued = true;
        requestAnimationFrame(applyPointer);
    }

    function onPointerMove(e) {
        pointerX = e.clientX;
        pointerY = e.clientY;
        pointerLive = true;
        schedulePointer();
    }

    function onPointerRest() {
        pointerLive = false;
        schedulePointer();
    }

    window.addEventListener('pointermove', onPointerMove, { passive: true });
    window.addEventListener('pointerup', onPointerRest);
    window.addEventListener('pointercancel', onPointerRest);
    window.addEventListener('pointerleave', onPointerRest);
    window.addEventListener('blur', onPointerRest);
    window.addEventListener('resize', measureMagnets);

    /* ============================================================
       AVATAR INTERACTION
       ============================================================ */
    function spinAvatar() {
        profileContainer.classList.remove('fast-orbit');
        void profileContainer.offsetWidth;
        profileContainer.classList.add('fast-orbit');
        setTimeout(() => profileContainer.classList.remove('fast-orbit'), 500);
    }
    profilePicture.addEventListener('click', spinAvatar);

    /* ============================================================
       ENTRY SCREEN → reveal + playback (needs the user gesture)
       ============================================================ */
    let unlocked = false;

    function unlockPage() {
        if (unlocked) return;
        unlocked = true;

        audio.muted = false;
        audio.volume = clamp(CONFIG.volume, 0, 1);
        play();

        startScreen.classList.add('fading');
        setTimeout(() => startScreen.classList.add('hidden'), 600);

        background.classList.add('animate');
        clip.classList.add('animate');
        if (clipSrc) clip.play().catch(() => {});        // the entry tap satisfies autoplay
        document.getElementById('background-wrap').classList.add('animate');
        $('ambient').classList.add('revealed');
        reveal.classList.add('revealed');

        // icon centres are only meaningful once the card has settled
        setTimeout(measureMagnets, 1200);

        // the view counter rolls up to its value as the card settles
        if (views > 0) {
            tween(0, views, 1400, (v) => {
                visitorCount.textContent = Math.round(v).toLocaleString('en-US');
            }, () => { visitorCount.textContent = views.toLocaleString('en-US'); });
        }

        applyGlass(transparency.value);
        nameTyper.start();
        bioTyper.start();

        // the outline needs the card at its final size
        setTimeout(startOutline, 300);
    }

    startScreen.addEventListener('click', unlockPage);
    startScreen.addEventListener('touchstart', (e) => { e.preventDefault(); unlockPage(); }, { passive: false });
    startScreen.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') unlockPage();
    });
    startScreen.tabIndex = 0;

    /* ---------- initial state ---------- */
    if (CONFIG.shuffle && CONFIG.playlist.length > 1) {
        trackIndex = Math.floor(Math.random() * CONFIG.playlist.length);
    }
    applyGlass(CONFIG.cardOpacity);
    audio.volume = clamp(CONFIG.volume, 0, 1);
    audio.loop = CONFIG.loop && CONFIG.playlist.length === 1;
    volumeIcon.innerHTML = VOLUME_ICON_ON;
    setPlayIcon(false);
    playPauseBtn.classList.remove('pulse');
    loadTrack(trackIndex, false);
});
</script>
</body>
</html>
