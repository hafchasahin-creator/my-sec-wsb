<title>imran</title>
<style>
/* ============================================================
   FONTS
   ============================================================ */
@font-face {
    font-family: 'Angel Wish';
    src: url({{FONT_URI}}) format('truetype');
    font-weight: normal;
    font-style: normal;
    font-display: block;
}

/* Liberation Mono, subset to the glyphs this page uses (SIL OFL 1.1).
   It is metric-compatible with Courier New, so the text occupies exactly the
   same widths everywhere instead of whatever mono a phone substitutes. */
@font-face {
    font-family: 'Mono';
    src: url({{MONO_URI}}) format('woff2');
    font-weight: normal;
    font-style: normal;
    font-display: swap;
}

/* ============================================================
   THEME — published from CONFIG.theme at boot, so every accent
   in the page resolves back to those few values
   ============================================================ */
:root {
    --accent: #ed4245;
    --glow: #ffffff;
    --beat-color: #ffffff;
    --beat: 0;                  /* 0-1, driven by the audio analyser */
}

/* ============================================================
   BASE
   ============================================================ */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Mono', 'Courier New', Courier, monospace;
    -webkit-tap-highlight-color: transparent;
}

/* the page is a UI, not a document — stop long-press selection and the
   image save sheet from firing mid-drag */
body, #stack, #start-screen {
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
}

body {
    background-color: #000;
    color: #fff;
    -webkit-font-smoothing: antialiased;
}

.container {
    width: 100%;
    height: 100vh;
    height: 100dvh;
    position: relative;
    perspective: 1000px;
}

.hidden { display: none !important; }

/* ============================================================
   BACKGROUND — full screen artwork with a very slow zoom
   ============================================================ */
/* wrapper carries the parallax drift, the image itself carries the slow zoom */
#background-wrap {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    z-index: 1;
    pointer-events: none;
    transform: translate3d(var(--bg-x, 0px), var(--bg-y, 0px), 0);
    transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    will-change: transform;
}

/* Two stacked backdrops — the clip and the still — cross-faded by the cycle.
   With no clip configured the still simply stays visible. */
.bg-layer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
    transform: scale(1.06);
    opacity: 0;
    transition: opacity var(--bg-fade, 1600ms) ease-in-out;
}

/* only the visible layer gets a compositor layer and the zoom — animating the
   hidden one costs a second full-screen layer for nothing */
.bg-layer.show {
    opacity: 1;
    will-change: transform, opacity;
}

.bg-layer.show.animate {
    animation: bg-zoom 42s ease-in-out infinite alternate;
}

@keyframes bg-zoom {
    from { transform: scale(1.06); }
    to   { transform: scale(1.16); }
}

/* the artwork lifts a touch out of black as the page opens */
#background-wrap::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 45%, transparent 45%, rgba(0, 0, 0, 0.55) 100%);
    opacity: 0;
    transition: opacity 1.6s ease;
}

#background-wrap.animate::after { opacity: 1; }

/* ============================================================
   AMBIENT LAYER — sits between the artwork and the card.
   Everything here animates transform/opacity only, so it stays
   on the compositor and never repaints.
   ============================================================ */
/* The beat is applied to this one wrapper rather than to each child: a custom
   property inside a keyframe would drop those animations off the compositor
   and back onto the main thread. */
#ambient {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    overflow: hidden;
    opacity: 0;
    transition: opacity 1.4s ease;
}

#ambient.revealed { opacity: calc(0.72 + 0.28 * var(--beat, 0)); }

/* Two slow colour blooms. The radial gradient is already soft, so no blur
   filter is needed — and no scaling, which would force the layer to
   re-rasterise on every frame. Translation alone stays on the GPU. */
.bloom {
    position: absolute;
    width: 86vmax;
    height: 86vmax;
    border-radius: 50%;
    opacity: 0.07;
    will-change: transform;
}

.bloom-a {
    left: -30vmax;
    top: -24vmax;
    background: radial-gradient(circle closest-side, var(--accent) 0%, transparent 70%);
    animation: bloom-drift-a 38s ease-in-out infinite alternate;
}

.bloom-b {
    right: -32vmax;
    bottom: -28vmax;
    background: radial-gradient(circle closest-side, var(--glow) 0%, transparent 66%);
    animation: bloom-drift-b 46s ease-in-out infinite alternate;
}

@keyframes bloom-drift-a {
    from { transform: translate3d(0, 0, 0); }
    to   { transform: translate3d(14vw, 10vh, 0); }
}

@keyframes bloom-drift-b {
    from { transform: translate3d(0, 0, 0); }
    to   { transform: translate3d(-12vw, -12vh, 0); }
}

/* drifting motes — position and timing are randomised per element at boot */
.mote {
    position: absolute;
    top: 100%;
    width: var(--size, 3px);
    height: var(--size, 3px);
    border-radius: 50%;
    background: var(--glow);
    opacity: 0;
    will-change: transform, opacity;
    animation: mote-rise var(--dur, 20s) linear var(--delay, 0s) infinite;
}

/* opacity here is a static per-mote value — the beat is applied once on
   #ambient so these keyframes stay compositor-only */
@keyframes mote-rise {
    0%   { transform: translate3d(0, 0, 0); opacity: 0; }
    12%  { opacity: var(--peak, 0.5); }
    88%  { opacity: var(--peak, 0.5); }
    100% { transform: translate3d(var(--drift, 20px), calc(-100vh - 12vh), 0); opacity: 0; }
}

/* ============================================================
   LAYOUT — centered stack: profile card / music player / controls
   ============================================================ */
#content-wrapper {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 20;
    perspective: 1000px;
}

#reveal {
    opacity: 0;
    transform: translateY(-50px);
}

#reveal.revealed {
    animation: reveal-in 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes reveal-in {
    from { opacity: 0; transform: translateY(-50px); }
    to   { opacity: 1; transform: translateY(0); }
}

/* ---- staggered entrance: panels first, then the pieces inside the card ---- */
.revealed .top-controls {
    animation: panel-in 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.28s both;
}

@keyframes panel-in {
    from { opacity: 0; transform: translateY(18px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
}

.revealed .profile-container,
.revealed .name-and-badges,
.revealed .discord-status,
.revealed #profile-bio,
.revealed .visitor-counter {
    animation: piece-in 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
}

.revealed .profile-container { animation-delay: 0.30s; }
.revealed .name-and-badges   { animation-delay: 0.38s; }
.revealed .discord-status    { animation-delay: 0.46s; }
.revealed #profile-bio       { animation-delay: 0.54s; }
.revealed .visitor-counter   { animation-delay: 0.86s; }

@keyframes piece-in {
    from { opacity: 0; transform: translateX(-10px); }
    to   { opacity: 1; transform: translateX(0); }
}

/* the divider draws itself outward from the centre */
.revealed .bio-separator {
    animation: divider-in 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.58s both;
    transform-origin: center;
}

@keyframes divider-in {
    from { opacity: 0; transform: scaleX(0); }
    to   { opacity: 1; transform: scaleX(1); }
}

/* social icons drop in one after another */
.revealed .social-links a {
    animation: icon-in 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
}

.revealed .social-links a:nth-child(1) { animation-delay: 0.62s; }
.revealed .social-links a:nth-child(2) { animation-delay: 0.68s; }
.revealed .social-links a:nth-child(3) { animation-delay: 0.74s; }
.revealed .social-links a:nth-child(4) { animation-delay: 0.80s; }
.revealed .social-links a:nth-child(5) { animation-delay: 0.86s; }
.revealed .social-links a:nth-child(6) { animation-delay: 0.92s; }

@keyframes icon-in {
    from { opacity: 0; transform: translateY(12px) scale(0.5); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
}

#stack {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    transform: rotateX(var(--tilt-x, 0deg)) rotateY(var(--tilt-y, 0deg));
    transform-style: preserve-3d;
    transition: transform 0.3s ease-out;
}

/* animated marching outline that traces the profile card */
#profile-outline {
    position: absolute;
    overflow: visible;
    mix-blend-mode: difference;
    pointer-events: none;
    z-index: 4;
    opacity: 0;
    transition: opacity 0.6s ease;
}

/* ============================================================
   PROFILE CARD
   ============================================================ */
#profile-block {
    width: 820px;
    min-height: 332px;
    max-height: min(400px, calc(100vh - 220px));
    overflow: visible;
    background-color: rgba(0, 0, 0, 0.4);
    border: none;
    padding: 20px;
    border-radius: 15px;
    display: flex;
    flex-direction: column;
    gap: 15px;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    box-shadow: 0 0 30px rgba(255, 255, 255, 0.04);
    transition: background-color 0.25s ease;
    pointer-events: auto;
}

/* beat glow rides on opacity of a static shadow — changing the shadow itself
   every frame would repaint the whole card */
#profile-block::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 15px;
    box-shadow: 0 0 34px var(--beat-color);
    opacity: calc(0.14 * var(--beat, 0));
    pointer-events: none;
    will-change: opacity;
}

/* a slow reflection travelling across the glass — the gradient is clipped by
   the card's own radius, so no extra element is needed */
#profile-block,
#music-player {
    background-image: linear-gradient(105deg,
        transparent 38%,
        rgba(255, 255, 255, 0.06) 47%,
        rgba(255, 255, 255, 0.09) 50%,
        rgba(255, 255, 255, 0.06) 53%,
        transparent 62%);
    background-size: 260% 100%;
    background-repeat: no-repeat;
    background-position: 210% 0;
}

/* entrance and reflection run together on the two big panels */
.revealed #profile-block {
    animation: panel-in 0.9s cubic-bezier(0.16, 1, 0.3, 1) both,
               card-shine 11s ease-in-out 2.2s infinite;
}

.revealed #music-player {
    animation: panel-in 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.14s both,
               card-shine 11s ease-in-out 2.6s infinite;
}

@keyframes card-shine {
    0%        { background-position: 210% 0; }
    20%, 100% { background-position: -110% 0; }
}

.profile-header {
    display: flex;
    align-items: flex-start;
    gap: 15px;
}

.profile-container {
    position: relative;
    width: 150px;
    height: 150px;
    flex-shrink: 0;
}

/* orbiting light dot around the avatar */
.profile-container::after {
    content: '';
    position: absolute;
    top: -2px;
    left: -2px;
    right: -2px;
    bottom: -2px;
    border-radius: 50%;
    background: radial-gradient(circle at 10px 10px, white 10%, transparent 15%);
    animation: orbit 3s linear infinite;
    z-index: -1;
    filter: blur(1px);
}

.profile-container.fast-orbit::after {
    animation: orbit 0.5s linear forwards;
}

@keyframes orbit {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
}

.profile-picture {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    object-fit: cover;
    cursor: pointer;
    pointer-events: auto;
    display: block;
    /* a hairline rim keeps a light avatar from bleeding into the card */
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.14), 0 2px 12px rgba(0, 0, 0, 0.5);
    transition: transform 0.3s ease;
}

.profile-picture:active { transform: scale(0.94); }

/* the avatar breathes with the low end of the track */
.profile-container::before {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    box-shadow: 0 0 22px var(--beat-color);
    opacity: 0;
    pointer-events: none;
    will-change: opacity;
}

.playing .profile-container::before { opacity: calc(0.42 * var(--beat, 0)); }

.profile-info {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
}

.name-and-badges {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
}

/* name and emblems stay on one line at every width */
.name-row {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
}

.badges {
    display: flex;
    align-items: center;
    gap: 5px;
    flex-shrink: 0;
}

.badge {
    position: relative;
    width: 20px;
    height: 20px;
    color: var(--badge-color, var(--accent));
    filter: drop-shadow(0 0 5px color-mix(in srgb, var(--badge-color, var(--accent)) 55%, transparent));
    cursor: help;
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.badge:hover,
.badge.show { transform: translateY(-2px) scale(1.15); }

.badge svg { width: 100%; height: 100%; display: block; }

.badge .tooltip {
    position: absolute;
    bottom: calc(100% + 8px);
    left: 50%;
    transform: translateX(-50%) translateY(4px);
    padding: 4px 8px;
    border-radius: 6px;
    background: rgba(0, 0, 0, 0.85);
    color: #fff;
    font-size: 11px;
    line-height: 1;
    white-space: nowrap;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 100;
}

.badge:hover .tooltip,
.badge.show .tooltip {
    opacity: 1;
    visibility: visible;
    transform: translateX(-50%) translateY(0);
}

/* entrance, in step with the rest of the card */
.revealed .badge {
    animation: icon-in 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
}

.revealed .badge:nth-child(1) { animation-delay: 0.44s; }
.revealed .badge:nth-child(2) { animation-delay: 0.50s; }
.revealed .badge:nth-child(3) { animation-delay: 0.56s; }
.revealed .badge:nth-child(4) { animation-delay: 0.62s; }

#profile-name {
    font-family: 'Angel Wish', 'Courier New', monospace;
    font-size: 32px;
    font-weight: bold;
    letter-spacing: 3px;
    color: #fff;
    filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.7));
    white-space: pre;
}

.discord-status {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 8px;
    font-size: 13px;
    color: rgba(255, 255, 255, 0.72);
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.75);
    min-width: 0;
}

/* a long presence string (Listening to X by Y) trims instead of wrapping */
#status-text {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
    box-shadow: 0 0 6px currentColor;
    position: relative;
}

#status-text { transition: opacity 0.22s ease; }

/* ---- each mode gets its own dot behaviour ---- */
.status-dot::after {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    border: 1px solid currentColor;
    opacity: 0;
    will-change: transform, opacity;    /* own layer, keeps the text out of the repaint */
}

.status-dot { transition: background 0.3s ease, box-shadow 0.3s ease; }

/* do not disturb — a sharp outward ping */
.status-dot.anim-ping::after { animation: status-ping 2.6s ease-out infinite; }

@keyframes status-ping {
    0%   { opacity: 0.55; transform: scale(0.75); }
    70%  { opacity: 0;    transform: scale(1.6); }
    100% { opacity: 0;    transform: scale(1.6); }
}

/* silent — no ring at all, the dot itself dims and lifts like a slow breath */
.status-dot.anim-silent {
    animation: status-dim 2.9s ease-in-out infinite;
}

@keyframes status-dim {
    0%, 100% { opacity: 1;    box-shadow: 0 0 6px currentColor; }
    50%      { opacity: 0.32; box-shadow: 0 0 1px currentColor; }
}

/* normal — a calm swell, slower and softer than the ping */
.status-dot.anim-normal {
    animation: status-swell 3.4s ease-in-out infinite;
}

.status-dot.anim-normal::after {
    animation: status-halo 3.4s ease-in-out infinite;
}

@keyframes status-swell {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.22); }
}

@keyframes status-halo {
    0%, 100% { opacity: 0;    transform: scale(1); }
    50%      { opacity: 0.42; transform: scale(1.75); }
}

.status-dot.offline::after,
.status-dot.invisible::after { animation: none; }

/* ============================================================
   STATUS PICKER
   ============================================================ */
.discord-status.interactive {
    cursor: pointer;
    border-radius: 6px;
    padding: 2px 6px;
    margin-left: -6px;
    width: fit-content;
    transition: background 0.2s ease;
}

.discord-status.interactive:hover,
.discord-status.interactive:focus-visible { background: rgba(255, 255, 255, 0.07); }

.status-caret {
    width: 9px;
    height: 9px;
    flex-shrink: 0;
    opacity: 0.45;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.2s ease;
}

.discord-status.open .status-caret { transform: rotate(180deg); opacity: 0.9; }

.status-wrap { position: relative; }

.status-menu {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    z-index: 60;
    min-width: 168px;
    padding: 5px;
    border-radius: 11px;
    background: rgba(12, 12, 14, 0.92);
    border: 1px solid rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 14px 34px rgba(0, 0, 0, 0.55);
    display: flex;
    flex-direction: column;
    gap: 2px;
    transform-origin: top left;
    opacity: 0;
    visibility: hidden;
    transform: translateY(-6px) scale(0.94);
    transition: opacity 0.2s ease, transform 0.26s cubic-bezier(0.34, 1.56, 0.64, 1),
                visibility 0.2s;
}

.status-menu.open {
    opacity: 1;
    visibility: visible;
    transform: translateY(0) scale(1);
}

.status-option {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 7px 10px;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: rgba(255, 255, 255, 0.82);
    font-size: 12px;
    text-align: left;
    cursor: pointer;
    white-space: nowrap;
    /* each option slides in behind the one before it */
    opacity: 0;
    transform: translateX(-8px);
    transition: background 0.18s ease, color 0.18s ease,
                opacity 0.26s ease, transform 0.26s cubic-bezier(0.16, 1, 0.3, 1);
}

.status-menu.open .status-option { opacity: 1; transform: translateX(0); }
.status-menu.open .status-option:nth-child(1) { transition-delay: 0.04s, 0.04s, 0.04s, 0.04s; }
.status-menu.open .status-option:nth-child(2) { transition-delay: 0.09s, 0.09s, 0.09s, 0.09s; }
.status-menu.open .status-option:nth-child(3) { transition-delay: 0.14s, 0.14s, 0.14s, 0.14s; }
.status-menu.open .status-option:nth-child(4) { transition-delay: 0.19s, 0.19s, 0.19s, 0.19s; }

.status-option:hover,
.status-option:focus-visible {
    background: rgba(255, 255, 255, 0.09);
    color: #fff;
    outline: none;
}

.status-option[aria-checked="true"] { background: rgba(255, 255, 255, 0.06); }

.status-option .opt-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    flex-shrink: 0;
    background: var(--opt-color, #fff);
    box-shadow: 0 0 6px var(--opt-color, #fff);
}

.status-option .opt-check {
    margin-left: auto;
    width: 12px;
    height: 12px;
    opacity: 0;
    transform: scale(0.6);
    transition: opacity 0.2s ease, transform 0.24s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.status-option[aria-checked="true"] .opt-check { opacity: 0.9; transform: scale(1); }

.status-dot.online  { background: #3ba55d; color: #3ba55d; }
.status-dot.idle    { background: #faa81a; color: #faa81a; }
.status-dot.dnd     { background: #ed4245; color: #ed4245; }
.status-dot.offline { background: #747f8d; color: #747f8d; box-shadow: none; }

#profile-bio {
    color: rgba(255, 255, 255, 0.82);
    font-size: 18px;
    line-height: 1.5;
    margin-bottom: 10px;
    white-space: pre;
    overflow: hidden;
    text-overflow: ellipsis;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.75);
}

.bio-separator {
    width: 100%;
    height: 1px;
    background: rgba(255, 255, 255, 0.2);
    margin: 20px 0;
}

.profile-footer {
    display: flex;
    flex-direction: column;
    gap: 5px;
    width: 100%;
    margin-top: auto;
}

/* ---- social icons ---- */
.social-links {
    display: flex;
    justify-content: center;
    gap: 12px;
    pointer-events: auto;
}

/* Three nested layers keep the transforms from fighting each other:
   the <a> carries the entrance animation, .magnet carries the cursor lean,
   and the icon itself carries the float and hover scale. */
.social-links a {
    display: block;
    line-height: 0;
    text-decoration: none;
    position: relative;
}

.magnet {
    display: block;
    line-height: 0;
    transform: translate3d(var(--mx, 0px), var(--my, 0px), 0);
    transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    will-change: transform;
}

.magnet.pulling { transition: transform 0.12s ease-out; }

/* click spark burst */
.spark {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 4px;
    height: 4px;
    margin: -2px 0 0 -2px;
    border-radius: 50%;
    background: var(--spark-color, var(--accent));
    pointer-events: none;
    opacity: 0;
    animation: spark-fly var(--spark-dur, 520ms) cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes spark-fly {
    0%   { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
    100% { opacity: 0; transform: translate3d(var(--sx), var(--sy), 0) scale(0.3); }
}

.social-icon {
    width: 36px;
    height: 36px;
    display: block;
    transition: transform 0.32s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.3s ease;
    filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.7));
    pointer-events: auto;
}

.social-icon:hover {
    transform: translateY(-3px) scale(1.34) rotateY(12deg);
    filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.85))
            drop-shadow(0 6px 10px rgba(0, 0, 0, 0.45));
}

.social-links a:active .social-icon { transform: translateY(-1px) scale(1.2); }

/* idle float, offset per icon so the row breathes rather than bobs in unison */
.revealed .social-links a { animation-fill-mode: both; }
.social-links a .social-icon { animation: icon-float 4.5s ease-in-out infinite; }
.social-links a:nth-child(2) .social-icon { animation-delay: -0.6s; }
.social-links a:nth-child(3) .social-icon { animation-delay: -1.2s; }
.social-links a:nth-child(4) .social-icon { animation-delay: -1.8s; }
.social-links a:nth-child(5) .social-icon { animation-delay: -2.4s; }
.social-links a:nth-child(6) .social-icon { animation-delay: -3.0s; }

@keyframes icon-float {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-2.5px); }
}

/* hover cancels the float so the scale reads cleanly */
.social-links a:hover .social-icon { animation: none; }

/* ---- visitor counter ---- */
.visitor-counter {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255, 255, 255, 0.1);
    padding: 8px 15px;
    border-radius: 20px;
    font-size: 14px;
    align-self: flex-start;
    position: relative;
    pointer-events: auto;
}

.visitor-icon {
    width: 18px;
    height: 18px;
    color: #fff;
    flex-shrink: 0;
}

.visitor-counter .tooltip {
    visibility: hidden;
    width: 120px;
    background-color: rgba(0, 0, 0, 0.8);
    color: #fff;
    text-align: center;
    border-radius: 6px;
    padding: 5px 0;
    font-size: 12px;
    position: absolute;
    z-index: 100;
    top: -35px;
    left: 50%;
    margin-left: -60px;
    opacity: 0;
    transition: opacity 0.3s;
}

.visitor-counter:hover .tooltip {
    visibility: visible;
    opacity: 1;
}

/* ============================================================
   MUSIC PLAYER
   ============================================================ */
#music-player {
    width: 820px;
    background: rgba(0, 0, 0, 0.4);
    border: 1px solid rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    border-radius: 15px;
    padding: 10px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    color: #fff;
    box-shadow: 0 0 24px rgba(255, 255, 255, 0.03);
    transition: background 0.25s ease, border-color 0.25s ease;
}

.player-art {
    position: relative;
    width: 42px;
    height: 42px;
    border-radius: 8px;
    flex-shrink: 0;
    overflow: hidden;
    transform: scale(calc(1 + 0.045 * var(--beat, 0)));
    transition: transform 0.12s ease-out;
}

.player-art img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 6px;
    display: block;
    transition: opacity 0.35s ease;
}

/* little equaliser that only runs while the track plays */
.eq {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 42%;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 2px;
    padding-bottom: 3px;
    background: linear-gradient(to top, rgba(0, 0, 0, 0.65), transparent);
    opacity: 0;
    transition: opacity 0.35s ease;
    pointer-events: none;
}

.playing .eq { opacity: 1; }

.eq span {
    width: 2px;
    height: 20%;
    background: rgba(255, 255, 255, 0.92);
    border-radius: 1px;
    transform-origin: bottom;
}

.playing .eq span { animation: eq-bar 0.9s ease-in-out infinite; }
.playing .eq span:nth-child(2) { animation-duration: 0.7s; animation-delay: 0.15s; }
.playing .eq span:nth-child(3) { animation-duration: 1.1s; animation-delay: 0.3s; }

@keyframes eq-bar {
    0%, 100% { transform: scaleY(1); }
    50%      { transform: scaleY(3.2); }
}

#current-time, #total-time {
    font-size: 11px;
    color: rgba(255, 255, 255, 0.6);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    min-width: 28px;
}

#progress-container {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
}

.player-controls {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
}

/* padding grows the touch target, the negative margin keeps the drawn icon
   and the spacing between controls exactly where the design puts them */
.ctrl-btn {
    width: 20px;
    height: 20px;
    padding: 7px;
    margin: -7px;
    box-sizing: content-box;
    cursor: pointer;
    color: #fff;
    flex-shrink: 0;
    overflow: visible;
    transition: opacity 0.15s ease, transform 0.15s ease;
}

.ctrl-play { width: 26px; height: 26px; }
.ctrl-btn:hover { opacity: 0.6; }
.ctrl-btn:active { transform: scale(0.85); }

/* play/pause icon swap animation */
.ctrl-play.pulse { animation: play-pulse 0.35s ease-out; }

@keyframes play-pulse {
    0%   { transform: scale(0.7); opacity: 0.5; }
    60%  { transform: scale(1.12); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
}

/* ============================================================
   FLOATING VOLUME / EFFECTS PANEL
   ============================================================ */
.top-controls {
    display: flex;
    align-items: center;
    gap: 15px;
    background: rgba(0, 0, 0, 0.4);
    padding: 8px 12px;
    border-radius: 20px;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    transition: background 0.25s ease;
}

.volume-control,
.transparency-control {
    display: flex;
    align-items: center;
    gap: 8px;
}

.volume-icon,
.transparency-icon {
    width: 20px;
    height: 20px;
    color: #fff;
    flex-shrink: 0;
    transition: transform 0.15s ease;
}

.volume-icon {
    padding: 7px;
    margin: -7px;
    box-sizing: content-box;
    overflow: visible;
}

.volume-icon { cursor: pointer; }
.volume-icon:active { transform: scale(0.85); }

/* ============================================================
   CUSTOM RANGE SLIDERS (pointer driven — work with touch drags)
   ============================================================ */
.range {
    position: relative;
    display: flex;
    align-items: center;
    height: 22px;
    cursor: pointer;
    touch-action: none;
    flex-shrink: 0;
}

.range-track {
    position: relative;
    width: 100%;
    height: 5px;
    border-radius: 5px;
    background: rgba(255, 255, 255, 0.3);
    overflow: hidden;
}

.range-fill {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    width: 0%;
    background: var(--glow);
    opacity: 0.9;
    border-radius: 5px;
}

.range-thumb {
    position: absolute;
    top: 50%;
    left: 0;
    width: 12px;
    height: 12px;
    margin-left: -6px;
    border-radius: 50%;
    background: var(--glow);
    transform: translateY(-50%);
    pointer-events: none;
    transition: box-shadow 0.2s ease;
}

.range.dragging .range-thumb { box-shadow: 0 0 0 5px rgba(255, 255, 255, 0.18); }

/* volume + effects sliders keep the flat unfilled track of the original */
.slider { width: 80px; }
.slider .range-fill { display: none; }

/* music progress bar */
#music-progress { width: 100%; }
#music-progress .range-track { height: 3px; border-radius: 3px; background: rgba(255, 255, 255, 0.25); }
#music-progress .range-thumb { width: 11px; height: 11px; margin-left: -5.5px; }

/* ============================================================
   ENTRY SCREEN
   ============================================================ */
#start-screen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    background: rgba(0, 0, 0, 0.9);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 30;
    cursor: pointer;
    opacity: 1;
    transition: opacity 0.6s ease;
}

/* tighter exit: the veil lifts faster than it blurs away */
#start-screen.fading {
    opacity: 0;
    backdrop-filter: blur(0px);
    -webkit-backdrop-filter: blur(0px);
    transition: opacity 0.42s cubic-bezier(0.4, 0, 1, 1),
                backdrop-filter 0.5s ease;
}

#start-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 0 24px;
    text-align: center;
}

/* optional second line, revealed with a short glitch */
#start-subtitle {
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.4);
    opacity: 0;
    white-space: pre;
}

#start-subtitle.in {
    animation: subtitle-in 0.5s steps(2, end) 0.35s forwards,
               glitch 0.2s ease-in-out 0.5s 2;
}

@keyframes subtitle-in {
    from { opacity: 0; letter-spacing: 6px; }
    to   { opacity: 1; letter-spacing: 2px; }
}

#start-text {
    font-size: 24px;
    color: #fff;
    text-align: center;
    white-space: pre;
    animation: start-breathe 3.2s ease-in-out infinite;
    transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
}

@keyframes start-breathe {
    0%, 100% { opacity: 0.72; text-shadow: 0 0 12px rgba(255, 255, 255, 0.18); }
    50%      { opacity: 1;    text-shadow: 0 0 22px rgba(255, 255, 255, 0.45); }
}

#start-screen.fading #start-inner {
    animation: none;
    transform: scale(1.18);
    opacity: 0;
    transition: transform 0.42s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
}

/* glitch nudge used by the typewriters */
.glitch { animation: glitch 0.2s ease-in-out; }

@keyframes glitch {
    0%   { transform: translate(0); }
    20%  { transform: translate(-2px, 2px); }
    40%  { transform: translate(-2px, -2px); }
    60%  { transform: translate(2px, 2px); }
    80%  { transform: translate(2px, -2px); }
    100% { transform: translate(0); }
}

/* ============================================================
   MOBILE (the layout the reference screenshots were taken in)
   ============================================================ */
@media (max-width: 430px) {
    #profile-block {
        width: 90vw;
        max-width: 350px;
        min-height: unset;
        max-height: none;
        padding: 12px;
        gap: 8px;
    }

    .profile-header { gap: 10px; }

    .profile-container,
    .profile-picture { width: 70px; height: 70px; }

    .profile-info { align-items: flex-start; text-align: left; }

    .name-and-badges {
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
    }

    #profile-name { font-size: 20px; letter-spacing: 1px; }

    /* scaled to sit with the 20px name rather than crowd it */
    .name-row { gap: 6px; }
    .badges { gap: 4px; }
    .badge { width: 17px; height: 17px; }
    #profile-bio { font-size: 12px; line-height: 1.3; }
    .bio-separator { margin: 6px 0; }

    .social-links { gap: 10px; }
    .social-icon { width: 32px; height: 32px; }

    .visitor-counter { font-size: 12px; padding: 6px 12px; align-self: center; }
    .visitor-icon { width: 16px; height: 16px; }
    .visitor-counter .tooltip { width: 100px; font-size: 12px; margin-left: -50px; top: -30px; }

    #music-player {
        width: 90vw;
        max-width: 350px;
        padding: 8px 12px;
        gap: 8px;
    }

    .player-art { width: 32px; height: 32px; }

    .top-controls { gap: 10px; padding: 6px 10px; }
    .volume-control, .transparency-control { gap: 6px; }
    .volume-icon, .transparency-icon { width: 18px; height: 18px; }

    .slider { width: 60px; }
    .slider .range-track { height: 4px; }
    .slider .range-thumb { width: 10px; height: 10px; margin-left: -5px; }

    #start-text { font-size: 18px; padding: 0 20px; }
}

/* very short viewports — keep everything on screen */
@media (max-height: 620px) {
    #stack { gap: 8px; }
    #profile-block { padding: 10px; }
}

@media (prefers-reduced-motion: reduce) {
    #background.animate,
    .revealed #profile-block,
    .revealed #music-player,
    .social-links a .social-icon,
    #start-text,
    #start-subtitle,
    .status-dot::after,
    .bloom,
    .mote,
    .playing .eq span { animation: none; }

    .profile-container::after { animation: none; opacity: 0; }
    #background-wrap { transition: none; }
    .player-art { transform: none; }
    .magnet { transition: none; transform: none; }
    .mote { display: none; }              /* motes only exist to move */
    .bloom { opacity: 0.05; }
}
</style>
</head>
<body>

<!-- ================= ENTRY SCREEN ================= -->
<div id="start-screen">

        <div id="start-text"></div>
        <div id="start-subtitle"></div>

</div>

<div class="container">

                </div>
            </div>

            <div class="bio-separator"></div>

            <div class="profile-footer">

                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>

        <div id="music-player">

    </div>

<script>
/* ================================================================
   CONFIGURATION — everything you would normally want to change
   ================================================================ */
const CONFIG = {
    /* ---------- palette ----------
       Three colours re-theme the whole page. They are published as CSS custom
       properties, so the card glow, status ring, slider fills, spark bursts,
       ambient particles and the beat glow all follow from here. */
    theme: {
        accent: "#ed4245",              // sliders, sparks, status ring, badges
        glow:   "#ffffff",              // card / avatar rim glow
        beat:   "#ffffff",              // audio-reactive pulse
        accentStatus: false             // true = status dot always uses accent
                                        // instead of the status mode's colour
    },

    /* ---------- identity ---------- */
    username: "imran",
    pageTitle: "",                      // browser tab; "" uses the username

    /* Emblems shown beside the name. `icon` is a key of BADGE_ICONS
       (verified, owner, star, bolt, dev, music); `label` is its tooltip and
       `color` is optional — it defaults to the accent. Empty list = no row. */
    badges: [
        { icon: "verified", label: "Verified" },
        { icon: "owner",    label: "Owner", color: "#f0b232" }
    ],
    /* Any key from STATUS_MODES below the CONFIG block — online, idle, dnd,
       offline, invisible, busy, focus, working, gaming, streaming, away,
       sleeping, touchGrass, doNotPerceiveMe. Each brings its own dot colour
       and wording, so changing your status is one word here.

       Pass a list instead and the status cycles through them:
           status: ["dnd", "gaming", "sleeping"]
       statusText overrides the wording for a single mode; leave "" to use the
       mode's own label. */
    status: "dnd",
    statusText: "",
    statusInterval: 5000,               // ms per mode when status is a list

    /* Tapping the status opens a small picker. Each mode animates its dot
       differently — dnd pings, silent dims, normal breathes. */
    statusPicker: {
        enabled: true,
        options: ["dnd", "silent", "normal"],
        silentMutes: true               // choosing Silent Mode also mutes the player
    },

    /* Live Discord presence via lanyard.rest — the dot and label then follow
       your real status, including what you are playing or listening to.
       Requires you to have joined discord.gg/lanyard. Set to "" for a page
       that makes no network requests at all; the status above is then used. */
    discordUserId: "1327961337757831219",
    bio: [                              // string, or list of strings to cycle through
        "\"Hello, World!\"",
        "Stay locked in. Let them yap.",
        "Zero aura lost. Lesson learned.",
        "Built different, moving silent.",
        "Don't chase. Upgrade.",
        "Too focused to care.",
        "Respect earned. Aura maintained.",
        "Pressure creates final bosses.",
        "Silent grind, loud results.",
        "Mindset maxed. Distractions deleted.",
        "Be the plot twist.",
        "Stay mysterious. Move calculated.",
        "Skibidi world, sigma mindset."
    ],

    /* ---------- media ----------

/* tiny tween used for smooth click-to-seek — replaces the GSAP call of the original */
function tween(from, to, duration, onUpdate, onComplete) {
    const start = performance.now();
    const ease = (t) => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;   // power2.inOut
    function step(now) {
        const t = clamp((now - start) / duration, 0, 1);
        onUpdate(from + (to - from) * ease(t));
        if (t < 1) requestAnimationFrame(step);
        else if (onComplete) onComplete();
    }
    requestAnimationFrame(step);
}

/* ================================================================
   CUSTOM SLIDER — pointer based so touch dragging works everywhere
   ================================================================ */
let slidersDragging = 0;          // pauses the 3D tilt while a slider is in use

function createSlider(el, { min = 0, max = 1, value = 0, onInput, onChange, onDown } = {}) {
    const fill = el.querySelector('.range-fill');
    const thumb = el.querySelector('.range-thumb');
    const state = { min, max, value, dragging: false };

    function paint() {
        const pct = state.max > state.min
            ? clamp((state.value - state.min) / (state.max - state.min), 0, 1) * 100
            : 0;
        fill.style.width = pct + '%';
        thumb.style.left = pct + '%';
        el.setAttribute('aria-valuenow', Math.round(pct));
    }

    function valueFromEvent(e) {
        const rect = el.getBoundingClientRect();
        const pct = rect.width ? clamp((e.clientX - rect.left) / rect.width, 0, 1) : 0;
        return state.min + pct * (state.max - state.min);
    }

    el.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        e.stopPropagation();
        state.dragging = true;
        slidersDragging++;
        el.classList.add('dragging');
        el.setPointerCapture(e.pointerId);
        if (onDown) onDown();
        state.value = valueFromEvent(e);
        paint();
        if (onInput) onInput(state.value, false);
    });

    el.addEventListener('pointermove', (e) => {
        if (!state.dragging) return;
        e.preventDefault();
        state.value = valueFromEvent(e);
        paint();
        if (onInput) onInput(state.value, true);
    });

    function release() {
        if (!state.dragging) return;
        state.dragging = false;
        slidersDragging = Math.max(0, slidersDragging - 1);
        el.classList.remove('dragging');
        if (onChange) onChange(state.value);
    }

    el.addEventListener('pointerup', release);
    el.addEventListener('pointercancel', release);

    el.addEventListener('keydown', (e) => {
        const step = (state.max - state.min) / 20;
        if (e.key === 'ArrowRight' || e.key === 'ArrowUp') state.value = clamp(state.value + step, state.min, state.max);
        else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') state.value = clamp(state.value - step, state.min, state.max);
        else return;
        e.preventDefault();
        paint();
        if (onInput) onInput(state.value, true);
        if (onChange) onChange(state.value);
    });

    paint();                                    // draw the starting position

    return {
        el,
        get value() { return state.value; },
        get dragging() { return state.dragging; },
        set(v, silent) {
            state.value = clamp(v, state.min, state.max);
            paint();
            if (!silent && onInput) onInput(state.value, false);
        },
        setRange(newMin, newMax) {
            state.min = newMin;
            state.max = newMax;
            paint();
        }
    };
}
