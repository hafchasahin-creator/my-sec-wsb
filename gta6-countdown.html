<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GTA VI Countdown — Vice City Awaits</title>
<meta name="description" content="An animated neon countdown to the Grand Theft Auto VI release date." />
<style>
/* ============================================================
   GTA VI COUNTDOWN — single file, no dependencies
   ============================================================ */
:root{
  --pink:#ff2d95;
  --magenta:#ff5cc8;
  --cyan:#22e8ff;
  --violet:#7b2ff7;
  --gold:#ffcf4d;
  --orange:#ff7a2f;
  --ink:#07020f;
  --sky-1:#1b0630;
  --sky-2:#5a1160;
  --sky-3:#c11f6b;
  --sky-4:#ff6a3d;
  --font: "Impact", "Haettenschweiler", "Arial Narrow Bold", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--ink);
  color:#fff;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  overflow-x:hidden;
  min-height:100svh;
  display:flex;
  flex-direction:column;
  -webkit-font-smoothing:antialiased;
}

/* ---------- SCENE / BACKDROP ---------- */
.scene{position:fixed;inset:0;overflow:hidden;z-index:0}
.sky{
  position:absolute;inset:0;
  background:linear-gradient(180deg,
    #05010d 0%, var(--sky-1) 22%, var(--sky-2) 45%,
    var(--sky-3) 62%, var(--sky-4) 74%, #ffb066 80%, #2a0a3a 80.5%, #0a0216 100%);
  animation:skyshift 24s ease-in-out infinite alternate;
}
@keyframes skyshift{
  0%{filter:hue-rotate(0deg) saturate(1)}
  100%{filter:hue-rotate(-18deg) saturate(1.2)}
}

/* stars canvas */
#stars{position:absolute;inset:0;width:100%;height:100%}

/* retro sun */
.sun{
  position:absolute;left:50%;top:34%;
  width:min(40vw,380px);aspect-ratio:1;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:linear-gradient(180deg,var(--gold) 0%,#ff9d3d 38%,var(--pink) 72%,var(--violet) 100%);
  box-shadow:0 0 90px 30px rgba(255,90,150,.45), 0 0 220px 80px rgba(255,60,140,.25);
  animation:sunbob 9s ease-in-out infinite alternate;
}
.sun::after{
  content:"";position:absolute;inset:0;border-radius:50%;
  background:repeating-linear-gradient(180deg,
    transparent 0 14px, rgba(10,2,22,.92) 14px 18px);
  mask-image:linear-gradient(180deg,transparent 40%,#000 62%,#000 100%);
  -webkit-mask-image:linear-gradient(180deg,transparent 40%,#000 62%,#000 100%);
  animation:stripes 6s linear infinite;
}
@keyframes stripes{to{background-position:0 32px}}
@keyframes sunbob{from{transform:translate(-50%,-52%)}to{transform:translate(-50%,-46%)}}

/* horizon glow + reflection */
.horizon{
  position:absolute;left:0;right:0;top:80%;height:2px;
  background:linear-gradient(90deg,transparent,var(--cyan),#fff,var(--pink),transparent);
  box-shadow:0 0 24px 4px rgba(34,232,255,.7);
}

/* perspective grid floor */
.grid{
  position:absolute;left:-50%;right:-50%;top:80%;bottom:-10%;
  background-image:
    linear-gradient(to right, rgba(34,232,255,.55) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255,45,149,.55) 1px, transparent 1px);
  background-size:5% 46px;
  transform:perspective(320px) rotateX(72deg);
  transform-origin:top center;
  animation:scroll 1.6s linear infinite;
  mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.25) 65%,transparent 100%);
  -webkit-mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.25) 65%,transparent 100%);
}
@keyframes scroll{to{background-position:0 46px, 0 46px}}

/* clouds */
.cloud{
  position:absolute;height:min(9vw,70px);width:min(34vw,300px);
  background:radial-gradient(closest-side,rgba(255,140,190,.42),transparent 70%);
  filter:blur(6px);
  animation:drift linear infinite;
}
.c1{top:14%;animation-duration:64s}
.c2{top:26%;animation-duration:88s;animation-delay:-20s;opacity:.7}
.c3{top:8%;animation-duration:112s;animation-delay:-55s;opacity:.5}
@keyframes drift{from{transform:translateX(-40vw)}to{transform:translateX(130vw)}}

/* palm silhouettes */
.palm{position:absolute;bottom:0;height:min(78vh,560px);opacity:.96;filter:drop-shadow(0 0 18px rgba(255,45,149,.35))}
.palm svg{height:100%;width:auto;display:block}
.palm-l{left:-2vw;transform-origin:bottom center;animation:sway 7s ease-in-out infinite alternate}
.palm-r{right:-3vw;height:min(64vh,470px);transform-origin:bottom center;animation:sway 9s ease-in-out -2s infinite alternate-reverse}
@keyframes sway{from{transform:rotate(-1.1deg)}to{transform:rotate(1.4deg)}}

/* skyline strip */
.skyline{position:absolute;left:0;right:0;top:calc(80% - 96px);height:96px;opacity:.85}
.skyline svg{width:100%;height:100%}

/* scanlines + vignette + grain */
.crt{
  position:fixed;inset:0;z-index:5;pointer-events:none;
  background:repeating-linear-gradient(180deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);
  mix-blend-mode:multiply;opacity:.55;
}
.vignette{
  position:fixed;inset:0;z-index:4;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 45%,transparent 40%,rgba(4,0,10,.78) 100%);
}

/* ---------- CONTENT ---------- */
.wrap::before{
  content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(58% 46% at 50% 52%,rgba(6,1,14,.62),rgba(6,1,14,.22) 60%,transparent 78%);
}
.wrap{
  position:relative;z-index:6;
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(14px,2.4vh,28px);
  padding:clamp(20px,4vw,48px) 18px calc(clamp(20px,4vw,48px) + env(safe-area-inset-bottom));
  text-align:center;
}

.kicker{
  font-family:var(--mono);
  font-size:clamp(10px,1.5vw,13px);
  letter-spacing:.42em;text-transform:uppercase;
  color:var(--cyan);
  text-shadow:0 0 14px rgba(34,232,255,.85),0 2px 8px rgba(4,0,10,.95);
  animation:flicker 5s steps(1) infinite;
}
@keyframes flicker{0%,92%,100%{opacity:1}93%{opacity:.25}94%{opacity:1}96%{opacity:.4}97%{opacity:1}}

/* logo */
.logo{position:relative;line-height:.86}
.logo .word{
  font-family:var(--font);
  font-size:clamp(64px,17vw,190px);
  letter-spacing:.02em;
  text-transform:uppercase;
  background:linear-gradient(180deg,#fff 4%,var(--gold) 26%,var(--pink) 58%,var(--violet) 96%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 26px rgba(255,45,149,.55)) drop-shadow(0 6px 0 rgba(0,0,0,.35));
}
.logo .ghost{
  position:absolute;inset:0;color:transparent;background:none;
  -webkit-text-stroke:1px rgba(34,232,255,.7);
  animation:glitch 4.2s infinite steps(2);
  pointer-events:none;
}
.logo .ghost.b{-webkit-text-stroke-color:rgba(255,45,149,.7);animation-delay:-2.1s}
@keyframes glitch{
  0%,86%,100%{transform:translate(0,0);opacity:0}
  87%{transform:translate(-5px,2px);opacity:.9;clip-path:inset(12% 0 62% 0)}
  89%{transform:translate(6px,-3px);opacity:.9;clip-path:inset(58% 0 18% 0)}
  91%{transform:translate(-3px,1px);opacity:.8;clip-path:inset(32% 0 44% 0)}
  93%{transform:translate(0,0);opacity:0}
}

.tagline{
  font-family:var(--mono);
  font-size:clamp(11px,1.7vw,15px);
  letter-spacing:.3em;text-transform:uppercase;
  color:#ffd9ec;text-shadow:0 0 12px rgba(255,45,149,.7);
}

/* countdown */
.clock{
  display:flex;flex-wrap:wrap;justify-content:center;
  gap:clamp(8px,1.6vw,20px);
  margin-top:clamp(4px,1.5vh,14px);
}
.unit{
  min-width:clamp(74px,15vw,150px);
  padding:clamp(10px,1.6vw,18px) clamp(8px,1.5vw,16px);
  border-radius:16px;
  background:linear-gradient(180deg,rgba(20,4,38,.72),rgba(8,1,18,.86));
  border:1px solid rgba(255,255,255,.14);
  box-shadow:
    0 0 0 1px rgba(255,45,149,.35) inset,
    0 0 28px rgba(255,45,149,.28),
    0 18px 44px rgba(0,0,0,.55);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  position:relative;overflow:hidden;
}
.unit::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(255,255,255,.14),transparent 42%);
  pointer-events:none;
}
.unit.pulse{animation:pop .55s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.055)}100%{transform:scale(1)}}

.odo{
  display:flex;justify-content:center;
  font-family:var(--font);
  font-size:clamp(38px,8.4vw,86px);
  line-height:1;
  color:#fff;
  text-shadow:0 0 18px rgba(34,232,255,.55),0 0 42px rgba(255,45,149,.45);
}
.dcol{height:1em;overflow:hidden;width:.6em}
.dstrip{display:flex;flex-direction:column;transition:transform .62s cubic-bezier(.16,1,.3,1)}
.dstrip b{height:1em;font-weight:inherit;display:block}
.label{
  margin-top:8px;
  font-family:var(--mono);
  font-size:clamp(9px,1.25vw,12px);
  letter-spacing:.28em;text-transform:uppercase;
  color:var(--cyan);opacity:.9;
}

/* progress */
.progress{width:min(760px,92vw);margin-top:clamp(6px,1.6vh,16px)}
.bar{
  height:10px;border-radius:999px;overflow:hidden;
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.16);
  box-shadow:0 0 22px rgba(123,47,247,.4) inset;
}
.fill{
  height:100%;width:0%;
  background:linear-gradient(90deg,var(--violet),var(--pink),var(--gold),var(--cyan));
  background-size:300% 100%;
  animation:slide 5s linear infinite;
  box-shadow:0 0 18px rgba(255,45,149,.85);
  transition:width 1s ease;
}
@keyframes slide{to{background-position:300% 0}}
.meta{
  display:flex;justify-content:space-between;gap:10px;
  margin-top:8px;
  font-family:var(--mono);font-size:clamp(9px,1.2vw,11.5px);
  letter-spacing:.16em;text-transform:uppercase;color:#e8c9ff;opacity:.85;
}

/* stat chips */
.stats{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:6px}
.chip{
  font-family:var(--mono);font-size:clamp(9.5px,1.2vw,12px);
  letter-spacing:.12em;text-transform:uppercase;
  padding:7px 13px;border-radius:999px;
  border:1px solid rgba(34,232,255,.4);
  background:rgba(34,232,255,.08);
  color:#d8fbff;
  box-shadow:0 0 16px rgba(34,232,255,.22);
}
.chip b{color:#fff;font-weight:700}

/* footer bar */
.footer{
  position:relative;z-index:6;
  padding:14px 18px calc(14px + env(safe-area-inset-bottom));
  display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px 16px;
  font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:#ffbfe0;
  background:linear-gradient(180deg,transparent,rgba(6,1,14,.72));
}
.btn{
  font:inherit;cursor:pointer;
  padding:9px 16px;border-radius:999px;
  color:#fff;background:rgba(255,45,149,.16);
  border:1px solid rgba(255,45,149,.55);
  box-shadow:0 0 18px rgba(255,45,149,.3);
  transition:transform .15s ease, box-shadow .25s ease, background .25s ease;
}
.btn:hover{transform:translateY(-2px);background:rgba(255,45,149,.3);box-shadow:0 0 26px rgba(255,45,149,.55)}
.btn:active{transform:translateY(0)}
.btn:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}

/* launched state */
.launched .clock{display:none}
.launched-msg{display:none}
.launched .launched-msg{
  display:block;
  font-family:var(--font);
  font-size:clamp(34px,8vw,90px);
  background:linear-gradient(180deg,#fff,var(--gold),var(--pink));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:pop 1s ease infinite alternate;
}

#fx{position:fixed;inset:0;z-index:7;pointer-events:none}

@media (max-width:760px){
  .palm-r{display:none}
  .palm-l{left:-22vw;height:min(52vh,340px);opacity:.75}
  .skyline{height:70px;top:calc(80% - 70px)}
}
@media (max-width:520px){
  .unit{min-width:70px}
  .meta{flex-direction:column;align-items:center;gap:4px;text-align:center}
  .clock{gap:8px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important}
}
</style>
</head>
<body>

<div class="scene" aria-hidden="true">
  <div class="sky"></div>
  <canvas id="stars"></canvas>
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>
  <div class="sun" data-depth="6"></div>

  <div class="skyline">
    <svg viewBox="0 0 1200 96" preserveAspectRatio="none">
      <g fill="#160326">
        <rect x="20" y="40" width="46" height="56"/><rect x="72" y="20" width="26" height="76"/>
        <rect x="104" y="56" width="60" height="40"/><rect x="176" y="12" width="30" height="84"/>
        <rect x="212" y="46" width="52" height="50"/><rect x="276" y="30" width="38" height="66"/>

        <rect x="446" y="50" width="56" height="46"/><rect x="516" y="36" width="34" height="60"/>
        <rect x="562" y="8"  width="22" height="88"/><rect x="596" y="52" width="64" height="44"/>
        <rect x="672" y="28" width="32" height="68"/><rect x="716" y="58" width="58" height="38"/>

        <rect x="80" y="30" width="4" height="4"/><rect x="88" y="44" width="4" height="4"/>
        <rect x="182" y="24" width="4" height="4"/><rect x="192" y="40" width="4" height="4"/>
        <rect x="414" y="34" width="4" height="4"/><rect x="568" y="20" width="4" height="4"/>
        <rect x="568" y="40" width="4" height="4"/><rect x="680" y="40" width="4" height="4"/>

  <div class="horizon"></div>

    <svg viewBox="0 0 260 560" fill="none">
      <path d="M126 560c-4-140 2-250 16-352l14 3c-16 104-22 212-18 349z" fill="#0d0118"/>
      <g fill="#0d0118">
        <path d="M150 208c34-40 84-56 110-44-30-2-66 16-92 52z"/>

        <path d="M148 206c-14-44-58-72-96-70 38 8 68 34 82 76z"/>

<div class="vignette" aria-hidden="true"></div>
<div class="crt" aria-hidden="true"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<main class="wrap" id="app">
  <p class="kicker">Coming to Leonida</p>

  <h1 class="logo">
    <span class="word">GTA VI</span>
    <span class="word ghost a" aria-hidden="true">GTA VI</span>
    <span class="word ghost b" aria-hidden="true">GTA VI</span>
  </h1>

  <p class="tagline" id="tagline">Leonida is waiting</p>

  <section class="clock" id="clock" aria-live="polite" aria-label="Time remaining until launch">
    <div class="unit"><div class="odo" data-unit="days"></div><div class="label">Days</div></div>
    <div class="unit"><div class="odo" data-unit="hours"></div><div class="label">Hours</div></div>
    <div class="unit"><div class="odo" data-unit="minutes"></div><div class="label">Minutes</div></div>
    <div class="unit"><div class="odo" data-unit="seconds"></div><div class="label">Seconds</div></div>
  </section>

  <p class="launched-msg">IT'S LIVE.</p>

  <section class="progress" aria-label="Progress toward launch">
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="meta">
      <span id="pctText">0% there</span>
      <span id="dateText">—</span>
    </div>
  </section>

  <section class="stats">
    <div class="chip">Weeks left <b id="sWeeks">—</b></div>
    <div class="chip">Hours left <b id="sHours">—</b></div>
    <div class="chip">Seconds left <b id="sSecs">—</b></div>
  </section>
</main>

<footer class="footer">
  <span>Vice City · Leonida · <span id="tz">local time</span></span>
  <span style="opacity:.6">Fan-made · not affiliated with Rockstar Games</span>
  <button class="btn" id="motionBtn" type="button">Pause motion</button>
  <button class="btn" id="shareBtn" type="button">Copy countdown</button>
</footer>

<script>
(function () {
  "use strict";

  /* ---------------------------------------------------------
     Target: GTA VI launch — 19 November 2026, local midnight.
     Change this one line if Rockstar moves the date again.
  --------------------------------------------------------- */
  var TARGET = new Date(2026, 10, 19, 0, 0, 0);          // Nov 19, 2026
  var ORIGIN = new Date(2023, 11, 4, 0, 0, 0);           // Trailer 1 reveal: Dec 4, 2023
  var TOTAL  = TARGET - ORIGIN;

  var app = document.getElementById("app");
  var fillEl = document.getElementById("fill");
  var pctEl = document.getElementById("pctText");
  var dateEl = document.getElementById("dateText");
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  dateEl.textContent = TARGET.toLocaleDateString(undefined, {
    weekday: "long", year: "numeric", month: "long", day: "numeric"
  });
  try {
    document.getElementById("tz").textContent =
      Intl.DateTimeFormat().resolvedOptions().timeZone || "local time";
  } catch (e) {}

  /* ---------------- odometer digits ---------------- */
  var PAD = { days: 3, hours: 2, minutes: 2, seconds: 2 };
  var odos = {};

  document.querySelectorAll(".odo").forEach(function (el) {
    var unit = el.dataset.unit;
    var cols = [];
    for (var i = 0; i < PAD[unit]; i++) {
      var col = document.createElement("div");
      col.className = "dcol";
      var strip = document.createElement("div");
      strip.className = "dstrip";
      for (var d = 0; d <= 9; d++) {
        var b = document.createElement("b");
        b.textContent = d;
        strip.appendChild(b);
      }
      col.appendChild(strip);
      el.appendChild(col);
      cols.push(strip);
    }
    odos[unit] = { cols: cols, card: el.parentElement, last: null };
  });

  function setUnit(unit, value) {
    var o = odos[unit];
    var text = String(Math.max(0, value)).padStart(PAD[unit], "0").slice(-PAD[unit]);
    if (text === o.last) return;
    o.last = text;
    for (var i = 0; i < o.cols.length; i++) {
      o.cols[i].style.transform = "translateY(-" + Number(text[i]) + "em)";
    }
    if (!reduce && unit !== "seconds") {
      o.card.classList.remove("pulse");
      void o.card.offsetWidth;
      o.card.classList.add("pulse");
    }
  }

  var nf = new Intl.NumberFormat();
  var sWeeks = document.getElementById("sWeeks");
  var sHours = document.getElementById("sHours");
  var sSecs = document.getElementById("sSecs");
  var launched = false;

  function tick() {
    var diff = TARGET - Date.now();

    if (diff <= 0) {
      if (!launched) {
        launched = true;
        app.classList.add("launched");
        document.getElementById("tagline").textContent = "Welcome back to Vice City";
        burst(180);
      }
      fillEl.style.width = "100%";
      pctEl.textContent = "100% — released";
      sWeeks.textContent = sHours.textContent = sSecs.textContent = "0";
      return;
    }

    var s = Math.floor(diff / 1000);
    setUnit("days", Math.floor(s / 86400));
    setUnit("hours", Math.floor(s / 3600) % 24);
    setUnit("minutes", Math.floor(s / 60) % 60);
    setUnit("seconds", s % 60);

    var pct = Math.min(100, Math.max(0, ((TOTAL - diff) / TOTAL) * 100));
    fillEl.style.width = pct.toFixed(3) + "%";
    pctEl.textContent = pct.toFixed(2) + "% of the wait is over";

    sWeeks.textContent = nf.format(Math.floor(s / 604800));
    sHours.textContent = nf.format(Math.floor(s / 3600));
    sSecs.textContent = nf.format(s);
  }

  /* ---------------- starfield ---------------- */
  var starCanvas = document.getElementById("stars");
  var sctx = starCanvas.getContext("2d");
  var stars = [], shooters = [], dpr = 1, W = 0, H = 0;

  function sizeCanvas(cv) {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = Math.floor(W * dpr);
    cv.height = Math.floor(H * dpr);
    cv.getContext("2d").setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function seedStars() {
    stars = [];
    var count = Math.round((W * H) / 5200);
    for (var i = 0; i < count; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H * 0.7,
        r: Math.random() * 1.4 + 0.25,
        a: Math.random(),
        sp: Math.random() * 0.02 + 0.004
      });
    }
  }

  function resizeAll() {
    sizeCanvas(starCanvas);
    seedStars();
    sizeCanvas(fxCanvas);
  }

  /* ---------------- particles / confetti ---------------- */
  var fxCanvas = document.getElementById("fx");
  var fctx = fxCanvas.getContext("2d");
  var bits = [];
  var COLORS = ["#ff2d95", "#22e8ff", "#ffcf4d", "#7b2ff7", "#ff7a2f", "#ffffff"];

  function burst(n) {
    for (var i = 0; i < n; i++) {
      bits.push({
        x: W / 2 + (Math.random() - 0.5) * W * 0.5,
        y: H * 0.45 + (Math.random() - 0.5) * 90,
        vx: (Math.random() - 0.5) * 8,
        vy: -Math.random() * 9 - 2,
        g: 0.16 + Math.random() * 0.1,
        s: Math.random() * 6 + 3,
        rot: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 0.3,
        c: COLORS[(Math.random() * COLORS.length) | 0],
        life: 1
      });
    }
  }

  /* ambient embers rising from the horizon */
  function ember() {
    bits.push({
      x: Math.random() * W,
      y: H * 0.86,
      vx: (Math.random() - 0.5) * 0.5,
      vy: -(0.4 + Math.random() * 0.9),
      g: -0.002,
      s: Math.random() * 2.4 + 1,
      rot: 0, vr: 0,
      c: Math.random() < 0.5 ? "#ff2d95" : "#ffcf4d",
      life: 1, fade: 0.006
    });
  }

  var paused = false, last = 0;

  function frame(t) {
    requestAnimationFrame(frame);
    if (paused) return;
    var dt = Math.min(48, t - last); last = t;

    /* stars */
    sctx.clearRect(0, 0, W, H);
    for (var i = 0; i < stars.length; i++) {
      var st = stars[i];
      st.a += st.sp;
      var alpha = 0.35 + Math.sin(st.a) * 0.35;
      sctx.globalAlpha = Math.max(0, alpha);
      sctx.fillStyle = i % 9 === 0 ? "#22e8ff" : "#ffffff";
      sctx.beginPath();
      sctx.arc(st.x, st.y, st.r, 0, 6.283);
      sctx.fill();
    }
    sctx.globalAlpha = 1;

    /* shooting stars */
    if (Math.random() < 0.004 && shooters.length < 2) {
      shooters.push({ x: Math.random() * W, y: Math.random() * H * 0.35, v: 9 + Math.random() * 6, l: 1 });
    }
    for (var k = shooters.length - 1; k >= 0; k--) {
      var sh = shooters[k];
      sh.x += sh.v; sh.y += sh.v * 0.42; sh.l -= 0.012;
      var grd = sctx.createLinearGradient(sh.x, sh.y, sh.x - 130, sh.y - 55);
      grd.addColorStop(0, "rgba(255,255,255," + Math.max(0, sh.l) + ")");
      grd.addColorStop(1, "rgba(34,232,255,0)");
      sctx.strokeStyle = grd; sctx.lineWidth = 2;
      sctx.beginPath(); sctx.moveTo(sh.x, sh.y); sctx.lineTo(sh.x - 130, sh.y - 55); sctx.stroke();
      if (sh.l <= 0 || sh.x > W + 160) shooters.splice(k, 1);
    }

    /* particles */
    if (!launched && Math.random() < 0.14) ember();
    fctx.clearRect(0, 0, W, H);
    for (var j = bits.length - 1; j >= 0; j--) {
      var p = bits[j];
      p.vy += p.g;
      p.x += p.vx * (dt / 16);
      p.y += p.vy * (dt / 16);
      p.rot += p.vr;
      p.life -= (p.fade || 0.004);
      if (p.life <= 0 || p.y > H + 40) { bits.splice(j, 1); continue; }
      fctx.save();
      fctx.globalAlpha = Math.max(0, Math.min(1, p.life));
      fctx.translate(p.x, p.y);
      fctx.rotate(p.rot);
      fctx.fillStyle = p.c;
      fctx.shadowColor = p.c; fctx.shadowBlur = 12;
      fctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * (p.vr ? 0.6 : 1));
      fctx.restore();
    }
  }

  /* ---------------- parallax ---------------- */
  var layers = document.querySelectorAll("[data-depth]");
  window.addEventListener("pointermove", function (e) {
    if (reduce || paused) return;
    var dx = (e.clientX / window.innerWidth - 0.5);
    var dy = (e.clientY / window.innerHeight - 0.5);
    layers.forEach(function (el) {
      var d = Number(el.dataset.depth);
      el.style.setProperty("--px", (dx * d).toFixed(2) + "px");
      el.style.translate = (dx * d).toFixed(2) + "px " + (dy * d * 0.4).toFixed(2) + "px";
    });
  }, { passive: true });

  /* ---------------- controls ---------------- */
  var motionBtn = document.getElementById("motionBtn");
  motionBtn.addEventListener("click", function () {
    paused = !paused;
    document.querySelectorAll(".sky,.sun,.grid,.cloud,.palm,.kicker,.ghost,.fill")
      .forEach(function (el) { el.style.animationPlayState = paused ? "paused" : "running"; });
    motionBtn.textContent = paused ? "Resume motion" : "Pause motion";
    if (!paused) { sctx.clearRect(0, 0, W, H); }
  });

  document.getElementById("shareBtn").addEventListener("click", function () {
    var text;
    if (launched) {
      text = "GTA VI is out — " + dateEl.textContent + ". Welcome back to Vice City.";
    } else {
      text = "GTA VI drops " + dateEl.textContent + " — " +
        odos.days.last + "d " + odos.hours.last + "h " +
        odos.minutes.last + "m " + odos.seconds.last + "s to go.";
    }
    var done = function () {
      var el = document.getElementById("shareBtn");
      el.textContent = "Copied!";
      setTimeout(function () { el.textContent = "Copy countdown"; }, 1600);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { window.prompt("Copy:", text); });
    } else {
      window.prompt("Copy:", text);
    }
  });

  /* click anywhere for a little confetti */
  document.addEventListener("click", function (e) {
    if (e.target.closest(".btn")) return;
    for (var i = 0; i < 26; i++) {
      bits.push({
        x: e.clientX, y: e.clientY,
        vx: (Math.random() - 0.5) * 7,
        vy: -Math.random() * 6 - 1,
        g: 0.2, s: Math.random() * 5 + 2,
        rot: Math.random() * 3, vr: (Math.random() - 0.5) * 0.4,
        c: COLORS[(Math.random() * COLORS.length) | 0],
        life: 1
      });
    }
  });

  /* ---------------- boot ---------------- */
  window.addEventListener("resize", resizeAll);
  resizeAll();
  if (!reduce) requestAnimationFrame(frame);

  var timer;
  tick();
  timer = setInterval(tick, 250);

  document.addEventListener("visibilitychange", function () {
    if (document.hidden) { clearInterval(timer); }
    else { tick(); timer = setInterval(tick, 250); }
  });
})();
</script>
</body>
</html>
