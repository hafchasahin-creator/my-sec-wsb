<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>0 → 9M Subscribers</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:      #08080a;
    --card:    #131317;
    --card-2:  #191920;
    --line:    #292933;
    --text:    #f5f5f7;
    --muted:   #9b9baa;
    --red:     #ff0033;
    --red-2:   #ff3b5c;
    --gold:    #ffcc4d;
    --silver:  #dbe2ee;
    --diamond: #8fe6ff;
    --ch: 62px;               /* odometer cell height, overridden responsively */
  }

  html, body { height: 100%; }
  html { overflow-x: hidden; }

  body {
    min-height: 100vh;
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    justify-items: center;
    align-content: center;
    padding: 24px 16px;
    overflow-x: hidden;
    color: var(--text);
    background:
      radial-gradient(900px 600px at 50% -15%, #2a0f16 0%, rgba(42,15,22,0) 65%),
      radial-gradient(700px 500px at 90% 110%, #101c2a 0%, rgba(16,28,42,0) 60%),
      var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  #fx { position: fixed; inset: 0; z-index: 5; pointer-events: none; }

  /* ---------- card ---------- */

  main { width: min(760px, 100%); min-width: 0; }

  .card {
    position: relative;
    z-index: 2;
    width: 100%;
    padding: clamp(18px, 3.4vw, 30px);
    border: 1px solid var(--line);
    border-radius: 22px;
    background: linear-gradient(180deg, var(--card-2), var(--card));
    box-shadow: 0 40px 90px -30px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.045);
    transition: box-shadow .6s ease, border-color .6s ease;
  }
  .card.done {
    border-color: rgba(255,0,51,.45);
    box-shadow: 0 40px 100px -25px rgba(255,0,51,.35), 0 0 0 1px rgba(255,0,51,.2), inset 0 1px 0 rgba(255,255,255,.06);
  }
  .card.shake { animation: shake .42s cubic-bezier(.36,.07,.19,.97); }
  @keyframes shake {
    10%, 90% { transform: translate3d(-1.5px,0,0); }
    30%, 70% { transform: translate3d(3px,0,0); }
    50%      { transform: translate3d(-4px,0,0); }
  }

  /* ---------- channel header ---------- */

  .channel { display: flex; align-items: center; gap: 14px; }

  .avatar {
    position: relative;
    flex: none;
    width: clamp(48px, 8vw, 62px);
    aspect-ratio: 1;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: linear-gradient(145deg, #ff0033, #a8000f);
    box-shadow: 0 8px 24px -8px rgba(255,0,51,.8);
  }
  .avatar svg { width: 46%; height: 46%; }
  .avatar::after {
    content: "";
    position: absolute; inset: -5px;
    border-radius: 50%;
    border: 1px solid rgba(255,0,51,.45);
    animation: halo 2.6s ease-out infinite;
  }
  @keyframes halo {
    0%   { transform: scale(1);    opacity: .8; }
    70%  { transform: scale(1.28); opacity: 0; }
    100% { opacity: 0; }
  }

  .meta { min-width: 0; flex: 1; }
  .meta h1 {
    font-size: clamp(17px, 2.6vw, 22px);
    letter-spacing: -.01em;
    display: flex; align-items: center; gap: 6px;
  }
  .verified { width: 15px; height: 15px; flex: none; color: var(--muted); }
  .handle {
    margin-top: 3px;
    font-size: clamp(12px, 1.9vw, 13.5px);
    color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .sub {
    flex: none;
    padding: 10px 18px;
    border: 0;
    border-radius: 999px;
    font: inherit;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: .01em;
    color: #fff;
    background: var(--red);
    cursor: default;
    transition: background .35s ease, color .35s ease, transform .2s ease;
  }
  .sub.on { background: #2a2a33; color: #d7d7e0; }
  .sub.on .bell { display: inline-block; animation: ring .8s ease; }
  @keyframes ring {
    0%,100% { transform: rotate(0); }
    20% { transform: rotate(16deg); }
    40% { transform: rotate(-13deg); }
    60% { transform: rotate(8deg); }
    80% { transform: rotate(-5deg); }
  }

  /* ---------- odometer ---------- */

  .counter { margin: clamp(20px, 4vw, 34px) 0 clamp(12px, 2vw, 18px); text-align: center; }

  .odo {
    display: flex; align-items: center; justify-content: center;
    gap: 1px;
    -webkit-mask-image: linear-gradient(180deg, transparent, #000 12%, #000 88%, transparent);
            mask-image: linear-gradient(180deg, transparent, #000 12%, #000 88%, transparent);
  }
  .col {
    position: relative;
    height: var(--ch);
    width: calc(var(--ch) * .56);
    overflow: hidden;
    transition: opacity .35s ease, width .35s ease;
  }
  .col.off { opacity: .05; }
  .strip { display: block; will-change: transform; }
  .cell, .comma {
    display: block;
    height: var(--ch);
    line-height: var(--ch);
    text-align: center;
    font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    font-size: calc(var(--ch) * .8);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    letter-spacing: -.03em;
  }
  .comma {
    width: calc(var(--ch) * .26);
    color: var(--red-2);
    transition: opacity .35s ease;
  }
  .comma.off { opacity: .07; }

  .odo.done .cell {
    color: transparent;
    background: linear-gradient(180deg, #fff 35%, #ffb9c6 100%);
    -webkit-background-clip: text; background-clip: text;
    text-shadow: none;
    filter: drop-shadow(0 0 14px rgba(255,0,51,.42));
  }

  .caption {
    margin-top: 6px;
    font-size: clamp(11px, 1.9vw, 13px);
    font-weight: 700;
    letter-spacing: .32em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* ---------- stats ---------- */

  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: clamp(14px, 2.6vw, 22px);
  }
  .stat {
    padding: 11px 12px;
    border: 1px solid var(--line);
    border-radius: 13px;
    background: rgba(255,255,255,.022);
    text-align: center;
  }
  .stat b {
    display: block;
    font-size: clamp(15px, 2.7vw, 19px);
    font-variant-numeric: tabular-nums;
    letter-spacing: -.01em;
  }
  .stat span {
    display: block;
    margin-top: 3px;
    font-size: 10.5px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* ---------- sparkline ---------- */

  .spark { display: block; width: 100%; height: 72px; margin-top: 16px; overflow: visible; }

  /* ---------- progress ---------- */

  .track {
    position: relative;
    height: 8px;
    margin-top: 18px;
    border-radius: 999px;
    background: #21212a;
  }
  .fill {
    height: 100%;
    width: 0;
    border-radius: 999px;
    background: linear-gradient(90deg, #ff0033, #ff6a3d);
    box-shadow: 0 0 18px rgba(255,0,51,.6);
  }
  .goal {
    position: absolute; top: -4px; left: 90%;
    width: 2px; height: 16px;
    background: rgba(255,255,255,.35);
  }
  .scale {
    display: flex; justify-content: space-between;
    margin-top: 7px;
    font-size: 10.5px; letter-spacing: .08em;
    color: var(--muted);
  }

  /* ---------- awards ---------- */

  .awards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 16px;
  }
  .award {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 13px;
    background: rgba(255,255,255,.02);
    opacity: .32;
    filter: grayscale(1);
    transform: scale(.985);
    transition: opacity .5s ease, filter .5s ease, transform .5s cubic-bezier(.2,1.5,.4,1), border-color .5s ease;
  }
  .award.on { opacity: 1; filter: none; transform: scale(1); }
  .award.on.silver  { border-color: rgba(219,226,238,.4); }
  .award.on.gold    { border-color: rgba(255,204,77,.45); }
  .award.on.pop     { animation: pop .55s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.09); } 100% { transform: scale(1); } }

  .plaque {
    flex: none;
    width: 34px; height: 34px;
    display: grid; place-items: center;
    border-radius: 9px;
    background: linear-gradient(150deg, #3a3a45, #23232b);
  }
  .plaque svg { width: 15px; height: 15px; }
  .silver  .plaque { background: linear-gradient(150deg, #f2f6fc, #98a3b6); }
  .gold    .plaque { background: linear-gradient(150deg, #ffe08a, #d99a17); }
  .diamond .plaque { background: linear-gradient(150deg, #cdf4ff, #4fb6db); }
  .plaque svg path { fill: #16161c; }

  .award b { display: block; font-size: 12.5px; }
  .award span { display: block; margin-top: 2px; font-size: 10.5px; color: var(--muted); }

  /* ---------- toast ---------- */

  .toast {
    position: fixed;
    left: 50%; top: 7%;
    z-index: 8;
    display: flex; align-items: center; gap: 11px;
    padding: 13px 20px;
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 999px;
    background: rgba(20,20,26,.92);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    box-shadow: 0 24px 60px -18px rgba(0,0,0,.9);
    max-width: calc(100vw - 28px);
    opacity: 0;
    transform: translate(-50%, -18px) scale(.94);
    pointer-events: none;
  }
  .toast.show { animation: toast 2.15s cubic-bezier(.2,1.3,.4,1) forwards; }
  @keyframes toast {
    0%   { opacity: 0; transform: translate(-50%,-18px) scale(.94); }
    12%  { opacity: 1; transform: translate(-50%,0) scale(1); }
    82%  { opacity: 1; transform: translate(-50%,0) scale(1); }
    100% { opacity: 0; transform: translate(-50%,-12px) scale(.97); }
  }
  .toast .icon { flex: none; font-size: 19px; }
  .toast .tx { min-width: 0; }
  .toast .tx b { display: block; font-size: 14px; }
  .toast .tx span { display: block; margin-top: 2px; font-size: 12px; color: var(--muted); }

  /* ---------- replay ---------- */

  .replay {
    position: relative; z-index: 6;
    display: flex; align-items: center; gap: 8px;
    margin: 18px auto 0;
    padding: 11px 20px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: rgba(255,255,255,.04);
    color: var(--text);
    font: inherit; font-size: 13.5px; font-weight: 600;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity .5s ease, background .2s ease, transform .2s ease;
  }
  .replay.show { opacity: 1; pointer-events: auto; }
  .replay:hover { background: rgba(255,255,255,.09); transform: translateY(-1px); }
  .replay:active { transform: translateY(0); }
  .replay svg { width: 15px; height: 15px; fill: currentColor; }

  .hint {
    margin-top: 10px;
    text-align: center;
    font-size: 11px;
    letter-spacing: .06em;
    color: #5f5f6d;
  }

  @media (min-width: 620px) { :root { --ch: 78px; } }

  @media (max-width: 520px) {
    :root { --ch: 46px; }
    .stats, .awards { grid-template-columns: 1fr 1fr; }
    .awards .diamond { grid-column: span 2; }
    .sub { padding: 9px 14px; font-size: 13px; }
  }
  @media (max-width: 360px) { :root { --ch: 38px; } }

  @media (prefers-reduced-motion: reduce) {
    .avatar::after { animation: none; }
    .card.shake { animation: none; }
  }
</style>
</head>
<body>

<canvas id="fx"></canvas>

<main>
  <section class="card" id="card">

    <header class="channel">
      <div class="avatar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M8 5.5v13l11-6.5z"/></svg>
      </div>
      <div class="meta">
        <h1>
          <span id="channelName">Pixel Forge</span>
          <svg class="verified" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M12 2l2.4 1.8 3-.2.9 2.9 2.5 1.7-1.1 2.8 1.1 2.8-2.5 1.7-.9 2.9-3-.2L12 22l-2.4-1.8-3 .2-.9-2.9-2.5-1.7L4.3 13 3.2 10.2l2.5-1.7.9-2.9 3 .2z"/>
            <path fill="#131317" d="M10.8 15.4l-3-3 1.3-1.3 1.7 1.7 4.1-4.1 1.3 1.3z"/>
          </svg>
        </h1>
        <p class="handle">@pixelforge &middot; 1.2K videos &middot; joined 2019</p>
      </div>
      <button class="sub" id="subBtn" type="button" aria-live="polite">Subscribe</button>
    </header>

    <div class="counter">
      <div class="odo" id="odo" role="img" aria-label="Subscriber counter"></div>
      <p class="caption">subscribers</p>
    </div>

    <div class="stats">
      <div class="stat"><b id="compact">0</b><span>total</span></div>
      <div class="stat"><b id="rate">+0</b><span>per second</span></div>
      <div class="stat"><b id="watching">0</b><span>watching now</span></div>
    </div>

    <svg class="spark" id="spark" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="grad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#ff0033" stop-opacity=".5"/>
          <stop offset="100%" stop-color="#ff0033" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <path id="area" fill="url(#grad)"></path>
      <path id="line" fill="none" stroke="#ff3b5c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
      <circle id="head" r="3.5" fill="#fff" opacity="0"></circle>
    </svg>

    <div class="track">
      <div class="fill" id="fill"></div>
      <div class="goal"></div>
    </div>
    <div class="scale"><span>0</span><span>5M</span><span id="goalLabel">9M GOAL</span><span>10M</span></div>

    <div class="awards">
      <div class="award silver" id="awSilver">
        <div class="plaque"><svg viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg></div>
        <div><b>Silver</b><span>100K subscribers</span></div>
      </div>
      <div class="award gold" id="awGold">
        <div class="plaque"><svg viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg></div>
        <div><b>Gold</b><span>1M subscribers</span></div>
      </div>
      <div class="award diamond" id="awDiamond">
        <div class="plaque"><svg viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg></div>
        <div><b>Diamond</b><span id="awDiamondNote">10M subscribers</span></div>
      </div>
    </div>

  </section>

  <button class="replay" id="replay" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V1L7 6l5 5V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
    Replay
  </button>
  <p class="hint">press space or click to replay</p>
</main>

<div class="toast" id="toast">
  <span class="icon" id="toastIcon">🎉</span>
  <div class="tx"><b id="toastTitle"></b><span id="toastSub"></span></div>
</div>

<script>
(function () {
  "use strict";

  var params  = new URLSearchParams(location.search);
  var TARGET  = Math.max(10, Math.min(999999999, parseInt(params.get("target"), 10) || 9000000));
  var NAME    = params.get("name");
  var RUNTIME = Math.max(3000, Math.min(60000, parseInt(params.get("ms"), 10) || 12000));
  var HOLD    = 900;
  var CALM    = matchMedia("(prefers-reduced-motion: reduce)").matches;

  if (NAME) { document.getElementById("channelName").textContent = NAME; }

  /* ------------------------------------------------------------------ *
   * growth curve: a slow grind, then a viral S-curve that settles
   * ------------------------------------------------------------------ */

  var GRIND_T = 0.22;                          // share of runtime spent grinding
  var GRIND_V = Math.min(5000, TARGET * 0.05); // subs earned during the grind
  var K = 9, MID = 0.42;
  function logistic(x) { return 1 / (1 + Math.exp(-K * (x - MID))); }
  var L0 = logistic(0), L1 = logistic(1);

  function curve(t) {
    if (t <= 0) return 0;
    if (t >= 1) return TARGET;
    if (t < GRIND_T) {
      var u = t / GRIND_T;
      return GRIND_V * (u * u * 0.62 + u * 0.38);
    }
    var v = (t - GRIND_T) / (1 - GRIND_T);
    var f = (logistic(v) - L0) / (L1 - L0);
    return GRIND_V + (TARGET - GRIND_V) * f;
  }

  /* ------------------------------------------------------------------ *
   * odometer
   * ------------------------------------------------------------------ */

  var odo    = document.getElementById("odo");
  var PLACES = String(TARGET).length;
  var cols   = [];
  var commas = [];
  var cellH  = 62;

  (function buildOdometer() {
    for (var p = PLACES - 1; p >= 0; p--) {
      var col = document.createElement("span");
      col.className = "col off";

      var strip = document.createElement("span");
      strip.className = "strip";
      for (var d = 0; d <= 10; d++) {          // 0-9 plus a wrap-around 0
        var cell = document.createElement("span");
        cell.className = "cell";
        cell.textContent = d % 10;
        strip.appendChild(cell);
      }
      col.appendChild(strip);
      odo.appendChild(col);
      cols.push({ p: p, el: col, strip: strip, blur: -1 });

      if (p % 3 === 0 && p > 0) {
        var comma = document.createElement("span");
        comma.className = "comma off";
        comma.textContent = ",";
        odo.appendChild(comma);
        commas.push({ p: p, el: comma });
      }
    }
  })();

  function measure() {
    var probe = odo.querySelector(".cell");
    if (probe) { cellH = probe.getBoundingClientRect().height || cellH; }
  }

  function renderOdometer(value, speed) {
    var top = value < 1 ? 0 : Math.floor(Math.log10(value));
    for (var i = 0; i < cols.length; i++) {
      var c = cols[i];
      var div = Math.pow(10, c.p);
      var y = (value / div) % 10;              // continuous — a real odometer roll
      c.strip.style.transform = "translate3d(0," + (-y * cellH).toFixed(2) + "px,0)";
      c.el.classList.toggle("off", c.p > top);

      if (!CALM) {
        // motion blur proportional to how fast this column is spinning
        var px = c.p > top ? 0 : Math.min(7, (speed / div) * cellH / 190);
        px = px < 0.35 ? 0 : px;
        if (Math.abs(px - c.blur) > 0.3) {
          c.strip.style.filter = px ? "blur(" + px.toFixed(1) + "px)" : "";
          c.blur = px;
        }
      }
    }
    for (var j = 0; j < commas.length; j++) {
      commas[j].el.classList.toggle("off", commas[j].p >= top + 1);
    }
  }

  /* ------------------------------------------------------------------ *
   * formatting
   * ------------------------------------------------------------------ */

  function compact(n) {
    if (n >= 1e9) return (n / 1e9).toFixed(2) + "B";
    if (n >= 1e6) return (n / 1e6).toFixed(2) + "M";
    if (n >= 1e3) return (n / 1e3).toFixed(1) + "K";
    return String(Math.floor(n));
  }
  function group(n) { return Math.round(n).toLocaleString("en-US"); }

  /* ------------------------------------------------------------------ *
   * confetti
   * ------------------------------------------------------------------ */

  var canvas = document.getElementById("fx");
  var ctx    = canvas.getContext("2d");
  var bits   = [];
  var PALETTE = ["#ff0033", "#ff6a3d", "#ffcc4d", "#ffffff", "#8fe6ff", "#dbe2ee"];

  function sizeCanvas() {
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width  = Math.floor(innerWidth  * dpr);
    canvas.height = Math.floor(innerHeight * dpr);
    canvas.style.width  = innerWidth + "px";
    canvas.style.height = innerHeight + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function burst(x, y, count, power) {
    if (CALM) return;
    for (var i = 0; i < count; i++) {
      var a = Math.random() * Math.PI * 2;
      var s = (0.35 + Math.random()) * power;
      bits.push({
        x: x, y: y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s - power * 0.55,
        w: 4 + Math.random() * 6,
        h: 7 + Math.random() * 9,
        rot: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 0.4,
        color: PALETTE[(Math.random() * PALETTE.length) | 0],
        life: 1
      });
    }
    if (bits.length > 900) { bits.splice(0, bits.length - 900); }
  }

  function drawConfetti(dt) {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (var i = bits.length - 1; i >= 0; i--) {
      var b = bits[i];
      b.vy += 0.032 * dt;
      b.vx *= 0.995;
      b.x  += b.vx * dt;
      b.y  += b.vy * dt;
      b.rot += b.vr * dt * 0.1;
      b.life -= 0.0045 * dt;
      if (b.life <= 0 || b.y > innerHeight + 40) { bits.splice(i, 1); continue; }
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, b.life));
      ctx.translate(b.x, b.y);
      ctx.rotate(b.rot);
      ctx.fillStyle = b.color;
      ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h * (0.4 + 0.6 * Math.abs(Math.cos(b.rot))));
      ctx.restore();
    }
  }

  /* ------------------------------------------------------------------ *
   * milestones
   * ------------------------------------------------------------------ */

  var card    = document.getElementById("card");
  var toast   = document.getElementById("toast");
  var tIcon   = document.getElementById("toastIcon");
  var tTitle  = document.getElementById("toastTitle");
  var tSub    = document.getElementById("toastSub");
  var awSilver  = document.getElementById("awSilver");
  var awGold    = document.getElementById("awGold");
  var awDiamond = document.getElementById("awDiamond");

  var MILESTONES = [
    { v: 1e3, icon: "🌱", title: "1,000 subscribers", sub: "the algorithm noticed you",   power: 5,  n: 26 },
    { v: 1e4, icon: "🔥", title: "10,000 subscribers", sub: "a video is taking off",      power: 6,  n: 40 },
    { v: 1e5, icon: "🥈", title: "Silver Play Button", sub: "100,000 subscribers",        power: 8,  n: 90,  award: awSilver },
    { v: 1e6, icon: "🥇", title: "Gold Play Button",   sub: "1,000,000 subscribers",      power: 10, n: 150, award: awGold },
    { v: 5e6, icon: "🚀", title: "5,000,000 subscribers", sub: "top 0.01% of all channels", power: 11, n: 190 },
    { v: 1e7, icon: "💎", title: "Diamond Play Button", sub: "10,000,000 subscribers",    power: 13, n: 260, award: awDiamond }
  ].filter(function (m) { return m.v <= TARGET; });

  var fired = [];

  function showToast(m) {
    tIcon.textContent  = m.icon;
    tTitle.textContent = m.title;
    tSub.textContent   = m.sub;
    toast.classList.remove("show");
    void toast.offsetWidth;
    toast.classList.add("show");
  }

  function hit(m) {
    showToast(m);
    var r = card.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height * 0.42, m.n, m.power);
    if (m.award) {
      m.award.classList.add("on", "pop");
      setTimeout(function () { m.award.classList.remove("pop"); }, 600);
    }
    if (!CALM) {
      card.classList.remove("shake");
      void card.offsetWidth;
      card.classList.add("shake");
    }
  }

  /* ------------------------------------------------------------------ *
   * sparkline
   * ------------------------------------------------------------------ */

  var spark   = document.getElementById("spark");
  var areaEl  = document.getElementById("area");
  var lineEl  = document.getElementById("line");
  var headEl  = document.getElementById("head");
  var samples = [];
  var sparkW  = 320, sparkH = 72, PAD = 5;

  function sizeSpark() {
    sparkW = spark.clientWidth || 320;
    sparkH = spark.clientHeight || 72;
    spark.setAttribute("viewBox", "0 0 " + sparkW + " " + sparkH);
  }

  function drawSpark(progress) {
    if (samples.length < 2) { areaEl.setAttribute("d", ""); lineEl.setAttribute("d", ""); return; }
    var d = "", x = 0, y = 0;
    for (var i = 0; i < samples.length; i++) {
      x = PAD + (sparkW - PAD * 2) * (samples[i].t);
      y = (sparkH - PAD) - (sparkH - PAD * 2) * (samples[i].v / TARGET);
      d += (i ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1);
    }
    lineEl.setAttribute("d", d);
    areaEl.setAttribute("d", d + "L" + x.toFixed(1) + " " + sparkH + "L" + PAD + " " + sparkH + "Z");
    headEl.setAttribute("cx", x.toFixed(1));
    headEl.setAttribute("cy", y.toFixed(1));
    headEl.setAttribute("opacity", progress > 0.01 ? "1" : "0");
  }

  /* ------------------------------------------------------------------ *
   * run loop
   * ------------------------------------------------------------------ */

  var compactEl  = document.getElementById("compact");
  var rateEl     = document.getElementById("rate");
  var watchEl    = document.getElementById("watching");
  var fillEl     = document.getElementById("fill");
  var subBtn     = document.getElementById("subBtn");
  var replayBtn  = document.getElementById("replay");
  var goalLabel  = document.getElementById("goalLabel");
  var diamondNote = document.getElementById("awDiamondNote");

  var SCALE_MAX = Math.max(TARGET / 0.9, TARGET);   // goal sits at 90% of the bar
  goalLabel.textContent = compact(TARGET) + " GOAL";
  if (TARGET < 1e7) { diamondNote.textContent = compact(1e7 - TARGET) + " to go"; }

  var start = 0, last = 0, lastVal = 0, smoothRate = 0, nextSample = 0;
  var running = false, finished = false, raf = 0;

  function reset() {
    cancelAnimationFrame(raf);
    fired = MILESTONES.map(function () { return false; });
    samples.length = 0;
    bits.length = 0;
    start = 0; last = 0; lastVal = 0; smoothRate = 0; nextSample = 0;
    finished = false; running = true;
    for (var c = 0; c < cols.length; c++) { cols[c].blur = -1; }

    card.classList.remove("done");
    odo.classList.remove("done");
    subBtn.classList.remove("on");
    subBtn.textContent = "Subscribe";
    replayBtn.classList.remove("show");
    awSilver.classList.remove("on");
    awGold.classList.remove("on");
    awDiamond.classList.remove("on");
    toast.classList.remove("show");
    ctx.clearRect(0, 0, innerWidth, innerHeight);

    measure(); sizeSpark();
    renderOdometer(0, 0);
    drawSpark(0);
    compactEl.textContent = "0";
    rateEl.textContent = "+0";
    watchEl.textContent = "0";
    fillEl.style.width = "0%";

    raf = requestAnimationFrame(frame);
  }

  function finish() {
    finished = true; running = false;
    for (var c = 0; c < cols.length; c++) { cols[c].blur = -1; }
    lastVal = TARGET;
    renderOdometer(TARGET, 0);                 // crisp, unblurred final read-out
    odo.classList.add("done");
    card.classList.add("done");
    replayBtn.classList.add("show");
    rateEl.textContent = "+0";

    var r = card.getBoundingClientRect();
    for (var i = 0; i < 5; i++) {
      (function (i) {
        setTimeout(function () {
          burst(r.left + r.width * (0.14 + 0.18 * i), r.top + r.height * 0.3, 70, 12);
        }, i * 130);
      })(i);
    }
    showToast({
      icon: "🏆",
      title: group(TARGET) + " subscribers",
      sub: "from zero — thanks for watching"
    });
    raf = requestAnimationFrame(frame);
  }

  function frame(now) {
    if (!start) { start = now; last = now; }
    var dt = Math.min(64, now - last);
    last = now;

    if (running) {
      var elapsed = now - start;
      var t = Math.min(1, elapsed / RUNTIME);
      var v = curve(t);

      var inst = dt > 0 ? (v - lastVal) * 1000 / dt : 0;
      smoothRate += (inst - smoothRate) * 0.12;
      lastVal = v;

      renderOdometer(v, Math.max(0, inst));
      compactEl.textContent = compact(v);
      rateEl.textContent = "+" + compact(Math.max(0, smoothRate));
      watchEl.textContent = compact(Math.max(0, v * 0.0023 * (0.9 + Math.random() * 0.2)));
      fillEl.style.width = (100 * Math.min(1, v / SCALE_MAX)).toFixed(2) + "%";

      if (v > 15 && !subBtn.classList.contains("on")) {
        subBtn.classList.add("on");
        subBtn.innerHTML = 'Subscribed <span class="bell">🔔</span>';
      }

      for (var i = 0; i < MILESTONES.length; i++) {
        if (!fired[i] && v >= MILESTONES[i].v) { fired[i] = true; hit(MILESTONES[i]); }
      }

      if (elapsed >= nextSample || t === 1) {
        nextSample = elapsed + 45;
        samples.push({ t: t, v: v });
      }
      drawSpark(t);

      if (t >= 1) { setTimeout(finish, HOLD); running = false; }
    }

    if (!CALM) { drawConfetti(dt / 16.6667); }

    if (running || bits.length > 0 || !finished) { raf = requestAnimationFrame(frame); }
    else { raf = 0; }
  }

  /* ------------------------------------------------------------------ *
   * wiring
   * ------------------------------------------------------------------ */

  function replay() { if (!running) { reset(); } }

  replayBtn.addEventListener("click", function (e) { e.stopPropagation(); replay(); });
  document.addEventListener("click", replay);
  document.addEventListener("keydown", function (e) {
    if (e.code === "Space" || e.key === " " || e.key === "Enter") { e.preventDefault(); replay(); }
  });

  addEventListener("resize", function () {
    sizeCanvas(); measure(); sizeSpark();
    renderOdometer(lastVal, 0);
    drawSpark(lastVal / TARGET);
  });

  sizeCanvas();
  reset();
})();
</script>
</body>
</html>
