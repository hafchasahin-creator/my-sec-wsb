<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Desert Derby — Cowboy Bull Race</title>
<style>
  :root { color-scheme: dark; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#120a08; }
  body {
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    -webkit-user-select:none; user-select:none; touch-action:none;
  }
  #stage { position:fixed; inset:0; display:block; }

  .hud { position:fixed; pointer-events:none; color:#ffe9c9; text-shadow:0 2px 6px rgba(60,20,0,.75); }

  #title { top:clamp(14px,3vh,34px); left:clamp(16px,3vw,40px); }
  #title h1 {
    font-size:clamp(19px,3.4vw,40px); letter-spacing:.22em; font-weight:700;
    text-transform:uppercase; line-height:1;
  }
  #title p {
    margin-top:.5em; font-size:clamp(9px,1.15vw,13px); letter-spacing:.34em;
    text-transform:uppercase; opacity:.72;
  }

  #gauge { top:clamp(14px,3vh,34px); right:clamp(16px,3vw,40px); text-align:right; }
  #gauge .num { font-size:clamp(26px,5vw,58px); line-height:.9; font-variant-numeric:tabular-nums; }
  #gauge .unit { font-size:clamp(9px,1.1vw,12px); letter-spacing:.3em; text-transform:uppercase; opacity:.72; }
  #gauge .bar {
    margin-top:.7em; margin-left:auto; width:clamp(90px,15vw,170px); height:6px;
    border:1px solid rgba(255,225,190,.45); border-radius:3px; overflow:hidden;
  }
  #gauge .bar i { display:block; height:100%; width:0%; background:#ffcf7a; transition:width .12s linear; }

  #keys {
    left:50%; transform:translateX(-50%); bottom:clamp(12px,2.6vh,28px);
    display:flex; gap:clamp(10px,2.4vw,26px); font-size:clamp(9px,1.1vw,12px);
    letter-spacing:.18em; text-transform:uppercase; opacity:.62; white-space:nowrap;
  }
  #keys b { font-weight:700; opacity:.95; }
  #keys.fade { opacity:0; transition:opacity 1.2s ease; }

  #paused {
    position:fixed; inset:0; display:none; place-items:center; pointer-events:none;
    font-size:clamp(22px,5vw,54px); letter-spacing:.35em; text-transform:uppercase;
    color:#ffe9c9; text-shadow:0 3px 14px rgba(0,0,0,.7); background:rgba(20,8,4,.34);
  }
  #paused.on { display:grid; }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div class="hud" id="title">
  <h1>Desert Derby</h1>
  <p>Longhorn Class &middot; Mile 12</p>
</div>

<div class="hud" id="gauge">
  <div class="num" id="mph">00</div>
  <div class="unit">mph</div>
  <div class="bar"><i id="boostbar"></i></div>
</div>

<div class="hud" id="keys">
  <span><b>Space / Click</b> spur on</span>
  <span><b>D</b> time of day</span>
  <span><b>P</b> pause</span>
</div>

<div id="paused">Reined In</div>

<script>
(() => {
"use strict";

/* ------------------------------------------------------------------ *
 *  Canvas setup
 * ------------------------------------------------------------------ */
const cv  = document.getElementById("stage");
const ctx = cv.getContext("2d", { alpha:false });
let W = 0, H = 0, DPR = 1, HZ = 0;   // HZ = horizon y
let UNIT = 800;                      // reference size: height, but capped by width
                                     // so a tall phone doesn't get a giant bull

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width  = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  cv.style.width = W + "px"; cv.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  HZ = Math.round(H * 0.60);
  UNIT = Math.min(H, W * 1.35);
  buildGrain();
  buildVignette();
  bgDirty = true;
}
let bgDirty = true;
window.addEventListener("resize", resize);

/* ------------------------------------------------------------------ *
 *  Small helpers
 * ------------------------------------------------------------------ */
const TAU = Math.PI * 2;
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const lerp  = (a,b,t) => a + (b - a) * t;
const ease  = t => t*t*(3 - 2*t);

// deterministic hash-random so scenery never flickers as it scrolls
function rnd(i, salt) {
  let x = Math.imul(i ^ 0x9e3779b9, 0x85ebca6b) ^ Math.imul(salt|0, 0xc2b2ae35);
  x ^= x >>> 15; x = Math.imul(x, 0x2545f491); x ^= x >>> 13;
  return ((x >>> 0) % 100000) / 100000;
}

const hex2rgb = h => {
  if (h.length === 4) h = "#" + h[1] + h[1] + h[2] + h[2] + h[3] + h[3];   // #abc → #aabbcc
  return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
};
const rgb2hex = c => "#" + c.map(v => clamp(Math.round(v),0,255).toString(16).padStart(2,"0")).join("");
const mixHex  = (a,b,t) => { const A = hex2rgb(a), B = hex2rgb(b); return rgb2hex([0,1,2].map(i => lerp(A[i],B[i],t))); };
const rgba    = (h,a) => { const c = hex2rgb(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; };

/* ------------------------------------------------------------------ *
 *  Palettes — three times of day, cross-faded
 * ------------------------------------------------------------------ */
const PALETTES = [
  { // 0 — golden hour
    name:"golden",
    skyTop:"#1d2f66", skyMid:"#c1633f", skyLow:"#f2a35a", sunCore:"#fff2c4", sunGlow:"#ff9b45",
    ridgeFar:"#6a5580", mesaFar:"#8a5765", mesaMid:"#7b4552", mesaLit:"#c07a5e",
    groundFar:"#d79a5c", groundMid:"#b9763f", groundNear:"#8d5028",
    dust:"#f5cf98", haze:"#f0a860", rim:"#ffd9a0", fg:"#3a1d13",
    wash:"#ff9540", washA:0.10, star:0.0
  },
  { // 1 — high noon
    name:"noon",
    skyTop:"#1f6fb8", skyMid:"#7cbde3", skyLow:"#d9e7ea", sunCore:"#ffffff", sunGlow:"#fff4cd",
    ridgeFar:"#8fa2b5", mesaFar:"#b98d78", mesaMid:"#a97057", mesaLit:"#e0ab7e",
    groundFar:"#e9c48c", groundMid:"#d7a463", groundNear:"#b9813f",
    dust:"#fff0d2", haze:"#eadfc6", rim:"#ffffff", fg:"#5a3a20",
    wash:"#fff0c8", washA:0.06, star:0.0
  },
  { // 2 — dusk
    name:"dusk",
    skyTop:"#0a0c2b", skyMid:"#3b1f56", skyLow:"#8c2f4a", sunCore:"#ffcf8a", sunGlow:"#e0523c",
    ridgeFar:"#2b2547", mesaFar:"#3a2340", mesaMid:"#2b1830", mesaLit:"#6d3a45",
    groundFar:"#6b3f3f", groundMid:"#4e2c30", groundNear:"#2d181d",
    dust:"#c79a86", haze:"#8e3f4a", rim:"#ffb478", fg:"#150a10",
    wash:"#3a2a6e", washA:0.16, star:1.0
  }
];
const PAL = {};                              // live, interpolated palette
let palFrom = Object.assign({}, PALETTES[0]);// snapshot we are fading out of
let palB = 0, palT = 1;                      // target index, progress

function updatePalette(dt) {
  palT = Math.min(1, palT + dt * 1.1);
  const A = palFrom, B = PALETTES[palB], t = ease(palT);
  for (const k in B) {
    if (typeof B[k] === "string" && B[k][0] === "#") PAL[k] = mixHex(A[k], B[k], t);
    else if (typeof B[k] === "number")               PAL[k] = lerp(A[k], B[k], t);
    else                                             PAL[k] = t < .5 ? A[k] : B[k];
  }
}
// fade out of whatever is on screen right now, so rapid presses still look smooth
function cycleDay() {
  palFrom = Object.assign({}, PAL);
  palB = (palB + 1) % PALETTES.length;
  palT = 0;
}

/* ------------------------------------------------------------------ *
 *  Input / state
 * ------------------------------------------------------------------ */
const S = {
  t: 0,            // seconds
  dist: 0,         // world scroll
  speed: 1,        // smoothed speed multiplier
  boostHeld: false,
  boost: 0,        // 0..1 how much boost energy is engaged
  stamina: 1,      // 0..1
  phase: 0,        // gallop cycle phase 0..1
  paused: false
};

const keysEl = document.getElementById("keys");
let hudTimer = 0;

function setBoost(v) { S.boostHeld = v; hudTimer = 0; keysEl.classList.remove("fade"); }

addEventListener("keydown", e => {
  if (e.code === "Space") { e.preventDefault(); setBoost(true); }
  else if (e.key === "d" || e.key === "D") cycleDay();
  else if (e.key === "p" || e.key === "P") togglePause();
});
addEventListener("keyup", e => { if (e.code === "Space") setBoost(false); });
addEventListener("pointerdown", e => { if (e.button === 0) setBoost(true); });
addEventListener("pointerup",   () => setBoost(false));
addEventListener("pointercancel", () => setBoost(false));
addEventListener("blur", () => setBoost(false));

const pausedEl = document.getElementById("paused");
function togglePause() { S.paused = !S.paused; pausedEl.classList.toggle("on", S.paused); }

/* ------------------------------------------------------------------ *
 *  Film grain tile
 * ------------------------------------------------------------------ */
let vigCv = null;
function buildVignette() {
  vigCv = document.createElement("canvas");
  vigCv.width = Math.max(1, Math.round(W / 2));
  vigCv.height = Math.max(1, Math.round(H / 2));
  const q = vigCv.getContext("2d");
  const w = vigCv.width, h = vigCv.height, r = Math.hypot(w, h) * 0.62;
  const g = q.createRadialGradient(w * 0.5, h * 0.52, r * 0.35, w * 0.5, h * 0.52, r);
  g.addColorStop(0, "rgba(0,0,0,0)");
  g.addColorStop(1, "rgba(30,8,0,0.62)");
  q.fillStyle = g;
  q.fillRect(0, 0, w, h);
}

let grainPat = null;
function buildGrain() {
  const n = 128, g = document.createElement("canvas");
  g.width = g.height = n;
  const gx = g.getContext("2d"), img = gx.createImageData(n, n);
  for (let i = 0; i < n*n; i++) {
    const v = 120 + Math.random() * 135;
    img.data[i*4] = img.data[i*4+1] = img.data[i*4+2] = v;
    img.data[i*4+3] = 255;
  }
  gx.putImageData(img, 0, 0);
  grainPat = ctx.createPattern(g, "repeat");
}

/* ------------------------------------------------------------------ *
 *  Ground perspective:  v = 0 at horizon, 1 at bottom of screen
 * ------------------------------------------------------------------ */
const groundY = v => HZ + (H - HZ) * Math.pow(v, 1.85);
const depthScale = v => Math.pow(v, 1.35);
const layerSpeed = v => 0.06 + Math.pow(v, 1.7) * 2.6;

/* ================================================================== *
 *  SKY
 * ================================================================== */
const SUN_X = () => W * 0.74;
const SUN_Y = () => HZ - H * 0.20;

/* The sky gradient, the sun, the ground wash and the light pool never change
   between frames unless the palette is mid-fade — so they are painted once
   into an offscreen canvas and blitted. */
const bgCv = document.createElement("canvas");
const bgCtx = bgCv.getContext("2d");

function buildBackdrop() {
  if (bgCv.width !== cv.width || bgCv.height !== cv.height) {
    bgCv.width = cv.width; bgCv.height = cv.height;
  }
  const q = bgCtx;
  q.setTransform(DPR, 0, 0, DPR, 0, 0);
  q.clearRect(0, 0, W, H);

  const g = q.createLinearGradient(0, 0, 0, HZ + 4);
  g.addColorStop(0,    PAL.skyTop);
  g.addColorStop(0.52, PAL.skyMid);
  g.addColorStop(1,    PAL.skyLow);
  q.fillStyle = g;
  q.fillRect(0, 0, W, HZ + 4);

  const sx = SUN_X(), sy = SUN_Y(), r = Math.min(W, H) * 0.085;
  const glow = q.createRadialGradient(sx, sy, r * 0.35, sx, sy, r * 7);
  glow.addColorStop(0,    rgba(PAL.sunGlow, 0.55));
  glow.addColorStop(0.28, rgba(PAL.sunGlow, 0.20));
  glow.addColorStop(1,    rgba(PAL.sunGlow, 0));
  q.fillStyle = glow;
  q.fillRect(0, 0, W, HZ + 40);

  const core = q.createRadialGradient(sx, sy, 0, sx, sy, r);
  core.addColorStop(0,    PAL.sunCore);
  core.addColorStop(0.72, mixHex(PAL.sunCore, PAL.sunGlow, 0.6));
  core.addColorStop(1,    rgba(PAL.sunGlow, 0.15));
  q.fillStyle = core;
  q.beginPath(); q.arc(sx, sy, r, 0, TAU); q.fill();

  const gg = q.createLinearGradient(0, HZ, 0, H);
  gg.addColorStop(0,    PAL.groundFar);
  gg.addColorStop(0.22, PAL.groundMid);
  gg.addColorStop(1,    PAL.groundNear);
  q.fillStyle = gg;
  q.fillRect(0, HZ, W, H - HZ);

  const sg = q.createRadialGradient(sx, HZ, 0, sx, HZ, W * 0.55);
  sg.addColorStop(0, rgba(PAL.sunGlow, 0.28));
  sg.addColorStop(1, rgba(PAL.sunGlow, 0));
  q.fillStyle = sg;
  q.fillRect(0, HZ, W, H - HZ);
}

function drawSky() {
  ctx.drawImage(bgCv, 0, 0, W, H);

  // stars (dusk only)
  if (PAL.star > 0.02) {
    ctx.save();
    for (let i = 0; i < 90; i++) {
      const x = rnd(i, 7) * W, y = rnd(i, 8) * HZ * 0.72;
      const tw = 0.35 + 0.65 * Math.abs(Math.sin(S.t * (0.6 + rnd(i,9)) + i));
      ctx.globalAlpha = PAL.star * tw * (1 - y / (HZ * 0.9)) * 0.9;
      ctx.fillStyle = "#fff6dc";
      ctx.fillRect(x, y, 1.6, 1.6);
    }
    ctx.restore();
  }

  // thin banded clouds
  ctx.save();
  for (let i = 0; i < 9; i++) {
    const y  = HZ * (0.12 + rnd(i, 21) * 0.62);
    const w  = W * (0.16 + rnd(i, 22) * 0.34);
    const h  = 3 + rnd(i, 23) * 9;
    const sp = 6 + rnd(i, 24) * 14;
    let x = (rnd(i, 25) * (W + 600) - S.dist * 0.012 * sp) % (W + 600) - 300;
    if (x < -300) x += W + 600;
    const lit = 1 - y / HZ;
    ctx.globalAlpha = 0.16 + lit * 0.30;
    ctx.fillStyle = mixHex(PAL.skyLow, PAL.sunCore, 0.30 + lit * 0.4);
    ctx.beginPath();
    ctx.ellipse(x, y, w * 0.5, h, 0, 0, TAU);
    ctx.fill();
    ctx.globalAlpha *= 0.5;
    ctx.beginPath();
    ctx.ellipse(x + w * 0.16, y - h * 0.7, w * 0.26, h * 0.6, 0, 0, TAU);
    ctx.fill();
  }
  ctx.restore();

  drawVultures();
}

function drawVultures() {
  ctx.save();
  ctx.strokeStyle = rgba(PAL.fg, 0.55);
  ctx.lineCap = "round";
  for (let i = 0; i < 3; i++) {
    const rx = W * (0.16 + i * 0.06), ry = H * (0.035 + i * 0.012);
    const cx = W * (0.18 + i * 0.16), cy = HZ * (0.22 + i * 0.10);
    const a  = S.t * (0.16 + i * 0.05) + i * 2.2;
    const x = cx + Math.cos(a) * rx, y = cy + Math.sin(a) * ry;
    const sc = 1 + Math.sin(a) * 0.18;
    const flap = Math.sin(S.t * (1.5 + i * 0.4) + i) * 0.42;
    const s = (5 + i * 1.6) * sc;
    ctx.lineWidth = 1.6 * sc;
    ctx.beginPath();
    ctx.moveTo(x - s * 2, y + s * flap);
    ctx.quadraticCurveTo(x - s, y - s * 0.55, x, y);
    ctx.quadraticCurveTo(x + s, y - s * 0.55, x + s * 2, y + s * flap);
    ctx.stroke();
  }
  ctx.restore();
}

/* ================================================================== *
 *  DISTANT LAND
 * ================================================================== */
function drawFarRidge() {
  const scroll = S.dist * 0.020;
  const base = HZ + 2, amp = UNIT * 0.085;
  ctx.fillStyle = PAL.ridgeFar;
  ctx.beginPath();
  ctx.moveTo(-4, base);
  for (let x = -4; x <= W + 4; x += 8) {
    const u = (x + scroll) * 0.0016;
    const y = base - (
      Math.sin(u) * 0.5 + Math.sin(u * 2.3 + 1.7) * 0.28 +
      Math.sin(u * 5.1 + 0.4) * 0.14 + Math.sin(u * 9.4) * 0.07 + 0.55
    ) * amp;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W + 4, base); ctx.closePath(); ctx.fill();
}

// A mesa / butte silhouette in local coords: base at (0,0), grows upward.
function mesaPath(w, h, seed) {
  const p = new Path2D();
  const notch = 0.10 + rnd(seed, 41) * 0.22;   // shoulder step
  const topW  = w * (0.42 + rnd(seed, 42) * 0.34);
  const lean  = (rnd(seed, 43) - 0.5) * w * 0.16;
  p.moveTo(-w / 2, 0);
  p.lineTo(-w * 0.40, -h * notch);
  p.lineTo(-topW / 2 + lean, -h * 0.86);
  p.lineTo(-topW / 2 + lean + w * 0.03, -h);
  p.lineTo( topW / 2 + lean - w * 0.04, -h * 0.985);
  p.lineTo( topW / 2 + lean, -h * 0.84);
  p.lineTo( w * 0.42, -h * (notch * 0.7));
  p.lineTo( w / 2, 0);
  p.closePath();
  return p;
}

function drawMesaLayer(cfg) {
  const { depth, spacing, hMin, hMax, wMin, wMax, color, litMix, alpha, salt } = cfg;
  const scroll = S.dist * depth;
  const baseY  = HZ + cfg.drop;
  const i0 = Math.floor((scroll - spacing) / spacing);
  const i1 = i0 + Math.ceil(W / spacing) + 3;

  ctx.save();
  ctx.globalAlpha = alpha;
  for (let i = i0; i <= i1; i++) {
    if (rnd(i, salt + 3) < cfg.gap) continue;
    const x = i * spacing + rnd(i, salt) * spacing * 0.8 - scroll;
    if (x < -400 || x > W + 400) continue;
    const h = lerp(hMin, hMax, rnd(i, salt + 1)) * UNIT;
    const w = lerp(wMin, wMax, rnd(i, salt + 2)) * UNIT;

    ctx.save();
    ctx.translate(x, baseY);
    const p = mesaPath(w, h, i * 31 + salt);
    ctx.fillStyle = color;
    ctx.fill(p);

    // sun-facing edge
    ctx.save();
    ctx.clip(p);
    const lg = ctx.createLinearGradient(-w * 0.1, 0, w * 0.55, 0);
    lg.addColorStop(0, rgba(PAL.mesaLit, 0));
    lg.addColorStop(1, rgba(PAL.mesaLit, litMix));
    ctx.fillStyle = lg;
    ctx.fillRect(-w, -h - 4, w * 2, h + 8);
    // strata lines
    ctx.globalAlpha = 0.18;
    ctx.strokeStyle = rgba(PAL.fg, 0.5);
    ctx.lineWidth = 1.2;
    for (let s = 1; s < 5; s++) {
      const yy = -h * (s / 5.5) - h * 0.06;
      ctx.beginPath();
      ctx.moveTo(-w, yy); ctx.lineTo(w, yy + w * 0.02);
      ctx.stroke();
    }
    ctx.restore();
    ctx.restore();
  }
  ctx.restore();
}

/* ================================================================== *
 *  GROUND
 * ================================================================== */
// the ground gradient itself lives in the backdrop; this is just its texture
function drawGround() {
  ctx.save();
  const ROWS = 38;
  for (let r = 0; r < ROWS; r++) {
    const v  = Math.pow((r + 0.5) / ROWS, 0.85);
    const y  = groundY(v);
    const sp = layerSpeed(v);
    const len = 6 + v * 120;
    const gapX = 40 + v * 190;
    const scroll = S.dist * sp;
    const off = ((scroll % gapX) + gapX) % gapX;
    ctx.globalAlpha = 0.04 + v * 0.10;
    ctx.fillStyle = r % 3 === 0 ? PAL.fg : PAL.dust;
    for (let x = -off - gapX; x < W + gapX; x += gapX) {
      const key = Math.round((x + scroll) / gapX);
      const jx = rnd(key, r) * gapX * 0.9;
      const jy = (rnd(key, r + 11) - 0.5) * (y - groundY(Math.max(0, v - 1 / ROWS))) * 1.6;
      ctx.fillRect(x + jx, y + jy, len * (0.3 + rnd(key, r + 5) * 0.9), Math.max(1, v * 2.4));
    }
  }
  ctx.restore();

  // dry cracks / stones in the near field
  ctx.save();
  ctx.globalAlpha = 0.30;
  const scroll = S.dist * layerSpeed(0.85);
  for (let i = 0; i < 70; i++) {
    const gapX = 260;
    const idx = Math.floor(scroll / gapX) + i - 35;
    const x = idx * gapX + rnd(idx, 61) * gapX - scroll;
    if (x < -80 || x > W + 80) continue;
    const v = 0.62 + rnd(idx, 62) * 0.36;
    const y = groundY(v), s = depthScale(v) * (3 + rnd(idx, 63) * 9);
    ctx.fillStyle = rnd(idx, 64) > 0.5 ? PAL.fg : PAL.dust;
    ctx.beginPath();
    ctx.ellipse(x, y, s, s * 0.45, rnd(idx, 65), 0, TAU);
    ctx.fill();
  }
  ctx.restore();
}

/* ================================================================== *
 *  PLANTS & PROPS
 * ================================================================== */
function drawCactus(x, y, s, seed, col) {
  ctx.save();
  ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = col;
  ctx.strokeStyle = col;
  ctx.lineCap = "round"; ctx.lineJoin = "round";

  const h = 60 + rnd(seed, 71) * 46;
  const w = 13;
  // trunk
  ctx.beginPath();
  ctx.roundRect(-w / 2, -h, w, h, w / 2);
  ctx.fill();

  // arms
  const arms = 1 + Math.round(rnd(seed, 72) * 2);
  for (let a = 0; a < arms; a++) {
    const side = rnd(seed, 73 + a) > 0.5 ? 1 : -1;
    const ay = -h * (0.36 + rnd(seed, 75 + a) * 0.36);
    const reach = (12 + rnd(seed, 77 + a) * 14) * side;
    const rise  = 16 + rnd(seed, 79 + a) * 26;
    ctx.lineWidth = w * 0.72;
    ctx.beginPath();
    ctx.moveTo(0, ay);
    ctx.quadraticCurveTo(reach, ay, reach, ay - rise);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(reach, ay - rise, w * 0.36, 0, TAU);
    ctx.fill();
  }
  // ribs
  ctx.globalAlpha = 0.22;
  ctx.strokeStyle = "#000";
  ctx.lineWidth = 1;
  for (let k = -1; k <= 1; k++) {
    ctx.beginPath();
    ctx.moveTo(k * 3.4, -h + 5); ctx.lineTo(k * 3.4, -4);
    ctx.stroke();
  }
  ctx.restore();
}

function drawBrush(x, y, s, seed, col) {
  ctx.save();
  ctx.translate(x, y); ctx.scale(s, s);
  ctx.strokeStyle = col; ctx.lineWidth = 1.8; ctx.lineCap = "round";
  ctx.beginPath();
  for (let i = 0; i < 11; i++) {
    const a = -Math.PI / 2 + (rnd(seed, 91 + i) - 0.5) * 2.1;
    const L = 9 + rnd(seed, 103 + i) * 17;
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(Math.cos(a) * L * 0.4, Math.sin(a) * L * 0.7, Math.cos(a) * L, Math.sin(a) * L);
  }
  ctx.stroke();
  ctx.restore();
}

function drawSkull(x, y, s, col) {
  ctx.save();
  ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.ellipse(0, -6, 9, 8, 0, 0, TAU); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-4, -2); ctx.lineTo(4, -2); ctx.lineTo(2.4, 6); ctx.lineTo(-2.4, 6);
  ctx.closePath(); ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = col; ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(-8, -9); ctx.quadraticCurveTo(-19, -13, -16, -22);
  ctx.moveTo( 8, -9); ctx.quadraticCurveTo( 19, -13,  16, -22);
  ctx.stroke();
  ctx.fillStyle = "rgba(0,0,0,.55)";
  ctx.beginPath(); ctx.ellipse(-3.6, -7, 2.4, 2.8, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse( 3.6, -7, 2.4, 2.8, 0, 0, TAU); ctx.fill();
  ctx.restore();
}

// scatter belt of props at a given depth band
function drawPropBand(cfg) {
  const { vMin, vMax, spacing, salt, alpha, sizeMul } = cfg;
  const vMid = (vMin + vMax) / 2;
  const scroll = S.dist * layerSpeed(vMid);
  const i0 = Math.floor((scroll - spacing) / spacing);
  const i1 = i0 + Math.ceil(W / spacing) + 3;
  ctx.save();
  ctx.globalAlpha = alpha;
  for (let i = i0; i <= i1; i++) {
    const roll = rnd(i, salt);
    if (roll < cfg.gap) continue;
    const x = i * spacing + rnd(i, salt + 1) * spacing * 0.85 - scroll;
    if (x < -220 || x > W + 220) continue;
    const v = lerp(vMin, vMax, rnd(i, salt + 2));
    const y = groundY(v);
    const s = depthScale(v) * sizeMul * (UNIT / 780);
    const shade = clamp((v - 0.1) * 1.25, 0, 1);
    const col = mixHex(PAL.mesaMid, PAL.fg, shade * 0.85);

    // contact shadow
    ctx.save();
    ctx.globalAlpha = alpha * 0.25;
    ctx.fillStyle = PAL.fg;
    ctx.beginPath();
    ctx.ellipse(x - s * 6, y + s * 1.5, s * 26, s * 4, 0, 0, TAU);
    ctx.fill();
    ctx.restore();

    const kind = rnd(i, salt + 3);
    if (kind < 0.55)      drawCactus(x, y, s, i * 17 + salt, col);
    else if (kind < 0.86) drawBrush(x, y, s * 1.1, i * 19 + salt, col);
    else                  drawSkull(x, y, s * 1.15, col);
  }
  ctx.restore();
}

/* ------------------------------------------------------------------ *
 *  Tumbleweeds
 * ------------------------------------------------------------------ */
const weeds = [];
function seedWeeds() {
  weeds.length = 0;
  for (let i = 0; i < 5; i++) {
    weeds.push({
      x: W * (0.2 + Math.random() * 1.4),
      v: 0.55 + Math.random() * 0.5,
      depth: 0.55 + Math.random() * 0.42,
      r: 12 + Math.random() * 16,
      rot: Math.random() * TAU,
      bounce: Math.random() * TAU,
      seed: (Math.random() * 1e4) | 0
    });
  }
}
function updateWeeds(dt) {
  for (const w of weeds) {
    const sp = layerSpeed(w.depth) * 140 * S.speed * w.v;
    w.x -= sp * dt;
    w.rot -= (sp / (w.r * 22)) * dt * 4.2;
    w.bounce += dt * (3.4 + w.v);
    if (w.x < -160) {
      w.x = W + 120 + Math.random() * W * 0.7;
      w.depth = 0.5 + Math.random() * 0.46;
      w.r = 12 + Math.random() * 16;
      w.seed = (Math.random() * 1e4) | 0;
    }
  }
}
function drawWeeds() {
  for (const w of weeds) {
    const s = depthScale(w.depth) * (UNIT / 700);
    const hop = Math.abs(Math.sin(w.bounce)) * w.r * 1.5 * s;
    const y = groundY(w.depth) - hop;
    ctx.save();
    ctx.globalAlpha = 0.22;
    ctx.fillStyle = PAL.fg;
    ctx.beginPath();
    ctx.ellipse(w.x, groundY(w.depth) + 2, w.r * s * 1.1, w.r * s * 0.28, 0, 0, TAU);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.translate(w.x, y - w.r * s);
    ctx.rotate(w.rot);
    ctx.scale(s, s);
    ctx.strokeStyle = mixHex(PAL.mesaMid, PAL.fg, 0.45);
    ctx.lineWidth = 1.5; ctx.lineCap = "round";
    ctx.beginPath();
    for (let i = 0; i < 16; i++) {
      const a1 = rnd(w.seed, 200 + i) * TAU, a2 = a1 + 1.4 + rnd(w.seed, 220 + i) * 2.4;
      const r1 = w.r * (0.45 + rnd(w.seed, 240 + i) * 0.6);
      const r2 = w.r * (0.45 + rnd(w.seed, 260 + i) * 0.6);
      ctx.moveTo(Math.cos(a1) * r1, Math.sin(a1) * r1);
      ctx.quadraticCurveTo(0, 0, Math.cos(a2) * r2, Math.sin(a2) * r2);
    }
    ctx.stroke();
    ctx.restore();
  }
}

/* ================================================================== *
 *  DUST
 * ================================================================== */
const dust = [];
function puff(x, y, power, spread) {
  dust.push({
    x, y,
    vx: -(40 + Math.random() * 130) * (0.6 + power),
    vy: -(8 + Math.random() * 46) * power,
    r: (5 + Math.random() * 14) * (0.7 + power * 0.7),
    grow: 26 + Math.random() * 46,
    life: 0, max: 0.75 + Math.random() * 0.95,
    rot: Math.random() * TAU,
    spread
  });
  if (dust.length > 320) dust.splice(0, dust.length - 320);
}
function updateDust(dt) {
  for (let i = dust.length - 1; i >= 0; i--) {
    const p = dust[i];
    p.life += dt;
    if (p.life > p.max) { dust.splice(i, 1); continue; }
    p.x += p.vx * dt * S.speed;
    p.y += p.vy * dt;
    p.vy += 26 * dt;
    p.vx *= 1 - 0.7 * dt;
    p.r  += p.grow * dt;
  }
}
// one soft sprite, re-tinted only when the palette actually moves
const puffCv = document.createElement("canvas");
puffCv.width = puffCv.height = 96;
let puffKey = "";
function buildPuff() {
  // kicked-up sand, not glowing smoke: warm and a shade darker than the ground
  const col = mixHex(PAL.dust, PAL.groundNear, 0.35);
  if (col === puffKey) return;
  puffKey = col;
  const q = puffCv.getContext("2d");
  q.clearRect(0, 0, 96, 96);
  const g = q.createRadialGradient(48, 48, 6, 48, 48, 48);
  g.addColorStop(0,    rgba(col, 0.9));
  g.addColorStop(0.45, rgba(col, 0.5));
  g.addColorStop(1,    rgba(col, 0));
  q.fillStyle = g;
  q.fillRect(0, 0, 96, 96);
}

function drawDust(front) {
  ctx.save();
  for (const p of dust) {
    if ((p.spread === 1) !== front) continue;
    const u = p.life / p.max;
    ctx.globalAlpha = (1 - u) * (1 - u) * 0.62;
    const rw = p.r * 1.45, rh = p.r * 0.72;
    ctx.drawImage(puffCv, p.x - rw, p.y - rh, rw * 2, rh * 2);
  }
  ctx.restore();
}

/* ================================================================== *
 *  THE BULL + RIDER
 *  Local space: origin at the ground between the hooves,
 *  +x forward (right), −y up.  ~250 units tall overall.
 * ================================================================== */

// two-bone IK; returns the middle joint position
function ik(hx, hy, fx, fy, L1, L2, bend) {
  let dx = fx - hx, dy = fy - hy;
  let d = Math.hypot(dx, dy) || 1e-4;
  const maxD = (L1 + L2) * 0.999;
  if (d > maxD) { dx *= maxD / d; dy *= maxD / d; d = maxD; }
  const a = (d * d + L1 * L1 - L2 * L2) / (2 * d);
  const h = Math.sqrt(Math.max(0, L1 * L1 - a * a));
  const ux = dx / d, uy = dy / d;
  return [hx + ux * a - uy * h * bend, hy + uy * a + ux * h * bend];
}

// foot target path relative to the hip, in local units
function footPath(p, reachF, reachB, lift, duty) {
  p = p - Math.floor(p);
  if (p < duty) {                       // stance: planted, sliding back
    const u = p / duty;
    return [lerp(reachF, -reachB, u), 0];
  }
  const u = (p - duty) / (1 - duty);    // swing: arc forward
  const x = lerp(-reachB, reachF, ease(u));
  const y = -Math.sin(Math.PI * u) * lift;
  return [x, y];
}

function drawLeg(hipX, hipY, groundLvl, phase, cfg, col, hoofCol) {
  const [fxo, fyo] = footPath(phase, cfg.reachF, cfg.reachB, cfg.lift, cfg.duty);
  const fx = hipX + fxo;
  const fy = groundLvl + fyo;
  const [kx, ky] = ik(hipX, hipY, fx, fy, cfg.L1, cfg.L2, cfg.bend);

  ctx.lineCap = "round"; ctx.lineJoin = "round";
  // upper (thick, tapering)
  ctx.strokeStyle = col;
  ctx.lineWidth = cfg.w1; ctx.beginPath();
  ctx.moveTo(hipX, hipY); ctx.lineTo(kx, ky); ctx.stroke();
  // lower (cannon bone)
  ctx.lineWidth = cfg.w2; ctx.beginPath();
  ctx.moveTo(kx, ky); ctx.lineTo(fx, fy); ctx.stroke();
  // joint
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.arc(kx, ky, cfg.w2 * 0.62, 0, TAU); ctx.fill();
  // hoof
  const ang = Math.atan2(fy - ky, fx - kx);
  ctx.save();
  ctx.translate(fx, fy); ctx.rotate(ang - Math.PI / 2);
  ctx.fillStyle = hoofCol;
  ctx.beginPath();
  ctx.roundRect(-cfg.w2 * 0.85, -1, cfg.w2 * 1.7, cfg.w2 * 1.5, 2.4);
  ctx.fill();
  ctx.restore();

  return { fx, fy, grounded: (phase - Math.floor(phase)) < cfg.duty };
}

const LEGS = {
  front: { L1:50, L2:46, w1:21, w2:11, reachF:46, reachB:40, lift:44, duty:0.32, bend:-1 },
  hind:  { L1:56, L2:48, w1:27, w2:12, reachF:52, reachB:46, lift:50, duty:0.34, bend: 1 }
};

const BULL_PHASES = { hindL: 0.00, hindR: 0.12, frontL: 0.48, frontR: 0.60 };

function drawBull(opts) {
  const { x, y, scale, phase, flip, coat, coatDark, horn, shirt, hatCol, alpha, riderTilt } = opts;

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y);
  ctx.scale(scale * (flip ? -1 : 1), scale);

  const p  = phase - Math.floor(phase);
  // body bounce: two impulses per stride
  const bob   = -Math.sin(p * TAU) * 9 - Math.abs(Math.sin(p * Math.PI)) * 5;
  const pitch = Math.sin(p * TAU + 0.9) * 0.075;
  const airborne = clamp(Math.sin(p * TAU + 1.2), 0, 1);

  const HIP = [-58, -116], SHO = [52, -112];

  // ---------- ground shadow ----------
  ctx.save();
  ctx.globalAlpha = alpha * 0.34;
  ctx.fillStyle = PAL.fg;
  ctx.beginPath();
  ctx.ellipse(-4, 4, 108 - airborne * 12, 15 - airborne * 3, 0, 0, TAU);
  ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.translate(0, bob);
  ctx.rotate(pitch);

  const darker = mixHex(coatDark, "#000000", 0.22);
  const hoof   = mixHex("#2b2119", coatDark, 0.25);

  // ---------- far side legs ----------
  drawLeg(HIP[0], HIP[1], -bob, p + BULL_PHASES.hindR,  LEGS.hind,  darker, mixHex(hoof,"#000",0.25));
  drawLeg(SHO[0], SHO[1], -bob, p + BULL_PHASES.frontR, LEGS.front, darker, mixHex(hoof,"#000",0.25));

  // ---------- tail ----------
  ctx.save();
  ctx.strokeStyle = coatDark; ctx.lineWidth = 8; ctx.lineCap = "round";
  const tx = -78, ty = -146;
  const sw = Math.sin(S.t * 7 + p * TAU) * 16;
  const stream = clamp(S.speed - 0.85, 0, 0.75);           // it flies out at speed
  const t2x = tx - 32 - airborne * 6 - stream * 12, t2y = ty + 30 + sw * 0.4 - stream * 22;
  const t3x = tx - 42 - stream * 22,                t3y = ty + 70 + sw - stream * 44;
  ctx.beginPath();
  ctx.moveTo(tx, ty);
  ctx.bezierCurveTo(tx - 26, ty + 6, t2x, t2y, t3x, t3y);
  ctx.stroke();
  ctx.fillStyle = darker;
  ctx.beginPath();
  ctx.ellipse(t3x - 4, t3y + 12, 9, 17, sw * 0.02 - 0.15, 0, TAU);
  ctx.fill();
  ctx.restore();

  // ---------- body ----------
  const body = new Path2D();
  body.moveTo(84, -120);
  body.bezierCurveTo(90, -150, 76, -172, 46, -174);   // chest → withers hump
  body.bezierCurveTo(22, -176, 2, -167, -20, -165);   // back
  body.bezierCurveTo(-46, -163, -64, -167, -76, -152);// rump
  body.bezierCurveTo(-90, -134, -86, -108, -74, -94); // hindquarter
  body.bezierCurveTo(-58, -78, -28, -76, 6, -79);     // belly
  body.bezierCurveTo(40, -82, 64, -94, 84, -120);     // brisket
  body.closePath();

  const bg = ctx.createLinearGradient(0, -178, 0, -74);
  bg.addColorStop(0,   mixHex(coat, PAL.rim, 0.28));
  bg.addColorStop(0.45,coat);
  bg.addColorStop(1,   coatDark);
  ctx.fillStyle = bg;
  ctx.fill(body);

  // muscle shading + hide markings, clipped to the body
  ctx.save();
  ctx.clip(body);
  ctx.globalAlpha = alpha * 0.30;
  ctx.fillStyle = darker;
  ctx.beginPath(); ctx.ellipse(-56, -126, 34, 40, -0.2, 0, TAU); ctx.fill();  // haunch
  ctx.beginPath(); ctx.ellipse( 52, -128, 26, 34,  0.2, 0, TAU); ctx.fill();  // shoulder
  ctx.globalAlpha = alpha * 0.22;
  ctx.beginPath(); ctx.ellipse(-4, -80, 62, 16, 0, 0, TAU); ctx.fill();       // belly shade

  // white patches
  ctx.globalAlpha = alpha * 0.62;
  ctx.fillStyle = mixHex("#f8e8c6", coat, 0.10);
  ctx.beginPath(); ctx.ellipse(-24, -92, 34, 17, 0.1, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(18, -160, 20, 11, -0.25, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-64, -104, 13, 9, 0.4, 0, TAU); ctx.fill();

  // rim light along the leading edge
  ctx.globalAlpha = alpha * 0.55;
  const rl = ctx.createLinearGradient(40, 0, 96, 0);
  rl.addColorStop(0, rgba(PAL.rim, 0));
  rl.addColorStop(1, rgba(PAL.rim, 0.85));
  ctx.fillStyle = rl;
  ctx.fillRect(30, -190, 70, 130);
  ctx.restore();

  ctx.globalAlpha = alpha;
  ctx.strokeStyle = rgba(PAL.fg, 0.35);
  ctx.lineWidth = 1.4;
  ctx.stroke(body);

  // ---------- neck + head ----------
  const headBob = Math.sin(p * TAU + 2.4) * 7;
  ctx.save();
  ctx.translate(56, -150);
  ctx.rotate(Math.sin(p * TAU + 2.0) * 0.06);
  ctx.translate(-56, 150);

  const neck = new Path2D();
  neck.moveTo(48, -172);
  neck.bezierCurveTo(74, -178, 100, -172, 118, -158 + headBob * 0.4);
  neck.lineTo(126, -124 + headBob * 0.4);
  neck.bezierCurveTo(104, -116, 84, -110, 70, -112);   // dewlap
  neck.bezierCurveTo(60, -113, 54, -118, 52, -126);
  neck.closePath();
  const ng = ctx.createLinearGradient(0, -180, 0, -108);
  ng.addColorStop(0, mixHex(coat, PAL.rim, 0.22));
  ng.addColorStop(1, coatDark);
  ctx.fillStyle = ng; ctx.fill(neck);
  ctx.strokeStyle = rgba(PAL.fg, 0.3); ctx.lineWidth = 1.3; ctx.stroke(neck);

  ctx.save();
  ctx.translate(0, headBob);

  // far horn
  ctx.strokeStyle = mixHex(horn, "#6b5334", 0.45);
  ctx.lineWidth = 9; ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(118, -158);
  ctx.bezierCurveTo(126, -184, 152, -190, 158, -172);
  ctx.stroke();

  // ears
  ctx.fillStyle = coatDark;
  ctx.beginPath();
  ctx.ellipse(112, -150, 16, 7, -0.5 + Math.sin(S.t * 9) * 0.12, 0, TAU);
  ctx.fill();

  // head
  const head = new Path2D();
  head.moveTo(112, -166);
  head.bezierCurveTo(140, -170, 162, -158, 172, -140);
  head.bezierCurveTo(180, -128, 174, -116, 160, -114);
  head.bezierCurveTo(146, -112, 132, -118, 118, -126);
  head.bezierCurveTo(110, -132, 106, -152, 112, -166);
  head.closePath();
  const hg = ctx.createLinearGradient(110, -170, 150, -112);
  hg.addColorStop(0, mixHex(coat, PAL.rim, 0.30));
  hg.addColorStop(1, coatDark);
  ctx.fillStyle = hg; ctx.fill(head);
  ctx.strokeStyle = rgba(PAL.fg, 0.35); ctx.lineWidth = 1.3; ctx.stroke(head);

  // blaze
  ctx.save(); ctx.clip(head);
  ctx.globalAlpha = alpha * 0.5;
  ctx.fillStyle = "#f6e7d2";
  ctx.beginPath();
  ctx.ellipse(152, -136, 7, 22, -0.55, 0, TAU); ctx.fill();
  ctx.restore();

  // muzzle
  ctx.fillStyle = mixHex(coatDark, "#3a2622", 0.5);
  ctx.beginPath();
  ctx.ellipse(166, -124, 11, 9, -0.35, 0, TAU); ctx.fill();
  ctx.fillStyle = "rgba(0,0,0,.55)";
  ctx.beginPath(); ctx.ellipse(169, -128, 2.6, 3.4, -0.3, 0, TAU); ctx.fill();

  // flared nostril breath
  if (S.speed > 1.25 && Math.sin(S.t * 6) > 0.4) {
    ctx.globalAlpha = alpha * 0.18;
    ctx.fillStyle = PAL.dust;
    ctx.beginPath(); ctx.ellipse(184, -126, 16, 8, -0.2, 0, TAU); ctx.fill();
    ctx.globalAlpha = alpha;
  }

  // eye
  ctx.fillStyle = "#f7ecdc";
  ctx.beginPath(); ctx.ellipse(133, -150, 6.4, 5.2, -0.2, 0, TAU); ctx.fill();
  ctx.fillStyle = "#150d09";
  ctx.beginPath(); ctx.ellipse(134.5, -149.5, 3.4, 3.6, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = rgba(PAL.rim, 0.9);
  ctx.beginPath(); ctx.arc(136, -151.5, 1.2, 0, TAU); ctx.fill();
  ctx.strokeStyle = darker; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(133, -150, 7.6, Math.PI * 1.05, Math.PI * 1.95); ctx.stroke();

  // shaggy forelock between the horns
  ctx.strokeStyle = mixHex(coatDark, "#000", 0.2);
  ctx.lineWidth = 3; ctx.lineCap = "round";
  for (let i = 0; i < 5; i++) {
    const bx = 112 + i * 3.4, by = -166 + i * 1.6;
    const w = Math.sin(S.t * 8 + i) * 3;
    ctx.beginPath();
    ctx.moveTo(bx, by);
    ctx.quadraticCurveTo(bx + 6, by + 8, bx + 4 + w, by + 15);
    ctx.stroke();
  }

  // near horn (in front of the face)
  const hgr = ctx.createLinearGradient(110, -190, 170, -160);
  hgr.addColorStop(0, mixHex(horn, PAL.rim, 0.3));
  hgr.addColorStop(1, mixHex(horn, "#5c4526", 0.55));
  ctx.strokeStyle = hgr;
  ctx.lineWidth = 11; ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(116, -162);
  ctx.bezierCurveTo(118, -196, 96, -212, 74, -204);
  ctx.stroke();
  ctx.lineWidth = 4;
  ctx.strokeStyle = mixHex(horn, "#fff6e0", 0.5);
  ctx.beginPath();
  ctx.moveTo(78, -206); ctx.bezierCurveTo(70, -206, 66, -202, 64, -198);
  ctx.stroke();

  // brass nose ring
  ctx.strokeStyle = "#d9a441"; ctx.lineWidth = 2.4;
  ctx.beginPath(); ctx.arc(170, -117, 7, -0.3, Math.PI + 0.6); ctx.stroke();

  ctx.restore(); // headBob
  ctx.restore(); // neck swing

  // ---------- saddle blanket ----------
  ctx.save();
  ctx.fillStyle = shirt;
  ctx.beginPath();
  ctx.moveTo(-34, -168); ctx.lineTo(24, -170);
  ctx.lineTo(30, -132); ctx.lineTo(-40, -128);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = mixHex(shirt, "#ffe7b0", 0.6);
  ctx.lineWidth = 2.4;
  ctx.beginPath();
  ctx.moveTo(-38, -138); ctx.lineTo(29, -142);
  ctx.moveTo(-36, -146); ctx.lineTo(27, -150);
  ctx.stroke();
  // saddle
  ctx.fillStyle = "#7b4a24";
  ctx.beginPath();
  ctx.moveTo(-26, -170);
  ctx.bezierCurveTo(-10, -178, 14, -178, 26, -170);
  ctx.bezierCurveTo(30, -160, 8, -156, -8, -157);
  ctx.bezierCurveTo(-20, -158, -28, -162, -26, -170);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#8f5a2c";
  ctx.beginPath(); ctx.ellipse(22, -176, 6, 7, 0.3, 0, TAU); ctx.fill();  // horn of the saddle
  ctx.restore();

  // ---------- rider ----------
  drawRider(p, bob, shirt, hatCol, alpha, riderTilt);

  // ---------- near side legs ----------
  const nh = drawLeg(HIP[0], HIP[1], -bob, p + BULL_PHASES.hindL,  LEGS.hind,  coatDark, hoof);
  const nf = drawLeg(SHO[0], SHO[1], -bob, p + BULL_PHASES.frontL, LEGS.front, coatDark, hoof);

  ctx.restore(); // bob/pitch
  ctx.restore(); // world transform

  return { nh, nf };
}

function drawRider(p, bob, shirt, hatCol, alpha, tilt) {
  const skin = "#c98d5f", denim = "#3f5a78", leather = "#7a4a24";
  const rise = Math.sin(p * TAU + 0.4) * 4;         // rider lags the bull
  const lean = 0.16 + Math.sin(p * TAU + 1.1) * 0.05 + tilt;

  ctx.save();
  ctx.translate(-2, -172 + rise);
  ctx.rotate(-lean);
  ctx.lineCap = "round"; ctx.lineJoin = "round";

  // far arm (up, working the rope)
  ctx.strokeStyle = mixHex(shirt, "#000", 0.35);
  ctx.lineWidth = 9;
  ctx.beginPath();
  ctx.moveTo(2, -34);
  ctx.quadraticCurveTo(-16, -52, -20, -74);
  ctx.stroke();

  // chaps / near leg over the flank
  ctx.strokeStyle = denim; ctx.lineWidth = 15;
  ctx.beginPath();
  ctx.moveTo(0, -4);
  ctx.quadraticCurveTo(26, 4, 32, 22);
  ctx.stroke();
  ctx.strokeStyle = leather; ctx.lineWidth = 17;
  ctx.beginPath();
  ctx.moveTo(6, -2); ctx.quadraticCurveTo(22, 3, 28, 14);
  ctx.stroke();
  // fringe
  ctx.strokeStyle = mixHex(leather, "#e8c48a", 0.35); ctx.lineWidth = 1.6;
  for (let i = 0; i < 5; i++) {
    const q = i / 4;
    const bx = lerp(8, 30, q), by = lerp(6, 20, q);
    ctx.beginPath();
    ctx.moveTo(bx, by);
    ctx.lineTo(bx - 3 - Math.sin(S.t * 12 + i) * 3, by + 9);
    ctx.stroke();
  }
  // boot + stirrup + spur
  ctx.save();
  ctx.translate(33, 24);
  ctx.rotate(0.32);
  ctx.fillStyle = "#4a2b16";
  ctx.beginPath(); ctx.roundRect(-7, -10, 14, 20, 4); ctx.fill();
  ctx.beginPath(); ctx.roundRect(-9, 4, 22, 9, 4); ctx.fill();
  ctx.strokeStyle = "#c9ab6a"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(-12, 9, 5, 0, TAU); ctx.stroke();
  for (let i = 0; i < 6; i++) {
    const a = S.t * 9 + i * TAU / 6;
    ctx.beginPath();
    ctx.moveTo(-12 + Math.cos(a) * 3, 9 + Math.sin(a) * 3);
    ctx.lineTo(-12 + Math.cos(a) * 6.5, 9 + Math.sin(a) * 6.5);
    ctx.stroke();
  }
  ctx.strokeStyle = "#3a2a1a"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(0, -12); ctx.lineTo(-2, -26); ctx.stroke();
  ctx.restore();

  // torso
  const torso = new Path2D();
  torso.moveTo(-12, 0);
  torso.bezierCurveTo(-18, -18, -14, -34, -6, -42);
  torso.bezierCurveTo(2, -50, 16, -46, 18, -34);
  torso.bezierCurveTo(20, -20, 16, -8, 12, 2);
  torso.closePath();
  const tg = ctx.createLinearGradient(-18, -46, 20, 2);
  tg.addColorStop(0, mixHex(shirt, PAL.rim, 0.30));
  tg.addColorStop(1, mixHex(shirt, "#000", 0.30));
  ctx.fillStyle = tg; ctx.fill(torso);
  ctx.strokeStyle = rgba(PAL.fg, 0.35); ctx.lineWidth = 1.2; ctx.stroke(torso);

  // vest
  ctx.save(); ctx.clip(torso);
  ctx.fillStyle = mixHex(leather, "#2c1a0d", 0.35);
  ctx.beginPath();
  ctx.moveTo(-20, -46); ctx.lineTo(-2, -44);
  ctx.lineTo(-6, 4); ctx.lineTo(-22, 4);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(20, -40); ctx.lineTo(10, -40);
  ctx.lineTo(14, 4); ctx.lineTo(24, 4);
  ctx.closePath(); ctx.fill();
  ctx.restore();

  // belt + buckle
  ctx.fillStyle = "#40260f";
  ctx.fillRect(-14, -6, 28, 7);
  ctx.fillStyle = "#e2b653";
  ctx.beginPath(); ctx.roundRect(-3, -7, 9, 9, 2); ctx.fill();

  // bandana streaming behind
  ctx.save();
  ctx.fillStyle = "#b8392f";
  ctx.beginPath();
  ctx.moveTo(-4, -44);
  const w1 = Math.sin(S.t * 11) * 7, w2 = Math.sin(S.t * 11 + 1.6) * 10;
  ctx.quadraticCurveTo(-22, -46 + w1, -40, -34 + w2);
  ctx.quadraticCurveTo(-26, -36 + w2 * 0.4, -8, -36);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#8f2a22";
  ctx.beginPath();
  ctx.ellipse(0, -44, 9, 5, -0.3, 0, TAU); ctx.fill();
  ctx.restore();

  // head
  ctx.fillStyle = mixHex(skin, "#000", 0.12);
  ctx.beginPath(); ctx.roundRect(-2, -52, 9, 10, 3); ctx.fill();   // neck
  ctx.fillStyle = skin;
  ctx.beginPath();
  ctx.ellipse(4, -58, 10.5, 11.5, 0.12, 0, TAU); ctx.fill();
  // jaw shadow + stubble
  ctx.save();
  ctx.globalAlpha = alpha * 0.35;
  ctx.fillStyle = "#5d3a22";
  ctx.beginPath(); ctx.ellipse(5, -52.5, 8.5, 5, 0.1, 0, TAU); ctx.fill();
  ctx.restore();
  // eye + brow
  ctx.fillStyle = "#20140c";
  ctx.beginPath(); ctx.ellipse(10, -60, 1.9, 2.2, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = "#3a2313"; ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.moveTo(6.5, -64.5); ctx.lineTo(12.5, -63.2); ctx.stroke();
  // grin
  ctx.lineWidth = 1.4; ctx.strokeStyle = "#5a3620";
  ctx.beginPath(); ctx.arc(9, -54, 3.4, -0.2, 1.1); ctx.stroke();

  // hat
  ctx.save();
  ctx.translate(3, -66);
  ctx.rotate(-0.08);
  const hg2 = ctx.createLinearGradient(0, -18, 0, 6);
  hg2.addColorStop(0, mixHex(hatCol, PAL.rim, 0.32));
  hg2.addColorStop(1, mixHex(hatCol, "#000", 0.32));
  ctx.fillStyle = hg2;
  // brim
  ctx.beginPath();
  ctx.moveTo(-22, 2);
  ctx.bezierCurveTo(-18, -5, 18, -6, 24, 0);
  ctx.bezierCurveTo(18, 6, -14, 8, -22, 2);
  ctx.closePath(); ctx.fill();
  // crown with a crease
  ctx.beginPath();
  ctx.moveTo(-11, 0);
  ctx.bezierCurveTo(-13, -14, -6, -21, 2, -21);
  ctx.bezierCurveTo(10, -21, 15, -13, 13, 0);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = rgba("#000000", 0.28); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(0, -8); ctx.stroke();
  // hat band
  ctx.fillStyle = mixHex(hatCol, "#2a1608", 0.62);
  ctx.beginPath();
  ctx.moveTo(-11.5, -1); ctx.lineTo(13.5, -1); ctx.lineTo(13, -5); ctx.lineTo(-11, -5);
  ctx.closePath(); ctx.fill();
  ctx.restore();

  // near arm forward on the reins
  ctx.strokeStyle = shirt; ctx.lineWidth = 10;
  const handX = 46, handY = -22 + Math.sin(p * TAU + 1.5) * 4;
  ctx.beginPath();
  ctx.moveTo(12, -36);
  ctx.quadraticCurveTo(30, -34, handX, handY);
  ctx.stroke();
  ctx.fillStyle = mixHex(leather, "#c98a4b", 0.3);
  ctx.beginPath(); ctx.arc(handX, handY, 5.4, 0, TAU); ctx.fill();

  ctx.restore(); // rider transform

  // ---------- reins (in bull space, from hand to the bit) ----------
  ctx.save();
  ctx.strokeStyle = "#5c3517"; ctx.lineWidth = 2.4; ctx.lineCap = "round";
  const hx = -2 + Math.cos(-lean) * 46 - Math.sin(-lean) * (-22);
  const hy = -172 + rise + Math.sin(-lean) * 46 + Math.cos(-lean) * (-22);
  const sag = Math.sin(p * TAU) * 6;
  ctx.beginPath();
  ctx.moveTo(hx, hy);
  ctx.quadraticCurveTo(110, -118 + sag, 164, -120);
  ctx.stroke();
  ctx.restore();

  // ---------- lasso ----------
  ctx.save();
  const rhx = -2 + Math.cos(-lean) * (-20) - Math.sin(-lean) * (-74);
  const rhy = -172 + rise + Math.sin(-lean) * (-20) + Math.cos(-lean) * (-74);
  const spin = S.t * (5.2 + S.speed * 2.6);
  const loopR = 42, tiltY = 0.34;
  ctx.strokeStyle = "#e6cf9c"; ctx.lineWidth = 3;
  ctx.save();
  ctx.translate(rhx - 6, rhy - 40);
  ctx.rotate(Math.sin(spin * 0.5) * 0.12 - 0.1);
  ctx.beginPath();
  ctx.ellipse(0, 0, loopR, loopR * tiltY, 0, 0, TAU);
  ctx.stroke();
  // a bead on the loop shows the spin direction
  ctx.fillStyle = "#fff0cd";
  ctx.beginPath();
  ctx.arc(Math.cos(spin) * loopR, Math.sin(spin) * loopR * tiltY, 3, 0, TAU);
  ctx.fill();
  ctx.restore();
  // rope from hand up to the loop
  ctx.beginPath();
  ctx.moveTo(rhx, rhy);
  ctx.quadraticCurveTo(rhx - 14, rhy - 24, rhx - 6 - loopR * 0.7, rhy - 40 + Math.sin(spin) * 4);
  ctx.stroke();
  ctx.restore();
}

/* ================================================================== *
 *  HEAT SHIMMER  (self-copy of a band above the horizon)
 * ================================================================== */
/* Copying strips of the canvas onto itself stalls the rasteriser badly, so the
   band is lifted into a scratch buffer once and the wobbly strips are drawn
   back from there. */
const shCv = document.createElement("canvas");
const shCtx = shCv.getContext("2d");

function heatShimmer(strength) {
  const y0 = Math.round(Math.max(0, HZ - H * 0.10) * DPR);
  const hh = Math.min(Math.round(H * 0.13 * DPR), cv.height - y0);
  if (hh <= 4) return;

  if (shCv.width !== cv.width || shCv.height !== hh) { shCv.width = cv.width; shCv.height = hh; }
  shCtx.setTransform(1, 0, 0, 1, 0, 0);
  shCtx.clearRect(0, 0, shCv.width, hh);
  shCtx.drawImage(cv, 0, y0, cv.width, hh, 0, 0, cv.width, hh);

  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const step = Math.max(3, Math.round(4 * DPR));
  for (let y = 0; y < hh; y += step) {
    const u = y / hh;
    const h2 = Math.min(step, hh - y);
    const amp = strength * (1 - Math.abs(u - 0.6)) * 5 * DPR;
    const dx = Math.sin(y * 0.09 + S.t * 4.2) * amp + Math.sin(y * 0.031 - S.t * 2.1) * amp * 0.7;
    ctx.drawImage(shCv, 0, y, shCv.width, h2, dx, y0 + y, shCv.width, h2);
  }
  ctx.restore();
}

/* ================================================================== *
 *  FOREGROUND
 * ================================================================== */
function drawForeground() {
  const spacing = 1050;
  const scroll = S.dist * layerSpeed(0.98) * 1.25;
  const i0 = Math.floor((scroll - spacing) / spacing);
  const blur = 9 + S.boost * 16;          // whip-past motion smear
  ctx.save();
  for (let i = i0; i <= i0 + Math.ceil(W / spacing) + 2; i++) {
    if (rnd(i, 301) < 0.30) continue;
    const x = i * spacing + rnd(i, 302) * spacing * 0.7 - scroll;
    if (x < -400 || x > W + 400) continue;
    const s = (1.8 + rnd(i, 303) * 1.2) * (UNIT / 780);
    const cactus = rnd(i, 304) > 0.45;
    // three offset passes read as a blurred object rushing by
    for (let b = -1; b <= 1; b++) {
      ctx.globalAlpha = b === 0 ? 0.86 : 0.30;
      const dx = x + b * blur;
      if (cactus) drawCactus(dx, H + 30, s * 1.5, i * 7 + 3, PAL.fg);
      else        drawBrush(dx, H + 14, s * 2.2, i * 11 + 5, PAL.fg);
    }
  }
  ctx.restore();

  // low sand haze sweeping past
  ctx.save();
  for (let i = 0; i < 5; i++) {
    const sp = 900 + i * 420;
    const x = (W + 500) - (((S.dist * sp * 0.0022 + i * 900) % (W + 1000)));
    const y = H - 10 - i * 16;
    ctx.globalAlpha = 0.12;
    const g = ctx.createLinearGradient(x - 300, 0, x + 300, 0);
    g.addColorStop(0,   rgba(PAL.dust, 0));
    g.addColorStop(0.5, rgba(PAL.dust, 0.8));
    g.addColorStop(1,   rgba(PAL.dust, 0));
    ctx.fillStyle = g;
    ctx.fillRect(x - 300, y - 16, 600, 26);
  }
  ctx.restore();
}

function drawSpeedLines(amount) {
  if (amount <= 0.01) return;
  ctx.save();
  ctx.globalCompositeOperation = "screen";
  for (let i = 0; i < 26; i++) {
    const y = rnd(i, 401) * H;
    const len = (90 + rnd(i, 402) * 320) * amount;
    const x = ((rnd(i, 403) * W * 2 - S.dist * (2.4 + rnd(i, 404) * 3)) % (W + 700));
    const xx = x < -700 ? x + W + 700 : x;
    ctx.globalAlpha = 0.05 + rnd(i, 405) * 0.10 * amount;
    const g = ctx.createLinearGradient(xx, 0, xx + len, 0);
    g.addColorStop(0,   rgba(PAL.rim, 0));
    g.addColorStop(0.5, rgba(PAL.rim, 0.9));
    g.addColorStop(1,   rgba(PAL.rim, 0));
    ctx.fillStyle = g;
    ctx.fillRect(xx, y, len, 1 + rnd(i, 406) * 2);
  }
  ctx.restore();
}

function drawPost() {
  // global colour wash
  ctx.save();
  ctx.globalCompositeOperation = "overlay";
  ctx.globalAlpha = PAL.washA;
  ctx.fillStyle = PAL.wash;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();

  // vignette (pre-baked; only depends on the viewport)
  if (vigCv) ctx.drawImage(vigCv, 0, 0, W, H);

  // grain
  if (grainPat) {
    ctx.save();
    ctx.globalCompositeOperation = "overlay";
    ctx.globalAlpha = 0.055;
    ctx.translate((Math.random() * 128) | 0, (Math.random() * 128) | 0);
    ctx.fillStyle = grainPat;
    ctx.fillRect(-128, -128, W + 256, H + 256);
    ctx.restore();
  }
}

/* ================================================================== *
 *  MAIN LOOP
 * ================================================================== */
const mphEl = document.getElementById("mph");
const barEl = document.getElementById("boostbar");

const HERO  = { coat:"#6b4430", coatDark:"#4a2c1d", horn:"#d9c79b", shirt:"#c25a3a", hat:"#7d5a34" };
const RIVAL = { coat:"#3c3a3d", coatDark:"#26252a", horn:"#c2b18c", shirt:"#2f6b6a", hat:"#4b4a45" };

let last = performance.now();
let hudSpeed = 0;

function frame(now) {
  let dt = (now - last) / 1000;
  last = now;
  dt = clamp(dt, 0, 0.05);
  requestAnimationFrame(frame);
  if (S.paused) return;

  /* ---- simulation ---- */
  S.t += dt;
  if (palT < 1) { updatePalette(dt); bgDirty = true; }
  if (bgDirty) { buildBackdrop(); buildPuff(); bgDirty = false; }

  // stamina governs how long the spurs keep working
  if (S.boostHeld && S.stamina > 0.02) { S.boost = Math.min(1, S.boost + dt * 3.5); S.stamina = Math.max(0, S.stamina - dt * 0.30); }
  else                                 { S.boost = Math.max(0, S.boost - dt * 2.2); S.stamina = Math.min(1, S.stamina + dt * 0.16); }

  const target = 1 + S.boost * 0.95;
  S.speed += (target - S.speed) * Math.min(1, dt * 3.2);

  S.dist  += S.speed * 430 * dt;
  S.phase += S.speed * 2.15 * dt;

  hudTimer += dt;
  if (hudTimer > 7) keysEl.classList.add("fade");

  updateWeeds(dt);
  updateDust(dt);

  /* ---- hero placement ---- */
  const heroV = 0.56;
  const heroY = groundY(heroV);
  const heroScale = (UNIT * 0.40) / 250 * lerp(1, 1.03, S.boost);
  const heroX = W * (W < 640 ? 0.46 : 0.40) + Math.sin(S.t * 0.7) * W * 0.005;

  // hoof-strike dust: two beats per stride
  const beat = Math.floor(S.phase * 2);
  if (beat !== frame.lastBeat) {
    frame.lastBeat = beat;
    const n = 5 + Math.round(S.boost * 6);
    for (let i = 0; i < n; i++)
      puff(heroX - 70 * heroScale + (Math.random() - 0.5) * 110 * heroScale,
           heroY + (Math.random() - 0.5) * 10,
           0.9 + S.boost * 1.0, 0);
  }
  // continuous rooster-tail behind the hero
  for (let i = 0; i < 2; i++) {
    if (Math.random() < (0.55 + S.boost * 0.4))
      puff(heroX - (90 + Math.random() * 130) * heroScale,
           heroY - Math.random() * 26 * heroScale,
           0.7 + S.boost * 0.7, 0);
  }

  /* ---- render ---- */
  drawSky();
  drawFarRidge();

  drawMesaLayer({ depth:0.035, spacing:520, hMin:0.10, hMax:0.20, wMin:0.16, wMax:0.34,
                  color:PAL.mesaFar, litMix:0.30, alpha:0.85, salt:11, gap:0.22, drop:2 });
  drawMesaLayer({ depth:0.075, spacing:430, hMin:0.07, hMax:0.15, wMin:0.10, wMax:0.26,
                  color:PAL.mesaMid, litMix:0.38, alpha:0.95, salt:29, gap:0.35, drop:6 });

  drawGround();
  heatShimmer(0.55 + S.boost * 0.3);

  drawPropBand({ vMin:0.06, vMax:0.16, spacing:230, salt:51, alpha:0.72, sizeMul:2.6, gap:0.34 });
  drawPropBand({ vMin:0.18, vMax:0.34, spacing:300, salt:73, alpha:0.88, sizeMul:2.2, gap:0.40 });

  // rival racer, half a length back and a touch further out
  const rivalV = 0.44, rivalScale = (UNIT * 0.40) / 250 * 0.80;
  drawBull({
    x: W * 0.135 + Math.sin(S.t * 0.9) * 10, y: groundY(rivalV), scale: rivalScale,
    phase: S.phase * 0.97 + 0.37, flip:false,
    coat:RIVAL.coat, coatDark:RIVAL.coatDark, horn:RIVAL.horn, shirt:RIVAL.shirt, hatCol:RIVAL.hat,
    alpha:0.95, riderTilt: 0.05
  });
  for (let i = 0; i < 2; i++) {
    if (Math.random() < 0.35)
      puff(W * 0.135 - (80 + Math.random() * 70) * rivalScale,
           groundY(rivalV) - Math.random() * 10, 0.35, 0);
  }

  drawDust(false);

  drawPropBand({ vMin:0.36, vMax:0.52, spacing:360, salt:97, alpha:0.95, sizeMul:1.9, gap:0.5 });

  // hero
  drawBull({
    x: heroX, y: heroY, scale: heroScale, phase: S.phase, flip:false,
    coat:HERO.coat, coatDark:HERO.coatDark, horn:HERO.horn, shirt:HERO.shirt, hatCol:HERO.hat,
    alpha:1, riderTilt: S.boost * 0.10
  });

  drawWeeds();
  drawDust(true);
  drawSpeedLines(S.boost);
  drawForeground();
  drawPost();

  /* ---- HUD ---- */
  hudSpeed += ((22 + S.speed * 19) - hudSpeed) * Math.min(1, dt * 4);
  mphEl.textContent = String(Math.round(hudSpeed)).padStart(2, "0");
  barEl.style.width = (S.stamina * 100).toFixed(0) + "%";
  barEl.style.background = S.stamina < 0.25 ? "#e0653c" : "#ffcf7a";
}
frame.lastBeat = -1;

/* ------------------------------------------------------------------ *
 *  Boot
 * ------------------------------------------------------------------ */
resize();
updatePalette(1);
buildBackdrop();
buildPuff();
seedWeeds();
requestAnimationFrame(frame);
window.addEventListener("resize", seedWeeds);

})();
</script>
</body>
</html>
